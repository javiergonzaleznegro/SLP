<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C1B2A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180-v6.png">
<title>TAVI · Tarjetero de vocabulario</title>
<style>
:root{
  --ink:#0C1B2A;        /* azul carta náutica, fondo */
  --panel:#13283C;      /* paneles */
  --line:#24405A;       /* líneas y bordes */
  --ivory:#EFE7D6;      /* texto principal */
  --faded:#7FA3C0;      /* texto secundario */
  --brass:#C9A063;      /* latón: acento e instrumento */
  --fav:#F5C84B;        /* amarillo señal: las palabras del día */
  --ok:#4CAF7D;         /* verde señal */
  --bad:#C75B4E;        /* rojo señal */
  --disp:Futura,'Avenir Next Condensed','Trebuchet MS',sans-serif;
  --body:'Avenir Next',Avenir,-apple-system,'Segoe UI',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{
  font-family:var(--body);color:var(--ivory);background:var(--ink);
  background-image:radial-gradient(1200px 600px at 50% -200px,#16304a 0%,var(--ink) 70%);
  min-height:100vh;padding:env(safe-area-inset-top) 0 40px;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header{padding:18px 0 10px;text-align:center;border-bottom:1px solid var(--line)}
.tavi{font-family:Copperplate,"Copperplate Gothic Bold",Futura,var(--disp);
  font-size:36px;font-weight:600;letter-spacing:.34em;text-indent:.34em;line-height:1;
  color:var(--brass);text-shadow:0 1px 0 rgba(0,0,0,.45)}
.pair{display:flex;align-items:center;justify-content:center;gap:9px;margin-top:10px;
  font-family:var(--disp);font-size:10px;letter-spacing:.24em;text-transform:uppercase;color:var(--faded)}
.pair svg{flex:none}
h2{font-family:var(--disp);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--brass);margin:22px 0 12px}
.sub{color:var(--faded);font-size:14px;line-height:1.5}

/* ---------- instrumento de puntos ---------- */
.gauge{display:flex;justify-content:center;margin:24px 0 8px}
.dial{position:relative;width:190px;height:190px}
.dial svg{position:absolute;inset:0}
.dial .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .num b{font-family:var(--disp);font-weight:600;font-size:52px;letter-spacing:.02em;color:var(--ivory)}
.dial .num span{font-family:var(--disp);font-size:10px;letter-spacing:.3em;color:var(--brass);text-transform:uppercase;margin-top:2px}
.stats{display:flex;gap:10px;margin:14px 0 20px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:22px;font-weight:600}
.stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faded)}
.pipeline{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin:-6px 0 16px;font-size:13px;color:var(--faded);flex-wrap:wrap}
.pipeline b{color:var(--ivory);font-family:var(--disp);font-size:16px;margin-left:3px}
.goal{border-left:3px solid var(--brass);background:#0e2033;border-radius:0 12px 12px 0;padding:11px 14px;margin:-4px 0 16px;font-size:14px;line-height:1.45;color:var(--ivory)}
.version{text-align:center;font-family:var(--disp);font-size:9px;letter-spacing:.12em;line-height:2;text-transform:uppercase;color:var(--line);margin-top:24px}
.actrow{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:12px}
.actrow b{font-family:var(--disp);font-size:38px;font-weight:600;color:var(--brass);line-height:1}
.barwrap{height:10px;background:var(--ink);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.barwrap i{display:block;height:100%;background:var(--brass);border-radius:6px}
.version span{text-transform:none}

/* ---------- botones ---------- */
.menu{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
button{font-family:var(--body);cursor:pointer;border:none;border-radius:14px;font-size:16px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.big{display:flex;justify-content:space-between;align-items:center;width:100%;
  background:var(--panel);border:1px solid var(--line);color:var(--ivory);
  padding:16px 18px;min-height:56px;text-align:left}
.big .n{font-family:var(--disp);color:var(--brass);font-size:18px;font-weight:600}
.big:active{background:#1a3350}
.primary{background:var(--brass);color:#20180b;font-weight:600;padding:15px;width:100%;min-height:52px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--faded);padding:13px;width:100%;min-height:48px}
.okbtn{background:var(--ok);color:#0b2416;font-weight:600;padding:15px;flex:1;min-height:52px}
.badbtn{background:var(--bad);color:#2b0f0b;font-weight:600;padding:15px;flex:1;min-height:52px}
.row{display:flex;gap:10px}
.back{background:none;color:var(--faded);font-size:14px;padding:14px 0;letter-spacing:.1em;text-transform:uppercase;font-family:var(--disp)}

/* ---------- fichas ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.levelrow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.chev{display:flex;gap:3px}
.chev i{width:14px;height:8px;background:var(--line);display:block;transform:skewX(-18deg);border-radius:2px}
.chev i.on{background:var(--brass)}
.chev i.star{width:10px;height:10px;transform:none;border-radius:50%}
.lvltxt{font-family:var(--disp);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faded)}
.dirpill{margin-left:auto;font-family:var(--disp);font-size:10px;letter-spacing:.14em;color:var(--ink);
  background:var(--faded);border-radius:20px;padding:3px 9px}
.word{font-size:27px;font-weight:600;line-height:1.2}
.ipa{font-family:var(--serif);color:var(--brass);font-size:17px;margin-top:2px}
.sense{display:inline-block;font-size:12px;color:var(--faded);border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin-top:8px}
.phrase{font-family:var(--serif);font-size:17px;line-height:1.5;margin-top:12px}
.phrase.es{color:var(--faded)}
.speak{background:transparent;border:1px solid var(--brass);color:var(--brass);border-radius:24px;
  padding:7px 16px;font-size:14px;margin-top:12px}
.divider{border-top:1px dashed var(--line);margin:16px 0}
.progress{font-family:var(--disp);font-size:11px;letter-spacing:.2em;color:var(--faded);text-transform:uppercase;text-align:center;margin:14px 0}
.hint{font-size:13px;color:var(--faded);margin-top:8px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--brass);color:#20180b;
  font-weight:600;border-radius:24px;padding:10px 22px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
textarea{width:100%;min-height:110px;background:var(--ink);border:1px solid var(--line);border-radius:12px;
  color:var(--ivory);font-family:Menlo,monospace;font-size:12px;padding:10px;margin:8px 0}
input[type=date],input[type=search]{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:12px;
  color:var(--ivory);font-family:var(--body);font-size:16px;padding:12px;margin:10px 0 4px}
input[type=search]{-webkit-appearance:none;appearance:none}
.hitrow{display:flex;align-items:baseline;gap:8px;padding:12px 2px;border-bottom:1px solid var(--line)}
.hitrow b{font-size:17px;color:var(--ivory);font-weight:600}
.hitrow span{color:var(--faded);font-size:14px}
.chips{display:flex;gap:7px;overflow-x:auto;padding:10px 0 2px;-webkit-overflow-scrolling:touch}
.chip{flex:none;background:transparent;border:1px solid var(--line);color:var(--faded);border-radius:20px;
  padding:7px 14px;font-size:13px}
.chip.on{background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600}
.hitrow i{margin-left:auto;font-family:var(--disp);font-size:10px;letter-spacing:.1em;color:var(--brass);text-transform:uppercase;font-style:normal;white-space:nowrap}
.hidden{display:none}
.assocbtn{background:transparent;border:1px dashed var(--brass);color:var(--brass);border-radius:24px;
  padding:8px 16px;font-size:14px;margin-top:12px;width:100%}
.assoc{margin-top:12px;background:#0e2033;border:1px solid var(--line);border-left:3px solid var(--brass);
  border-radius:0 12px 12px 0;padding:14px 16px}
.amn{margin:0 0 12px;font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--ivory)}
.amn:last-child{margin-bottom:0}
.amn span{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:3px}
.seen{font-family:var(--disp);font-size:10px;letter-spacing:.1em;color:var(--faded);margin-left:auto;text-transform:uppercase}
/* ---- Palabras del día (favoritas) ---- */
.rgt{margin-left:auto;display:flex;align-items:center;gap:10px}
.rgt .seen{margin-left:0}
.favbtn{flex:none;background:transparent;border:0;padding:0;margin:-14px -8px -14px 0;
  font-size:21px;line-height:1;color:var(--faded);cursor:pointer;touch-action:manipulation;
  -webkit-user-select:none;user-select:none;min-width:48px;min-height:48px}
.favbtn.on{color:var(--fav)}
.card.fav{border-color:var(--fav);background:linear-gradient(180deg,#1b2c33 0%,var(--panel) 60%)}
.card.fav .word{color:var(--fav)}
.card.fav .lvltxt{color:var(--fav)}
.favbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0 4px;
  border:1px solid var(--fav);border-radius:12px;padding:10px 14px;
  background:rgba(245,200,75,.08);font-size:13px;color:var(--fav)}
.favbar b{font-family:var(--disp);letter-spacing:.06em;font-weight:600}
.favbar i{font-style:normal;color:var(--faded);font-size:12px}
.favbar button{margin-left:auto;flex:none;background:transparent;border:1px solid var(--line);
  color:var(--faded);border-radius:20px;padding:7px 14px;font-size:12px;min-height:36px;
  touch-action:manipulation}
.empty{text-align:center;color:var(--faded);padding:40px 10px;font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="tavi">TAVI</div>
    <div class="pair">Español<svg viewBox="0 0 22 14" width="22" height="14" aria-hidden="true"><g stroke="#C9A063" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"><path d="M1.5 4.5h15M13 1.5l3.5 3-3.5 3"/><path d="M20.5 9.5h-15M9 12.5l-3.5-3 3.5-3"/></g></svg>Inglés</div>
  </header>
  <main id="app"></main>
</div>
<div class="toast" id="toast"></div>

<script>
/* ================= DATOS INICIALES ================= */
const SEED = [
{id:"underway-nav",en:"underway",es:"en marcha, navegando",sense:"náutico: hacerse a la mar",ipa:"/ˌʌndəˈweɪ/",fen:"The ship got underway at dawn.",fes:"El buque se hizo a la mar al amanecer."},
{id:"underway-gen",en:"underway",es:"en curso, en desarrollo",sense:"general: algo que ya ha empezado",ipa:"/ˌʌndəˈweɪ/",fen:"A new training programme is underway.",fes:"Un nuevo programa de instrucción está en curso."},
{id:"watch-guard",en:"watch",es:"guardia",sense:"turno de servicio a bordo",ipa:"/wɒtʃ/",fen:"I am on watch from midnight to four.",fes:"Estoy de guardia de doce a cuatro.",assoc:{bridge:"el reloj (watch) con gorra",scene:"El oficial de guardia es un RELOJ de pared gigante con gorra de plato, plantado en el puente, vigilando sus cuatro horas. Cuando termina el turno, se le acaba la cuerda y se queda tieso.",funny:"Al relevarlo le dan cuerda con una llave del tamaño de un timón y revive de golpe, pidiendo café.",recall:"El reloj que vigila su turno: watch = guardia (y reloj, y vigilar).",why:"Es el mismo watch del reloj de pulsera: una guardia no es otra cosa que un turno medido por el reloj."}},
{id:"drill-sim",en:"drill",es:"simulacro, ejercicio",sense:"práctica de adiestramiento",ipa:"/drɪl/",fen:"We ran a fire drill before getting underway.",fes:"Hicimos un simulacro de incendio antes de zarpar.",assoc:{bridge:"el taladro (drill) que repite y repite",scene:"Suena la alarma y toda la dotación corre al simulacro de incendio. Quien lo dirige lleva un TALADRO gigante y perfora el mismo punto una vez, y otra, y otra: repetir hasta que salga perfecto.",funny:"El taladro atraviesa la cubierta y asoma en la cámara de oficiales, justo en mitad del café de la mañana.",recall:"Repetir el mismo movimiento hasta dominarlo: drill = simulacro, ejercicio.",why:"Es la misma palabra que taladro, y por el mismo motivo: ambos consisten en repetir el mismo gesto sin parar."}},
{id:"drill-tool",en:"drill",es:"taladro",sense:"herramienta",ipa:"/drɪl/",fen:"You will need a drill to fix that bracket.",fes:"Necesitarás un taladro para fijar ese soporte."},
{id:"vessel",en:"vessel",es:"buque, embarcación",sense:"término formal",ipa:"/ˈvesl/",fen:"All vessels must report their position.",fes:"Todos los buques deben comunicar su posición.",assoc:{bridge:"vasija (misma raíz: latín vascellum)",scene:"En mitad de la bahía flota un VASO gigante de cristal con la dotación dentro, saludando desde el borde. Un buque no es más que un recipiente que flota.",funny:"Un gigante se acerca a beber del vaso y se lleva a media dotación en el primer trago.",recall:"El recipiente que flota: vessel = buque, embarcación.",why:"vessel y «vasija» vienen de la misma palabra latina. Por eso en inglés vessel también es un recipiente."}},
{id:"readiness",en:"readiness",es:"alistamiento, disponibilidad",sense:"estado de preparación",ipa:"/ˈredinəs/",fen:"The crew maintained a high state of readiness.",fes:"La dotación mantuvo un alto grado de alistamiento."},
{id:"deploy",en:"deploy",es:"desplegar",sense:"enviar fuerzas o medios",ipa:"/dɪˈplɔɪ/",fen:"The unit was deployed overseas for six months.",fes:"La unidad fue desplegada en el extranjero seis meses."},
{id:"deterrence",en:"deterrence",es:"disuasión",sense:"estrategia de defensa",ipa:"/dɪˈterəns/",fen:"Nuclear deterrence remains a pillar of NATO strategy.",fes:"La disuasión nuclear sigue siendo un pilar de la estrategia de la OTAN.",assoc:{bridge:"de terror",scene:"Ante la puerta del castillo, un dragón colosal escupe fuego solo para enseñar lo que puede hacer. Los ejércitos enemigos, muertos DE TERROR, dan media vuelta sin llegar a atacar: nadie se atreve.",funny:"El dragón ni pelea; basta con que bostece llamas y una tostada gigante cae del cielo para que huyan todos.",recall:"Meter tanto miedo que el enemigo no se atreva a atacar es deterrence: disuasión.",why:"«deter» suena a «de terror»; el enemigo que se retira aterrado sin combatir fija «disuadir»."}},
{id:"chain-command",en:"chain of command",es:"cadena de mando",sense:"jerarquía militar",ipa:"/tʃeɪn əv kəˈmɑːnd/",fen:"Report the issue through the chain of command.",fes:"Comunica el problema por la cadena de mando."},
{id:"roe",en:"rules of engagement",es:"reglas de enfrentamiento",sense:"normas de uso de la fuerza",ipa:"/ruːlz əv ɪnˈɡeɪdʒmənt/",fen:"The rules of engagement were briefed before the mission.",fes:"Las reglas de enfrentamiento se expusieron antes de la misión."},
{id:"briefing",en:"briefing",es:"reunión informativa, exposición",sense:"antes de una actividad",ipa:"/ˈbriːfɪŋ/",fen:"Attendance at the morning briefing is mandatory.",fes:"La asistencia a la reunión informativa matinal es obligatoria."},
{id:"liaison",en:"liaison",es:"enlace",sense:"persona o función de coordinación",ipa:"/liˈeɪzɒn/",fen:"She acts as liaison between both navies.",fes:"Ella actúa de enlace entre ambas armadas.",assoc:{bridge:"Leia (Star Wars)",scene:"La princesa LEIA corre de una base rebelde a otra sin descanso, llevando mensajes secretos en un holograma («ayúdame, Obi-Wan»). Es la que conecta y coordina a los dos bandos para que se entiendan.",funny:"Lleva tantos mensajes a la vez que los moños se le llenan de notas adhesivas y parece un tablón de anuncios andante.",recall:"La persona que enlaza y coordina a dos partes es liaison: enlace.",why:"«liaison» empieza sonando como «Lei-a»; Leia haciendo de puente entre bandos fija «enlace»."}},
{id:"overhaul",en:"overhaul",es:"revisión general, puesta a punto",sense:"mantenimiento a fondo",ipa:"/ˈəʊvəhɔːl/",fen:"The engine needs a complete overhaul.",fes:"El motor necesita una revisión general completa.",assoc:{bridge:"over + haul (halar, tirar del cabo)",scene:"En el dique, la dotación HALA todos los cabos del aparejo y los va pasando POR ENCIMA, uno a uno, palmo a palmo, sin dejarse ni un chicote. De ahí nació la palabra: repasar el aparejo entero tirando de él.",funny:"Halan con tantas ganas que el buque sale del agua y queda colgando como un jamón en la viga.",recall:"Repasar el aparejo entero, cabo por cabo, es overhaul: revisión general a fondo.",why:"Etimología náutica real: over + haul (halar). Era literalmente pasar revista al aparejo tirando de cada cabo; hoy vale para el motor entero."}},
{id:"seamanship",en:"seamanship",es:"marinería, arte de navegar",sense:"destreza del marino",ipa:"/ˈsiːmənʃɪp/",fen:"Good seamanship prevented a collision.",fes:"La buena marinería evitó un abordaje."},
{id:"convey",en:"convey",es:"transmitir",sense:"una idea o sensación",ipa:"/kənˈveɪ/",fen:"It is hard to convey how demanding sea duty is.",fes:"Es difícil transmitir lo exigente que es el servicio en la mar.",assoc:{bridge:"conveyor belt (cinta transportadora)",scene:"Una CINTA TRANSPORTADORA gigante sale de la cabeza de una persona y lleva sus ideas, envueltas como paquetes, directas a la cabeza de otra. Cada idea viaja por la cinta y se entrega intacta al otro lado.",funny:"Una idea demasiado grande atasca la cinta y hay que empujarla con una carretilla entre tres operarios.",recall:"Llevar una idea de una mente a otra y entregarla es convey: transmitir.",why:"convey está dentro de «conveyor belt», la cinta que transporta; y es justo lo que hace Leia (liaison), que convey sus mensajes de un bando a otro."}},
{id:"grasp-und",en:"grasp",es:"comprender, captar",sense:"entender una idea",ipa:"/ɡrɑːsp/",fen:"It took me a while to grasp the concept.",fes:"Tardé un poco en captar el concepto.",assoc:{bridge:"grasp suena a grapa: agarrar con el puño",scene:"Hulk, verde y enorme, ve flotar una idea como una bombilla encendida. La AGARRA al vuelo y la aprieta en el puño con la fuerza de una GRAPA de acero. Al abrir la mano se le ilumina la cara: la ha entendido.",funny:"De tanto apretarla la idea sale aplastada como un acordeón y tiene que inflarla soplando antes de usarla.",recall:"Agarrar una idea con la mano es entenderla: grasp = comprender, captar.",why:"«grasp» suena a «grapa» y agarrar es la base. En español hacemos lo mismo: «captar» y «pillar» una idea. Es el mismo grasp de sujetar con la mano."}},
{id:"grasp-hold",en:"grasp",es:"agarrar, asir",sense:"sujetar con la mano",ipa:"/ɡrɑːsp/",fen:"He grasped the rail as the ship rolled.",fes:"Se agarró al pasamanos cuando el buque dio un balance.",assoc:{bridge:"grapa",scene:"Hulk, furioso y verde, AGARRA una grapadora del tamaño de un autobús. De un puñetazo clava una GRAPA de acero que une dos rascacielos, y luego se agarra él mismo a un puente con las dos manos para no caer.",funny:"La grapa es tan grande que las palomas la usan de tobogán.",recall:"El agarre bestial de Hulk sujetando la grapa es grasp: agarrar con fuerza.",why:"«grasp» suena a «grap(a)»; el agarre potente fija el significado."}},
{id:"foster",en:"foster",es:"fomentar",sense:"favorecer el desarrollo de algo",ipa:"/ˈfɒstə/",fen:"Sport fosters discipline and teamwork.",fes:"El deporte fomenta la disciplina y el trabajo en equipo.",assoc:{bridge:"fósforo",scene:"Un jardinero enciende un FÓSFORO diminuto y lo acerca a una semilla. Al instante brota un bosque entero a cámara rápida: árboles disparándose al cielo, flores explotando de colores, lianas trepando por todas partes.",funny:"El jardinero sale volando por los aires montado en un girasol de treinta metros que no para de crecer.",recall:"El fósforo que hace crecer todo de golpe es foster: fomentar, hacer crecer.",why:"«foster» suena a «fósfor(o)»; la explosión de crecimiento representa «fomentar»."}},
{id:"hone",en:"hone",es:"perfeccionar, pulir",sense:"una destreza",ipa:"/həʊn/",fen:"I am honing my writing skills for the exam.",fes:"Estoy puliendo mi expresión escrita para el examen.",assoc:{bridge:"jonrón (home run)",scene:"Un bateador obsesivo lija y PULE su bate día y noche, hasta dejar la madera perfecta y reluciente. Cuando por fin lo tiene a punto, sale al campo, batea y clava un JONRÓN que manda la bola hasta la Luna.",funny:"Ha pulido tanto el bate que la pelota rebota como si tocara un espejo y no vuelve a caer nunca.",recall:"Pulir la herramienta con obsesión hasta dominar el golpe es hone: perfeccionar, pulir una destreza.",why:"«hone» suena al «hon-» de «home run/jonrón»; pulir el bate hasta la maestría representa «pulir una destreza», igual que pules tu inglés en la frase."}},
{id:"strive",en:"strive",es:"esforzarse",sense:"por conseguir algo",ipa:"/straɪv/",fen:"We strive to improve a little every day.",fes:"Nos esforzamos por mejorar un poco cada día.",assoc:{bridge:"estribo",scene:"Un jinete diminuto intenta subir a un caballo de diez metros de alto. Se agarra al ESTRIBO gigante y trepa con todas sus fuerzas: suda a chorros, resopla, los músculos a punto de reventar, mientras el caballo relincha impaciente.",funny:"Cada vez que resbala, cae sobre un montón de heno y vuelve a empezar, ya con siete pares de zapatillas rotas.",recall:"Ese esfuerzo sobrehumano por subir al estribo es strive: esforzarse al límite.",why:"«strive» suena a «estribo», y la imagen del esfuerzo brutal ancla el significado."}},
{id:"address-issue",en:"address",es:"abordar, tratar",sense:"un problema o asunto",ipa:"/əˈdres/",fen:"The report fails to address the real issue.",fes:"El informe no aborda el problema de fondo.",assoc:{bridge:"address = dirección postal",scene:"El almirante coge el problema, que es un bulto enorme con patas, le pega encima un SOBRE con la DIRECCIÓN correcta y lo manda al departamento que debe resolverlo. Así lo aborda: poniéndole dirección.",funny:"El bulto no entra en el buzón y hay que meterlo a patadas entre tres, con el sobre torcido.",recall:"Ponerle dirección a un problema es abordarlo: address = abordar, tratar.",why:"Es la misma address de la dirección postal: diriges algo hacia donde debe ir."}},
{id:"address-speak",en:"address",es:"dirigirse a",sense:"hablar ante un grupo",ipa:"/əˈdres/",fen:"The admiral addressed the crew before departure.",fes:"El almirante se dirigió a la dotación antes de la salida.",assoc:{bridge:"address = dirección, la del sobre",scene:"El almirante sube al estrado y DIRIGE sus palabras a la dotación formada. No habla al aire: cada frase sale con la DIRECCIÓN puesta, como un sobre con su destinatario. Va a ellos y a nadie más.",funny:"Las palabras salen de su boca convertidas en sobres que vuelan en formación y aterrizan en cada gorra.",recall:"Dirigir las palabras a alguien: address = dirigirse a.",why:"address es la dirección del sobre: diriges algo hacia donde debe ir. Lo mismo que cuando address es abordar un problema."}},
{id:"issue-problem",en:"issue",es:"asunto, problema",sense:"cuestión a tratar",ipa:"/ˈɪʃuː/",fen:"Fatigue is a serious issue on long deployments.",fes:"La fatiga es un problema serio en despliegues largos.",assoc:{bridge:"issue = salida (del francés issir, salir)",scene:"Hay una puerta enorme con el cartel ISSUE por la que SALE todo lo que tiene que salir. Hoy sale un problema gordo, con patas y mala cara, que se planta en mitad del pasillo.",funny:"Intentan cerrarle la puerta y el problema mete el pie justo a tiempo, como un comercial.",recall:"Lo que sale y hay que tratar: issue = asunto, problema.",why:"Etimología real: issue era «salida». Un asunto es algo que ha salido y está ahí."}},
{id:"issue-give",en:"issue",es:"entregar, distribuir",sense:"material o equipo oficial",ipa:"/ˈɪʃuː/",fen:"New uniforms were issued to the whole crew.",fes:"Se entregaron uniformes nuevos a toda la dotación.",assoc:{bridge:"issue = salida: la puerta del pañol",scene:"Una puerta enorme con el cartel ISSUE: por ahí SALE todo lo que tiene que salir. Hoy salen uniformes nuevos, planchados y en fila, que se van colocando solos sobre la dotación formada.",funny:"Al último marinero le sale un uniforme de talla gigante y queda dentro como en una tienda de campaña.",recall:"Lo que sale del pañol y se reparte: to issue = entregar, distribuir.",why:"Misma raíz que issue «asunto»: lo que sale por esa puerta. Si sale un problema, es un asunto; si sale material, lo están entregando."}},
{id:"account-explain",en:"account for",es:"explicar, justificar",sense:"dar razón de algo",ipa:"/əˈkaʊnt fɔː/",fen:"How do you account for the delay?",fes:"¿Cómo explicas el retraso?",assoc:{bridge:"account = cuenta",scene:"Te piden CUENTAS del retraso. Subes al estrado con un ábaco gigante y vas pasando bolas mientras explicas minuto a minuto dónde se fue cada uno.",funny:"Una bola se suelta, sale disparada y rompe la ventana del fondo; tienes que explicar eso también.",recall:"Dar cuentas de algo es explicarlo: account for = explicar, justificar.",why:"account es cuenta; «dar cuenta de algo» existe igual en español."}},
{id:"account-share",en:"account for",es:"representar, suponer",sense:"una parte o proporción",ipa:"/əˈkaʊnt fɔː/",fen:"Fuel accounts for a third of the budget.",fes:"El combustible representa un tercio del presupuesto.",assoc:{bridge:"account = cuenta: el ábaco que mide",scene:"Te preguntan cuánto pesa el combustible en el presupuesto. Sacas un ÁBACO gigante y apartas sus bolas: ocupan una fila entera de las tres. Un tercio del total es suyo.",funny:"Las bolas del combustible están tan gordas que no dejan sitio a las demás y se caen al suelo.",recall:"Contar cuánto ocupa dentro del total: account for = representar, suponer.",why:"account es cuenta: aquí no das cuentas, cuentas cuánto ocupa. Misma raíz que account for «dar razón de algo»."}},
{id:"carry-out",en:"carry out",es:"llevar a cabo, realizar",sense:"una tarea o plan",ipa:"/ˈkæri aʊt/",fen:"The inspection was carried out last week.",fes:"La inspección se llevó a cabo la semana pasada.",assoc:{bridge:"carry = llevar; out = hasta fuera, hasta el final",scene:"Te dan una orden metida en una caja. No basta con cogerla: la LLEVAS hasta la puerta y la sacas FUERA, al mundo real, donde ya está hecha.",funny:"El que la lleva hasta media cubierta y la suelta ve cómo la caja le persigue por el pasillo hasta que la saca entera.",recall:"Llevar algo hasta fuera, hasta que está hecho: carry out = llevar a cabo.",why:"En español decimos igual: llevar a CABO, llevarlo hasta el extremo. Ese extremo es el out."}},
{id:"comply",en:"comply with",es:"cumplir, acatar",sense:"una norma u orden",ipa:"/kəmˈplaɪ wɪð/",fen:"All personnel must comply with safety regulations.",fes:"Todo el personal debe cumplir las normas de seguridad.",assoc:{bridge:"comply suena a «cumplo»",scene:"Un inspector te planta delante un reglamento del tamaño de una puerta. Te cuadras y dices COMPLY, que suena a CUMPLO. El reglamento se cierra satisfecho.",funny:"El que lo dice con los dedos cruzados ve cómo el reglamento se abre solo por la página que ha incumplido.",recall:"COMPLY suena a CUMPLO: comply with = cumplir, acatar.",why:"Mismo origen latino que «cumplir». Y ojo: siempre lleva WITH detrás, nunca va solo."}},
{id:"assess",en:"assess",es:"evaluar, valorar",sense:"analizar una situación",ipa:"/əˈses/",fen:"We need to assess the damage before sailing.",fes:"Tenemos que evaluar los daños antes de navegar."},
{id:"nevertheless",en:"nevertheless",es:"no obstante, sin embargo",sense:"conector formal de contraste",ipa:"/ˌnevəðəˈles/",fen:"The sea was rough; nevertheless, we completed the exercise.",fes:"La mar estaba dura; no obstante, completamos el ejercicio.",assoc:{bridge:"never + the + less (nunca lo menos)",scene:"Al orador le cortan el micrófono, le apagan la luz y le echan un jarro de agua fría encima. Y aun así NUNCA se hace MENOS: se sube a la mesa y termina el discurso a voz en grito, chorreando.",funny:"Media bancada le aplaude con guantes de boxeo puestos, que suenan como truenos.",recall:"Nunca menos, pase lo que pase: nevertheless = no obstante, sin embargo.",why:"Pártela en never + the + less: por mucho que le echen encima, no se reduce ni un milímetro."}},
{id:"furthermore",en:"furthermore",es:"además, es más",sense:"conector formal de adición",ipa:"/ˌfɜːðəˈmɔː/",fen:"Furthermore, the new system reduces fuel consumption.",fes:"Además, el nuevo sistema reduce el consumo de combustible."},
{id:"albeit",en:"albeit",es:"aunque, si bien",sense:"concesivo culto",ipa:"/ɔːlˈbiːɪt/",fen:"It was a useful course, albeit a demanding one.",fes:"Fue un curso útil, aunque exigente.",assoc:{bridge:"all be it → «aunque (así) sea»",scene:"Un caballero medieval negocia la rendición de un castillo. El enemigo le ofrece un trato durísimo y él, cruzándose de brazos, acaba cediendo a regañadientes: «Está bien... ALL BE IT (sea como sea, aunque me cueste sangre), acepto el trato».",funny:"Firma con cara de asco mientras el dragón, detrás, le seca una lágrima con la punta del ala.",recall:"Ese «sí, pero...», ese «sea como sea, aunque no me guste», es albeit: aunque, si bien.",why:"albeit viene de «all be it» (aunque ello sea) y suena «ol-BI-it», con la «be» dentro; el caballero que cede «sea como sea» fija «aunque»."}},
{id:"notwithstanding",en:"notwithstanding",es:"a pesar de, pese a",sense:"concesivo formal",ipa:"/ˌnɒtwɪθˈstændɪŋ/",fen:"Notwithstanding the weather, the drill went ahead.",fes:"A pesar del tiempo, el simulacro siguió adelante.",assoc:{bridge:"not withstanding (nada lo resiste/detiene)",scene:"El mismo caballero del castillo marcha hacia la batalla en mitad de una tormenta brutal: granizo del tamaño de melones, rayos, viento huracanado. Nada lo detiene; avanza A PESAR DE todo, con la armadura humeante.",funny:"El granizo rebota en su yelmo tocando una melodía, pero él sigue caminando como si tal cosa.",recall:"Seguir adelante y que nada te frene, pese a todo, es notwithstanding: a pesar de.",why:"se parte en not + withstanding: nada «resiste/detiene» su avance; el caballero cruzando la tormenta fija «a pesar de»."}},
{id:"hence",en:"hence",es:"por lo tanto, de ahí",sense:"consecuencia formal",ipa:"/hens/",fen:"The radar failed; hence the delay.",fes:"El radar falló; de ahí el retraso.",assoc:{bridge:"hens (gallinas) — suena igual",scene:"El presidente golpea el mazo y anuncia la consecuencia: «el radar falló, POR LO TANTO...». Y por la puerta del hemiciclo entran volando cien GALLINAS cacareando, una por cada consecuencia.",funny:"Las gallinas ponen huevos en los escaños y, al romperse, cada huevo dice con voz grave «por lo tanto».",recall:"Las gallinas que llegan detrás de la causa: hence = por lo tanto, de ahí.",why:"hence suena casi igual que hens. Cuanto más absurdo, mejor se queda pegado."}},
{id:"even-though",en:"even though",es:"aun cuando, a pesar de que",sense:"concesivo con hechos reales",ipa:"/ˈiːvn ðəʊ/",fen:"Even though I was exhausted, I kept studying.",fes:"Aun estando agotado, seguí estudiando.",assoc:{bridge:"though = aunque; even = por mucho que sea así",scene:"Estás empapado y helado en el puente. Es un HECHO, no una hipótesis. Y aun así sigues la guardia hasta el relevo.",funny:"El relevo llega seco porque ha venido por dentro, y no entiende de qué te quejas.",recall:"Aunque sea verdad, sigue siendo así: even though = aun cuando, a pesar de que.",why:"La trampa es EVEN IF. Even though va con hechos reales («llueve, y aun así salgo»); even if va con hipótesis («aunque lloviera, saldría»). Confundirlos canta mucho."}},
{id:"some-extent",en:"to some extent",es:"hasta cierto punto",sense:"matizar una afirmación",ipa:"/tə sʌm ɪkˈstent/",fen:"To some extent, I agree with that view.",fes:"Hasta cierto punto, coincido con esa opinión.",assoc:{bridge:"extent = extensión, hasta dónde llega",scene:"Sacas la cinta métrica y la extiendes, pero no del todo: la paras a la mitad y la sujetas ahí. Hasta ahí llegas, y ni un palmo más.",funny:"La cinta intenta recogerse sola y acabas defendiendo tu matiz a dos manos.",recall:"La cinta extendida solo hasta la mitad: to some extent = hasta cierto punto.",why:"Es el matizador más rentable del examen: te permite dar la razón a medias sin comprometerte. To a large extent, to some extent, to a certain extent."}},
{id:"arguably",en:"arguably",es:"posiblemente, podría decirse",sense:"opinión defendible",ipa:"/ˈɑːɡjuəbli/",fen:"It is arguably the best warship of its class.",fes:"Es posiblemente el mejor buque de guerra de su clase."},
{id:"could-argued",en:"it could be argued that",es:"podría argumentarse que",sense:"introducir opinión con cautela",ipa:"/ɪt kʊd bi ˈɑːɡjuːd ðæt/",fen:"It could be argued that discipline matters more than talent.",fes:"Podría argumentarse que la disciplina importa más que el talento.",assoc:{bridge:"podría argumentarse... ¿por quién? No se dice",scene:"Sueltas una opinión fuerte en la reunión, pero en vez de firmarla la dejas sobre la mesa en un sobre sin remite. La idea está ahí; tu nombre no.",funny:"Alguien pregunta quién lo ha dicho y todos miran al techo, incluido tú.",recall:"La opinión sin remite: it could be argued that = podría argumentarse que.",why:"Es pasiva a propósito: el inglés formal usa este recurso para plantear una idea sin asumirla. En examen escrito da nivel inmediato."}},
{id:"as-far",en:"as far as I am concerned",es:"por lo que a mí respecta",sense:"opinión personal marcada",ipa:"/əz fɑːr əz aɪm kənˈsɜːnd/",fen:"As far as I am concerned, the plan is sound.",fes:"Por lo que a mí respecta, el plan es sólido.",assoc:{bridge:"as far as = hasta donde llega mi terreno",scene:"Trazas un círculo a tu alrededor en la cubierta y dices: dentro de esto decido yo, y esto es lo que opino. Fuera del círculo no me meto.",funny:"El círculo lo pintas tan grande que abarca el puente y el Comandante se encuentra dentro.",recall:"Hasta donde llega mi terreno: as far as I am concerned = por lo que a mí respecta.",why:"Marca que es TU opinión y nada más, y además acota: dentro de mi competencia. Variantes útiles: as far as I know, as far as the budget is concerned."}},
{id:"by-large",en:"by and large",es:"en líneas generales",sense:"valoración global",ipa:"/baɪ ənd lɑːdʒ/",fen:"By and large, the deployment was a success.",fes:"En líneas generales, el despliegue fue un éxito.",assoc:{bridge:"bailan largo (by and large)",scene:"Son las tres de la mañana en una boda. ¿Qué tal ha ido? Ya nadie se acuerda del discurso del padrino ni de si la sopa llegó fría: la pista sigue llena y la gente lleva horas sin sentarse. Si BAILAN LARGO, la boda fue bien.",funny:"El abuelo ha soltado el bastón y se marca un breakdance, y el cura da vueltas con la sotana al hombro y los zapatos en la mano.",recall:"«Bailan largo» suena a by and large: si bailan largo, en líneas generales fue bien.",why:"Aparte del sonido, la escena es el significado: juzgas la boda entera por un indicador amplio, sin entrar en detalles. (De paso: el origen real es náutico, «by» ceñido y «large» a viento largo.)"}},
{id:"inclined",en:"I am inclined to think",es:"me inclino a pensar",sense:"opinión prudente",ipa:"/aɪm ɪnˈklaɪnd tə θɪŋk/",fen:"I am inclined to think we should postpone it.",fes:"Me inclino a pensar que deberíamos posponerlo.",assoc:{bridge:"inclined = inclinado, la balanza que cae de un lado",scene:"Una balanza con los dos platillos casi igualados. Uno baja un poco, solo un poco. No ha tocado la mesa: simplemente se INCLINA hacia ese lado.",funny:"El platillo que sube pide una segunda votación.",recall:"La balanza que se inclina sin llegar a tocar: I am inclined to think = me inclino a pensar.",why:"Es opinión con freno de mano: dices lo que piensas dejando sitio a cambiar de idea. Muy útil cuando no quieres afirmar rotundamente."}},
{id:"actually",en:"actually",es:"en realidad, de hecho",sense:"falso amigo: no significa actualmente",ipa:"/ˈæktʃuəli/",fen:"Actually, the exam is harder than people say.",fes:"En realidad, el examen es más difícil de lo que dicen.",assoc:{bridge:"ACT (acto, hecho)",scene:"En el Tribunal de los Impostores, ACTUALLY sube al estrado disfrazada de «actualmente», con un reloj de pared colgado al cuello y un calendario por capa. El juez le arranca el disfraz de un tirón: debajo lleva grabada la palabra ACT, de acto, de hecho.",funny:"El calendario se desmonta en el aire y las hojas de los meses caen sobre el público mientras la sala entera abuchea.",recall:"No es el tiempo, es la verdad: actually = en realidad, de hecho.",why:"Lleva ACT dentro (acto, hecho) y de ahí «de hecho». El impostor al que desenmascara es «actualmente», que en inglés es currently."}},
{id:"eventually",en:"eventually",es:"finalmente, con el tiempo",sense:"falso amigo: no significa eventualmente",ipa:"/ɪˈventʃuəli/",fen:"Eventually, all that reading pays off.",fes:"Con el tiempo, toda esa lectura da fruto.",assoc:{bridge:"EVENT (evento) + al final de la fila",scene:"EVENTUALLY promete al tribunal que ella significa «a veces, quizá». El juez señala al fondo de la sala: hay una fila interminable de eventos, uno detrás de otro, hasta perderse de vista. Y AL FINAL DE TODOS, por fin, llega el último.",funny:"Al ujier que espera el final de la fila le crece la barba hasta el suelo y se la pisa.",recall:"Al final de todos los eventos: eventually = finalmente, con el tiempo.",why:"Lleva EVENT dentro: lo que pasa al final de la cadena de eventos. Nada que ver con «eventualmente»."}},
{id:"currently",en:"currently",es:"actualmente",sense:"en el momento presente",ipa:"/ˈkʌrəntli/",fen:"I am currently preparing for the SLP exam.",fes:"Actualmente me estoy preparando para el examen SLP.",assoc:{bridge:"CORRIENTE (current)",scene:"Desenmascarada la impostora, entra CURRENTLY montada en una CORRIENTE de agua que atraviesa la sala en este preciso instante, arrastrando papeles y togas.",funny:"El juez tiene que subir los pies al estrado para no mojarse los zapatos, sin perder la compostura.",recall:"La corriente que pasa AHORA: currently = actualmente, en este momento.",why:"Current es corriente y también «presente»; esta sí es la verdadera «actualmente», el puesto que actually intentaba robar."}},
{id:"bear-mind",en:"bear in mind",es:"tener en cuenta",sense:"no olvidar algo al decidir",ipa:"/beər ɪn maɪnd/",fen:"Bear in mind that the interview is the hardest part.",fes:"Ten en cuenta que la entrevista es la parte más difícil.",assoc:{bridge:"bear = llevar encima, cargar con algo",scene:"Sales de la reunión con el plan bajo el brazo y, además, LLEVANDO un dato incómodo en la cabeza: el repuesto tarda seis semanas. No lo sueltas en todo el día.",funny:"El dato pesa tanto que al final del día andas ligeramente inclinado hacia ese lado.",recall:"Llevar el dato encima todo el rato: bear in mind = tener en cuenta.",why:"BEAR es cargar con algo. Es mantenerlo presente mientras decides. Suele ir como aviso: bear in mind that..."}},
{id:"take-account",en:"take into account",es:"tener en cuenta, considerar",sense:"incluir un factor en el análisis",ipa:"/teɪk ˈɪntu əˈkaʊnt/",fen:"The plan takes weather conditions into account.",fes:"El plan tiene en cuenta las condiciones meteorológicas.",assoc:{bridge:"account = cuenta: meterlo en la cuenta",scene:"Haces el cálculo del consumo y, antes de cerrar la cifra, METES EN LA CUENTA la corriente en contra. El número final cambia porque ese factor ya está dentro.",funny:"Metes también en la cuenta el peso del contramaestre, por si acaso.",recall:"Meter el factor dentro de la cuenta: take into account = tener en cuenta, considerar.",why:"Parecido a bear in mind, pero no es lo mismo: bear in mind es recordarlo; take into account es INCLUIRLO en el cálculo o la decisión."}},
{id:"long-run",en:"in the long run",es:"a la larga",sense:"con el paso del tiempo",ipa:"/ɪn ðə lɒŋ rʌn/",fen:"Daily reading pays off in the long run.",fes:"Leer a diario compensa a la larga.",assoc:{bridge:"run = carrera; la larga, no el esprint",scene:"Dos corredores salen a la vez. Uno sale disparado y va primero durante dos minutos. El otro lleva un ritmo aburrido. A los cuarenta kilómetros ya no hay color.",funny:"El que salió disparado va ahora en el coche escoba explicando su estrategia.",recall:"La carrera larga, no los primeros metros: in the long run = a la larga.",why:"Opone el resultado final al inmediato. Su pareja es in the short run o in the short term, y en examen quedan muy bien juntas en la misma frase."}},
{id:"at-stake",en:"at stake",es:"en juego",sense:"lo que se arriesga",ipa:"/ət steɪk/",fen:"The safety of the crew is at stake.",fes:"La seguridad de la dotación está en juego.",assoc:{bridge:"stake = estaca",scene:"En la plaza del castillo hay clavada una ESTACA enorme y atado a ella está lo que más vale del reino: la corona, el cofre y el dragón bebé. Quien pierda la batalla, lo pierde todo.",funny:"El dragón bebé mordisquea la cuerda para soltarse mientras los dos ejércitos se juegan el reino sin mirarlo.",recall:"Lo que está atado a la estaca es lo que te juegas: at stake = en juego.",why:"stake es estaca y también apuesta; lo amarrado a ella es lo que se arriesga."}},
{id:"on-whole",en:"on the whole",es:"en conjunto, en general",sense:"valoración global",ipa:"/ɒn ðə həʊl/",fen:"On the whole, the results were encouraging.",fes:"En conjunto, los resultados fueron alentadores.",assoc:{bridge:"whole = el conjunto entero, no las piezas",scene:"Desmontas una bomba y encuentras tres piezas rayadas. Pero la montas, la pruebas y funciona. Mirada pieza a pieza da miedo; mirada ENTERA, va bien.",funny:"La pieza más rayada es la que mejor funciona y no hay quien lo explique.",recall:"Mirar el conjunto entero y no las piezas: on the whole = en conjunto, en general.",why:"Es la valoración global tras ver los detalles. Va casi siempre al principio de la frase y con coma: On the whole, the exercise was a success."}},
{id:"come-up",en:"come up with",es:"dar con, proponer",sense:"una idea o solución",ipa:"/kʌm ʌp wɪð/",fen:"We need to come up with a better solution.",fes:"Tenemos que dar con una solución mejor.",assoc:{bridge:"come up = subir, asomar a la superficie",scene:"Estás en la cámara dándole vueltas a un problema. De pronto una idea SUBE desde el fondo como una boya y asoma en la superficie delante de ti. La coges.",funny:"Suben tres boyas a la vez y tienes que elegir; las otras dos se hunden ofendidas.",recall:"Lo que sube a la superficie y te traes: come up with = dar con, proponer.",why:"UP es hacia arriba, a la vista; WITH es que te lo traes contigo. La idea no estaba: ha emergido."}},
{id:"deal-with",en:"deal with",es:"afrontar, ocuparse de",sense:"un problema o situación",ipa:"/diːl wɪð/",fen:"Officers must deal with pressure calmly.",fes:"Los oficiales deben afrontar la presión con calma.",assoc:{bridge:"deal = repartir cartas",scene:"El problema se sienta enfrente y te REPARTE las cartas que tiene. No puedes levantarte de la mesa: te toca jugar esa mano.",funny:"El problema reparte y además te mira las cartas por encima del hombro.",recall:"Te reparten la mano y la juegas: deal with = afrontar, ocuparse de.",why:"deal es repartir cartas. Deal with es jugar la mano que te ha tocado, no elegirla."}},
{id:"cope-with",en:"cope with",es:"sobrellevar, arreglárselas con",sense:"algo difícil o prolongado",ipa:"/kəʊp wɪð/",fen:"It is not easy to cope with long periods at sea.",fes:"No es fácil sobrellevar largos periodos en la mar.",assoc:{bridge:"copa (sostenerla llena)",scene:"Te ponen en las manos una COPA gigante y te la van llenando con todo lo que pesa: el despliegue de seis meses, el examen, las guardias. Tú la sostienes con las dos manos y aguantas sin derramar una gota.",funny:"Le echan dentro hasta el dragón, que chapotea, y tú sigues de pie, temblando pero entero.",recall:"Aguantar la copa llena sin derramarla: cope with = sobrellevar, arreglárselas con.",why:"cope suena a «copa»; sostenerla sin volcarla es exactamente lo que significa."}},
{id:"figure-out",en:"figure out",es:"entender, resolver",sense:"tras pensarlo",ipa:"/ˈfɪɡər aʊt/",fen:"I finally figured out how the system works.",fes:"Por fin entendí cómo funciona el sistema.",assoc:{bridge:"figure = figura, la forma que aparece",scene:"Miras un plano lleno de rayas sin sentido. Vas descartando lo que sobra y de pronto la FIGURA sale FUERA del lío: era un submarino.",funny:"La figura que aparece es un pato. La miras otra vez y ahora sí, el submarino.",recall:"La figura que sale del lío: figure out = entender, resolver.",why:"OUT es lo que emerge del desorden. No es saberlo ya: es sacarlo a la luz a base de pensar."}},
{id:"look-forward",en:"look forward to",es:"tener ganas de, esperar con interés",sense:"ojo: va seguido de -ing",ipa:"/lʊk ˈfɔːwəd tə/",fen:"I look forward to hearing from you.",fes:"Quedo a la espera de sus noticias.",assoc:{bridge:"look forward = mirar hacia delante",scene:"Estás en el puente MIRANDO HACIA DELANTE, hacia la bocana del puerto, contando las horas que faltan para atracar.",funny:"De tanto mirar hacia delante se te queda el cuello torcido y entras a puerto de medio lado.",recall:"Mirar hacia delante con ganas: look forward to = tener ganas de.",why:"La trampa está en el TO: no es de infinitivo, es preposición. Detrás va -ing: I look forward to SEEING you."}},
{id:"be-used-to",en:"be used to",es:"estar acostumbrado a",sense:"ojo: va seguido de -ing",ipa:"/bi juːst tə/",fen:"I am used to getting up early.",fes:"Estoy acostumbrado a madrugar.",assoc:{bridge:"used = usado, moldeado de tanto uso",scene:"Tus botas de guardia están USADAS, moldeadas a tu pie de tantas horas. Ya no te rozan: ni las notas.",funny:"Están tan acostumbradas que hacen la guardia solas y vuelven a la taquilla.",recall:"Lo usado ya no roza: be used to = estar acostumbrado a.",why:"Es el ESTADO, no el cambio. Detrás va -ing o sustantivo: I am used to WORKING nights."}},
{id:"get-used-to",en:"get used to",es:"acostumbrarse a",sense:"ojo: va seguido de -ing",ipa:"/ɡet juːst tə/",fen:"You soon get used to sleeping on board.",fes:"Pronto te acostumbras a dormir a bordo.",assoc:{bridge:"get = llegar a estar; used = usado",scene:"Botas nuevas, día uno: te rozan. Día diez: menos. Día treinta: ni las notas. Ese ablandarse poco a poco es acostumbrarse.",funny:"El día treinta y uno te dan botas nuevas otra vez y las viejas lloran en la taquilla.",recall:"El proceso de ablandar la bota: get used to = acostumbrarse a.",why:"GET es el cambio; BE es el estado ya alcanzado. Detrás, -ing: I am getting used to LIVING here."}},
{id:"carry-on",en:"carry on",es:"continuar, seguir",sense:"con una actividad",ipa:"/ˈkæri ɒn/",fen:"Carry on with the exercise as planned.",fes:"Continuad el ejercicio según lo previsto.",assoc:{bridge:"carry = llevar; on = encendido, en marcha",scene:"En plena faena asoma el Comandante, ve que vais bien y dice CARRY ON. Nadie se cuadra: se sigue LLEVANDO el trabajo con el motor ENCENDIDO.",funny:"Lo dice y la dotación sigue tan en marcha que nadie se entera de que se ha ido.",recall:"Seguir con el motor encendido: carry on = continuar, seguir.",why:"ON es lo que está en marcha, como una luz encendida. Es además una orden real de la Marina británica."}},
{id:"take-over",en:"take over",es:"asumir el mando, hacerse cargo",sense:"relevar a alguien",ipa:"/teɪk ˈəʊvə/",fen:"The executive officer took over the watch.",fes:"El segundo comandante se hizo cargo de la guardia.",assoc:{bridge:"take = coger; over = por encima, al otro lado",scene:"Relevo de guardia. El oficial saliente te pasa los prismáticos POR ENCIMA de la mesa de derrota y tú los COGES. En ese gesto cambia el mando.",funny:"Te pasa también el café a medias y la bronca pendiente del Comandante.",recall:"Coger lo que te pasan por encima: take over = asumir el mando, hacerse cargo.",why:"OVER es el traspaso de un lado a otro: pasa de sus manos a las tuyas."}},
{id:"break-down-mech",en:"break down",es:"averiarse",sense:"una máquina",ipa:"/breɪk daʊn/",fen:"The generator broke down during the night.",fes:"El generador se averió durante la noche.",assoc:{bridge:"break = romper; down = abajo, hasta pararse",scene:"El motor auxiliar pega un estallido, se le caen las revoluciones ABAJO del todo y se para en seco. Roto y tirado.",funny:"Del motor sale una nubecilla de humo con forma de bandera blanca.",recall:"Romperse y caer abajo: break down = averiarse.",why:"DOWN es caer hasta detenerse. Algo que funcionaba deja de funcionar."}},
{id:"break-down-pers",en:"break down",es:"venirse abajo",sense:"una persona, emocionalmente",ipa:"/breɪk daʊn/",fen:"Do not break down under pressure; breathe and think.",fes:"No te vengas abajo bajo presión; respira y piensa.",assoc:{bridge:"break = romper; down = abajo, hasta el suelo",scene:"Tras treinta horas sin dormir, el marinero aguanta la formación entera y, al romper filas, se le quiebra la voz y se VIENE ABAJO.",funny:"El contramaestre se conmueve, se viene abajo también, y acaban los dos sentados compartiendo un café.",recall:"Romperse por dentro y caer: break down = venirse abajo.",why:"Mismo verbo que el motor averiado: algo que aguantaba deja de aguantar. En español decimos igual, «venirse abajo»."}},
{id:"run-out",en:"run out of",es:"quedarse sin",sense:"agotar existencias",ipa:"/rʌn aʊt əv/",fen:"We are running out of fresh water.",fes:"Nos estamos quedando sin agua dulce.",assoc:{bridge:"run = correr; out = hasta salirse del todo",scene:"El gasóleo CORRE por el conducto, corre, corre, y de pronto se sale FUERA del último bidón. No queda nada.",funny:"La última gota sale corriendo con piernecitas y salta por la borda.",recall:"Correr hasta salirse del todo: run out of = quedarse sin.",why:"No es que se acabe sin más: se va yendo hasta que no queda. Y lleva OF delante de la cosa que falta."}},
{id:"make-up-for",en:"make up for",es:"compensar",sense:"una pérdida o carencia",ipa:"/meɪk ʌp fɔː/",fen:"Extra study at weekends makes up for lost days.",fes:"Estudiar más los fines de semana compensa los días perdidos.",assoc:{bridge:"make up = completar lo que falta",scene:"Falta un palmo de cabo para amarrar. Coges un trozo suelto y lo empalmas hasta COMPLETAR la medida. El hueco queda tapado.",funny:"El trozo empalmado es de color rosa y se ve desde el muelle, pero cumple.",recall:"Rellenar el hueco que había: make up for = compensar.",why:"make up es construir lo que falta; FOR señala qué agujero estás tapando."}},
{id:"put-off",en:"put off",es:"aplazar, posponer",sense:"dejar para más tarde",ipa:"/pʊt ɒf/",fen:"Do not put off writing practice until the weekend.",fes:"No aplaces la práctica de escritura hasta el fin de semana.",assoc:{bridge:"put = poner; off = apartado, fuera de en medio",scene:"La carpeta del informe se te pone delante. La coges y la PONES APARTADA, en el borde de la mesa, para mañana. Sigue ahí.",funny:"Mañana hay once carpetas apartadas y la mesa se vence por ese lado.",recall:"Ponerlo apartado para después: put off = aplazar, posponer.",why:"OFF es separar, quitar de en medio. Aquí lo apartas en el tiempo, no en el espacio."}},
{id:"turn-out",en:"turn out",es:"resultar",sense:"acabar siendo",ipa:"/tɜːn aʊt/",fen:"The drill turned out to be more useful than expected.",fes:"El simulacro resultó más útil de lo esperado.",assoc:{bridge:"turn = girar, darle la vuelta",scene:"Abres un sobre con cara de pocos amigos, esperando papeleo. Le das la VUELTA y lo que SALE es un ascenso. Resultó ser otra cosa.",funny:"Le das la vuelta otra vez por si acaso y sale también una tarta.",recall:"Lo que sale al darle la vuelta: turn out = resultar.",why:"Lo que resulta es lo que aparece al girar lo que creías. Casi siempre trae sorpresa."}},
{id:"keep-up",en:"keep up with",es:"seguir el ritmo de",sense:"no quedarse atrás",ipa:"/kiːp ʌp wɪð/",fen:"It is hard to keep up with new technology.",fes:"Es difícil seguir el ritmo de la nueva tecnología.",assoc:{bridge:"keep up = mantenerse a la altura, sin descolgarse",scene:"Formación de buques. El tuyo tiene que MANTENERSE a la altura del de delante. En cuanto bajas revoluciones te descuelgas, y se ve desde todos lados.",funny:"El último de la fila va a remo y aun así aguanta el tipo.",recall:"Mantenerte a la altura del de delante: keep up with = seguir el ritmo de.",why:"UP es no caerse del nivel. El esfuerzo es continuo: aflojas y te descuelgas."}},
{id:"stand-out",en:"stand out",es:"destacar, sobresalir",sense:"por encima del resto",ipa:"/stænd aʊt/",fen:"Her report stood out for its clarity.",fes:"Su informe destacó por su claridad.",assoc:{bridge:"stand = estar de pie; out = fuera de la fila",scene:"Dotación formada, todos iguales. Uno da un paso FUERA de la fila y se queda ahí DE PIE. Desde el otro extremo solo se le ve a él.",funny:"Ha dado el paso porque le ha picado un mosquito, pero ya es el que destaca.",recall:"De pie y fuera de la fila: stand out = destacar, sobresalir.",why:"OUT es salirse del conjunto. En español decimos igual: SOBREsalir, salir por encima."}},
{id:"point-out",en:"point out",es:"señalar, hacer notar",sense:"llamar la atención sobre algo",ipa:"/pɔɪnt aʊt/",fen:"The instructor pointed out two common mistakes.",fes:"El instructor señaló dos errores comunes.",assoc:{bridge:"point = apuntar con el dedo",scene:"En la carta náutica hay un bajo que no ha visto nadie. APUNTAS con el dedo y lo SACAS del montón: ahora lo miran todos.",funny:"Apuntas con tanta energía que el dedo atraviesa la carta y señala la mesa.",recall:"Sacar algo del montón con el dedo: point out = señalar, hacer notar.",why:"OUT es extraer: no solo apuntas, lo separas del resto para que se vea."}},
{id:"rule-out",en:"rule out",es:"descartar",sense:"una posibilidad",ipa:"/ruːl aʊt/",fen:"We cannot rule out a change of plans.",fes:"No podemos descartar un cambio de planes.",assoc:{bridge:"rule = regla de trazar rayas",scene:"Tienes cinco rumbos posibles en la pizarra. Coges la REGLA y TACHAS tres de un trazo. Fuera. Quedan dos.",funny:"Tachas con tanta fuerza que la raya atraviesa la pizarra y descarta también el mamparo.",recall:"Tacharlo con la regla y fuera: rule out = descartar.",why:"rule es la regla de trazar. Rule out es pasar la raya por encima: eso queda fuera."}},
{id:"draw-up",en:"draw up",es:"redactar, elaborar",sense:"un plan o documento",ipa:"/drɔː ʌp/",fen:"The staff drew up a detailed schedule.",fes:"El estado mayor elaboró un programa detallado.",assoc:{bridge:"draw = trazar; up = hasta arriba, hasta terminarlo",scene:"Sobre la mesa de derrota vas TRAZANDO el plan línea a línea, de abajo ARRIBA, hasta que el documento está entero y se puede firmar.",funny:"La última línea la traza el lápiz solo, con florituras, y firma por ti.",recall:"Trazarlo hasta arriba, hasta tenerlo entero: draw up = redactar, elaborar.",why:"UP es hasta completar. No es garabatear: es levantar un documento formal, un plan o un contrato."}},
{id:"set-up",en:"set up",es:"establecer, montar",sense:"crear algo nuevo",ipa:"/set ʌp/",fen:"They set up a command post ashore.",fes:"Montaron un puesto de mando en tierra.",assoc:{bridge:"set = colocar; up = de pie, en servicio",scene:"Llegas a un pañol vacío con cajas. Vas COLOCANDO las mesas y poniéndolas DE PIE hasta que lo que no existía está montado y funcionando.",funny:"La última mesa se pone de pie sola y se coloca donde le da la gana.",recall:"Colocarlo y ponerlo de pie: set up = establecer, montar.",why:"UP es pasar de estar tumbado a estar en servicio. De nada a funcionando."}},
{id:"set-out-goal",en:"set out",es:"proponerse",sense:"empezar con un objetivo",ipa:"/set aʊt/",fen:"I set out to master one expression a day.",fes:"Me propuse dominar una expresión al día.",assoc:{bridge:"set out = largar amarras, ponerse en camino",scene:"Largas amarras y pones rumbo AFUERA con un objetivo escrito en el cuaderno: llegar a Reikiavik. El viaje empieza con la intención declarada.",funny:"Sales con tanto ímpetu que te dejas al práctico a bordo y se viene a Islandia.",recall:"Salir con un objetivo por delante: set out = proponerse.",why:"OUT es salir del puerto. Lo que marca la expresión es que arrancas CON una intención, no que la cumplas."}},
{id:"undergo",en:"undergo",es:"someterse a, experimentar",sense:"un proceso o cambio",ipa:"/ˌʌndəˈɡəʊ/",fen:"The ship will undergo sea trials next month.",fes:"El buque se someterá a pruebas de mar el mes que viene.",assoc:{bridge:"under + go (pasar POR DEBAJO)",scene:"El buque entra en el dique y PASA POR DEBAJO de una máquina colosal que lo revisa entero, de proa a popa. Él no hace nada: se lo hacen a él. Lo sufre, lo atraviesa, lo experimenta.",funny:"La máquina le hace cosquillas en la quilla y el buque entero se parte de risa en el dique seco.",recall:"Pasar por debajo y aguantar lo que te hacen: undergo = someterse a, experimentar.",why:"Su pareja peligrosa es undertake. Aquí manda GO: tú pasas, eres el paciente."}},
{id:"undertake",en:"undertake",es:"emprender, acometer",sense:"una tarea importante",ipa:"/ˌʌndəˈteɪk/",fen:"The navy undertook a major modernisation.",fes:"La armada acometió una gran modernización.",assoc:{bridge:"under + take (COGER y echárselo al hombro)",scene:"El mismo buque sale del dique, COGE bajo el brazo una misión enorme, se la echa al hombro y zarpa con ella. Ahora es él quien actúa.",funny:"Se lleva también medio dique pegado al casco y nadie se atreve a decírselo.",recall:"Cogerlo tú y cargar con ello: undertake = emprender, acometer.",why:"La diferencia con undergo está en el verbo: GO es pasar por ello, TAKE es cogerlo tú. Pasivo contra activo."}},
{id:"enhance",en:"enhance",es:"mejorar, potenciar",sense:"aumentar la calidad de algo",ipa:"/ɪnˈhɑːns/",fen:"Training enhances both confidence and skill.",fes:"El adiestramiento potencia la confianza y la destreza.",assoc:{bridge:"ensanche (suena a «en-hans»)",scene:"El marinero flaco entra en el gimnasio del buque y, tras el adiestramiento, sale ENSANCHADO: el doble de ancho, el doble de firme, el doble de seguro.",funny:"Se ensancha tanto que ya no cabe por la escotilla y tienen que sacarlo por la torreta con una grúa.",recall:"Lo que se ensancha, mejora: enhance = mejorar, potenciar.",why:"enhance suena a «ensanche». No es solo crecer: es ganar calidad."}},
{id:"hinder",en:"hinder",es:"dificultar, entorpecer",sense:"frenar un avance",ipa:"/ˈhɪndə/",fen:"Poor visibility hindered the operation.",fes:"La escasa visibilidad dificultó la operación.",assoc:{bridge:"hindú",scene:"Un elefante HINDÚ colosal, cubierto de joyas, se sienta plácidamente en mitad de una autopista de ocho carriles. Nadie puede pasar: se forma un atasco de mil coches que pitan mientras el elefante se abanica con las orejas, tan tranquilo.",funny:"Reparte té a los conductores atrapados mientras la cola llega hasta el horizonte.",recall:"El elefante hindú que bloquea el paso es hinder: dificultar, entorpecer.",why:"«hinder» suena a «hindú»; el estorbo gigante fija «dificultar»."}},
{id:"tackle",en:"tackle",es:"abordar, atajar",sense:"un problema con decisión",ipa:"/ˈtækl/",fen:"We must tackle the problem at its root.",fes:"Debemos atajar el problema de raíz.",assoc:{bridge:"tacle (el placaje de rugby)",scene:"El problema viene corriendo hacia ti por el pasillo como un delantero de rugby de 120 kilos. En vez de esquivarlo, bajas el hombro y le haces un TACLE que lo tumba de raíz.",funny:"El problema se levanta pidiendo repetición al árbitro y le haces otro tacle, por si acaso.",recall:"Placar el problema en lugar de esquivarlo: tackle = abordar, atajar.",why:"«Tacle» se usa igual en español: la imagen y el sonido van juntos."}},
{id:"overcome",en:"overcome",es:"superar, vencer",sense:"una dificultad",ipa:"/ˌəʊvəˈkʌm/",fen:"She overcame her fear of speaking in public.",fes:"Superó su miedo a hablar en público."},
{id:"accomplish",en:"accomplish",es:"lograr, cumplir",sense:"un objetivo o misión",ipa:"/əˈkʌmplɪʃ/",fen:"The mission was accomplished without incident.",fes:"La misión se cumplió sin incidentes."},
{id:"drawback",en:"drawback",es:"inconveniente, desventaja",sense:"punto débil de un plan",ipa:"/ˈdrɔːbæk/",fen:"The main drawback is the cost.",fes:"El principal inconveniente es el coste."},
{id:"asset",en:"asset",es:"baza, activo",sense:"algo valioso que se posee",ipa:"/ˈæset/",fen:"Language skills are a real asset in NATO posts.",fes:"Los idiomas son una verdadera baza en puestos OTAN.",assoc:{bridge:"AS (el naipe que te guardas)",scene:"En la mesa de negociación de la OTAN, cuando parece que estás perdido, sacas el AS de la manga: hablas cuatro idiomas. Ese as cambia la partida.",funny:"Te salen tantos ases de la manga que la mesa se hunde y los demás recogen y se van.",recall:"Tu as es tu baza: asset = baza, activo.",why:"asset empieza por AS, y una baza es exactamente eso: la carta buena que tienes."}},
{id:"outcome",en:"outcome",es:"resultado, desenlace",sense:"de un proceso",ipa:"/ˈaʊtkʌm/",fen:"The outcome of the talks is still uncertain.",fes:"El resultado de las conversaciones aún es incierto."},
{id:"milestone",en:"milestone",es:"hito",sense:"logro que marca una etapa",ipa:"/ˈmaɪlstəʊn/",fen:"Passing the SLP will be a milestone in my career.",fes:"Aprobar el SLP será un hito en mi carrera.",assoc:{bridge:"mile + stone (la piedra miliar)",scene:"El corredor de maratón pasa junto a una PIEDRA enorme con un número tallado. Cada piedra marca una etapa conquistada. Al llegar a la que pone SLP, la piedra se enciende como una farola.",funny:"Se la quiere llevar a casa de recuerdo y se queda bloqueado abrazado a ella en mitad de la carretera.",recall:"La piedra que marca una etapa conseguida: milestone = hito.",why:"mile + stone: las calzadas romanas tenían una piedra por cada milla para saber cuánto llevabas hecho."}},
{id:"insight",en:"insight",es:"comprensión profunda, perspectiva",sense:"visión clara de un asunto",ipa:"/ˈɪnsaɪt/",fen:"The course gave me valuable insight into leadership.",fes:"El curso me dio una valiosa comprensión del liderazgo.",assoc:{bridge:"in + sight (vista hacia DENTRO)",scene:"El mismo búho sabio que mira hacia atrás se posa en tu hombro, te enfoca DENTRO de la cabeza con una linterna y ve los engranajes girando: entiende por dentro cómo funciona todo.",funny:"Dentro de la cabeza hay un hámster corriendo en una rueda que, al verse iluminado, saluda con la patita.",recall:"Ver por dentro: insight = comprensión profunda, perspectiva.",why:"in + sight = vista hacia dentro. Es el mismo búho de hindsight (mira atrás) y de foresee (mira adelante): tres miradas, tres palabras."}},
{id:"foresee",en:"foresee",es:"prever",sense:"anticipar lo que vendrá",ipa:"/fɔːˈsiː/",fen:"Nobody could foresee the storm.",fes:"Nadie pudo prever el temporal.",assoc:{bridge:"fore + see (ver POR DELANTE)",scene:"El mismo búho se adelanta volando por la proa del buque, se planta kilómetros por delante y ve el temporal antes de que llegue. Vuelve a toda ala y avisa al puente.",funny:"Trae un paraguas diminuto entre las garras como prueba del temporal, y no le cabe ni la cabeza debajo.",recall:"Ver lo que viene antes de que llegue: foresee = prever.",why:"fore = delante. Completa el trío del búho: hindsight mira atrás, insight mira dentro, foresee mira adelante."}},
{id:"log-book",en:"log",es:"cuaderno de bitácora",sense:"registro oficial del buque",ipa:"/lɒɡ/",fen:"Every course change is recorded in the log.",fes:"Cada cambio de rumbo se anota en el cuaderno de bitácora.",assoc:{bridge:"el tronco (log) que se echaba al agua",scene:"Antes, para medir la velocidad, se echaba al agua un TRONCO atado a un cabo con nudos y se contaba cuántos nudos corrían. Lo medido se anotaba en un libro, y el libro se quedó con el nombre del tronco.",funny:"El tronco del Galerna es tan grande que hacen falta cuatro marineros para pasar la página.",recall:"Del tronco al libro: log = cuaderno de bitácora.",why:"Etimología náutica real: de ahí vienen «log», «logbook» y hasta los nudos de velocidad."}},
{id:"log-record",en:"log",es:"registrar, anotar",sense:"dejar constancia escrita",ipa:"/lɒɡ/",fen:"The officer logged the incident at once.",fes:"El oficial registró el incidente de inmediato.",assoc:{bridge:"log = tronco: el que se echaba al agua",scene:"De la vela queda el TRONCO que se echaba al agua para medir la velocidad, y en él se anotaba todo. El oficial coge un cuchillo y TALLA el incidente en la madera, a la vista de todos, para que quede constancia aunque se hunda el buque.",funny:"Talla con tanto ímpetu que parte el tronco en dos y hay que empezar un tomo nuevo.",recall:"Dejar constancia tallada: to log = registrar, anotar.",why:"Del tronco salió el cuaderno de bitácora y del cuaderno la acción: primero fue el objeto, después anotar en él."}},
{id:"moor",en:"moor",es:"amarrar",sense:"sujetar el buque a puerto",ipa:"/mʊə/",fen:"The frigate moored alongside at noon.",fes:"La fragata amarró al costado a mediodía.",assoc:{bridge:"MUUU (suena /muə/)",scene:"La fragata entra a puerto y el cabo de amarre lo dan a una VACA colosal plantada en el muelle, que hace MUUU mientras le pasan el cabo por los cuernos. La vaca es la bita.",funny:"La vaca se despista, da dos pasos hacia el pienso y se lleva la fragata detrás como un globo.",recall:"Dar el cabo a la vaca que hace MUU: moor = amarrar.",why:"moor se pronuncia casi «muu»; el mugido te deja la palabra pegada al muelle."}},
{id:"berth",en:"berth",es:"atraque, puesto de atraque",sense:"lugar del buque en puerto",ipa:"/bɜːθ/",fen:"The harbour has no free berths today.",fes:"El puerto no tiene atraques libres hoy.",assoc:{bridge:"Bert (Barrio Sésamo)",scene:"BERT, el de la uniceja, ahora gigantesco, intenta aparcar un transatlántico en un hueco minúsculo entre dos yates. Suda, gira un volante enorme y grita «¡a la izquierda, a la izquierda!» hasta que el barco encaja con un CLONC en su plaza.",funny:"Ernie lo dirige desde el muelle con dos paletas de ping-pong, muerto de risa.",recall:"Bert metiendo el barco en su plaza es berth: el puesto de atraque.",why:"«berth» suena a «Bert»; la maniobra de aparcar el barco fija «atraque»."}},
{id:"gale",en:"gale",es:"temporal, vendaval",sense:"viento muy fuerte en la mar",ipa:"/ɡeɪl/",fen:"A gale forced us to change course.",fes:"Un temporal nos obligó a cambiar de rumbo.",assoc:{bridge:"Gales",scene:"El país entero de GALES sale volando por los aires arrastrado por un viento monstruoso: ovejas, castillos y jugadores de rugby girando en un tornado gigante sobre el mar.",funny:"Un dragón galés se aferra desesperado a una farola gritando, con la bufanda estirada tres kilómetros por el vendaval.",recall:"El vendaval que se lleva Gales entero es gale: temporal, vendaval.",why:"«gale» suena casi igual que «Gales»; el viento que arrasa el país fija «temporal»."}},
{id:"treaty",en:"treaty",es:"tratado",sense:"acuerdo entre naciones",ipa:"/ˈtriːti/",fen:"Both nations signed a defence treaty.",fes:"Ambas naciones firmaron un tratado de defensa."},
{id:"alliance",en:"alliance",es:"alianza",sense:"unión entre países o fuerzas",ipa:"/əˈlaɪəns/",fen:"NATO is the most successful alliance in history.",fes:"La OTAN es la alianza más exitosa de la historia."},
{id:"warfare",en:"warfare",es:"guerra, arte de la guerra",sense:"forma de combatir",ipa:"/ˈwɔːfeə/",fen:"Cyber warfare is a growing threat.",fes:"La guerra cibernética es una amenaza creciente."},
{id:"threat",en:"threat",es:"amenaza",sense:"peligro potencial",ipa:"/θret/",fen:"Hybrid threats are difficult to detect.",fes:"Las amenazas híbridas son difíciles de detectar.",assoc:{bridge:"three (tres) — mismo arranque THR-",scene:"El vigía del castillo grita desde la torre: en el horizonte aparecen TRES velas negras. Todavía no ha pasado nada, nadie ha disparado, pero esas tres siluetas lo cambian todo. Eso es la amenaza.",funny:"El dragón, de los nervios, cuenta las velas con las garras una y otra vez y siempre le salen cuatro.",recall:"Lo que aún no te ha hecho daño pero puede hacértelo: threat = amenaza.",why:"Se agarra a THREE porque comparten el arranque THR-: lengua entre los dientes, nunca «tret»."}},
{id:"ceasefire",en:"ceasefire",es:"alto el fuego",sense:"cese de hostilidades",ipa:"/ˈsiːsfaɪə/",fen:"The ceasefire collapsed after two days.",fes:"El alto el fuego se rompió a los dos días."},
{id:"casualty",en:"casualty",es:"baja, víctima",sense:"herido o muerto en operación",ipa:"/ˈkæʒuəlti/",fen:"The operation ended without casualties.",fes:"La operación terminó sin bajas.",assoc:{bridge:"se disfraza de «casualidad»",scene:"CASUALTY se presenta ante el tribunal vestida de trébol de cuatro hojas: «soy la casualidad». El juez abre la puerta del fondo y entran camilleros con heridos de la operación. «Tú no eres la suerte: tú eres la BAJA.»",funny:"Al caérsele el trébol aparece debajo un casco militar abollado, y el trébol se marchita de golpe en el suelo.",recall:"Nada de casualidad: casualty = baja, víctima.",why:"Es de los falsos amigos más peligrosos del examen: suena a «casualidad» y significa justo lo contrario de algo afortunado."}},
{id:"withdrawal",en:"withdrawal",es:"retirada",sense:"repliegue de fuerzas",ipa:"/wɪðˈdrɔːəl/",fen:"The withdrawal was completed ahead of schedule.",fes:"La retirada se completó antes de lo previsto.",assoc:{bridge:"with + draw (echar hacia atrás)",scene:"Tras el asedio, el ejército del caballero da media vuelta y se repliega: arrastran HACIA ATRÁS (draw back) las catapultas, los estandartes y hasta el dragón, alejándose del castillo en orden.",funny:"El dragón se resiste a irse y lo llevan a rastras como un perro que no quiere salir del parque.",recall:"Echar las tropas hacia atrás y replegarse es withdrawal: retirada. (También «sacar» dinero del cajero.)",why:"withdrawal = with + draw, «draw back» es echar hacia atrás; el ejército replegándose fija «retirada»."}},
{id:"breach",en:"breach",es:"brecha; incumplimiento; violación",sense:"rotura o quebrantamiento (de un muro, una norma, la seguridad)",ipa:"/briːtʃ/",fen:"The leak was a serious breach of security.",fes:"La filtración fue una grave brecha de seguridad.",assoc:{bridge:"brecha (casi la misma palabra)",scene:"Un ariete golpea la muralla del castillo y abre una BRECHA enorme; por ese boquete se cuela el enemigo. La misma imagen sirve cuando alguien abre una brecha en la seguridad y por ahí se escapa un secreto.",funny:"Por la brecha entran los soldados... y detrás el dragón, que se queda atascado a medias moviendo las patitas en el aire.",recall:"Una rotura en el muro, o el quebrantamiento de una norma o de la seguridad, es breach: brecha, incumplimiento.",why:"breach y «brecha» vienen de la misma raíz y suenan casi igual; el boquete en la muralla fija el significado."}},
{id:"surveillance",en:"surveillance",es:"vigilancia",sense:"observación continua",ipa:"/səˈveɪləns/",fen:"The area is under constant surveillance.",fes:"La zona está bajo vigilancia constante."},
{id:"intelligence-mil",en:"intelligence",es:"inteligencia, información",sense:"información militar",ipa:"/ɪnˈtelɪdʒəns/",fen:"Intelligence reports confirmed the movement of troops.",fes:"Los informes de inteligencia confirmaron el movimiento de tropas."},
{id:"deployment",en:"deployment",es:"despliegue",sense:"misión fuera de la base",ipa:"/dɪˈplɔɪmənt/",fen:"This is her third deployment abroad.",fes:"Este es su tercer despliegue en el extranjero."},
{id:"task-force",en:"task force",es:"fuerza operativa, agrupación",sense:"unidad creada para una misión",ipa:"/ˈtɑːsk fɔːs/",fen:"A naval task force was sent to the area.",fes:"Se envió una agrupación naval a la zona."},
{id:"headquarters",en:"headquarters",es:"cuartel general",sense:"centro de mando",ipa:"/ˌhedˈkwɔːtəz/",fen:"Orders came directly from headquarters.",fes:"Las órdenes llegaron directamente del cuartel general."},
{id:"enlist",en:"enlist",es:"alistarse",sense:"ingresar en las fuerzas armadas",ipa:"/ɪnˈlɪst/",fen:"He enlisted in the navy at eighteen.",fes:"Se alistó en la armada a los dieciocho.",assoc:{bridge:"en la lista",scene:"Un joven entra en la oficina de reclutamiento, coge un bolígrafo enorme y escribe su nombre EN LA LISTA de la Armada. En cuanto firma, le cae del techo el uniforme entero, ya puesto.",funny:"La lista es tan larga que baja tres pisos por la escalera y sale por la puerta a la calle.",recall:"Apuntarse, poner tu nombre en la lista para servir, es enlist: alistarse.",why:"enlist = en + list, «poner en la lista»; suena «en-list» ≈ «en la lista», y alistarse es exactamente eso."}},
{id:"escalate",en:"escalate",es:"escalar, intensificarse",sense:"un conflicto que crece",ipa:"/ˈeskəleɪt/",fen:"The conflict could escalate quickly.",fes:"El conflicto podría intensificarse rápidamente."},
{id:"rely-on",en:"rely on",es:"depender de, confiar en",sense:"necesitar algo o a alguien",ipa:"/rɪˈlaɪ ɒn/",fen:"Modern ships rely on complex software.",fes:"Los buques modernos dependen de programas complejos.",assoc:{bridge:"rely suena a «relé»",scene:"Todo el circuito del buque cuelga de un RELÉ del tamaño de un puño. Si ese relé falla, se apaga medio submarino. Todo depende de él.",funny:"El relé lo sabe y se pavonea: lleva una pegatina que pone «sin mí no vais a ninguna parte».",recall:"El relé del que cuelga todo: rely on = depender de, confiar en.",why:"«rely» suena a «relé», y un relé es justo eso: la pieza de la que depende el resto. Siempre con ON."}},
{id:"human-rights",en:"human rights",es:"derechos humanos",sense:"tema recurrente del examen",ipa:"/ˌhjuːmən ˈraɪts/",fen:"Human rights must be protected even in wartime.",fes:"Los derechos humanos deben protegerse incluso en tiempo de guerra."},
{id:"refugee",en:"refugee",es:"refugiado",sense:"quien huye de su país",ipa:"/ˌrefjuˈdʒiː/",fen:"Thousands of refugees crossed the border.",fes:"Miles de refugiados cruzaron la frontera."},
{id:"asylum",en:"asylum",es:"asilo",sense:"protección en otro país",ipa:"/əˈsaɪləm/",fen:"They applied for asylum in a neighbouring country.",fes:"Solicitaron asilo en un país vecino."},
{id:"freedom-speech",en:"freedom of speech",es:"libertad de expresión",sense:"derecho fundamental",ipa:"/ˌfriːdəm əv ˈspiːtʃ/",fen:"Freedom of speech is a cornerstone of democracy.",fes:"La libertad de expresión es una piedra angular de la democracia."},
{id:"rule-of-law",en:"rule of law",es:"estado de derecho",sense:"imperio de la ley",ipa:"/ˌruːl əv ˈlɔː/",fen:"The rule of law guarantees equal treatment.",fes:"El estado de derecho garantiza un trato igualitario."},
{id:"moreover",en:"moreover",es:"además, es más",sense:"conector formal de adición",ipa:"/mɔːrˈəʊvə/",fen:"Moreover, the evidence supports this view.",fes:"Además, las pruebas respaldan esta opinión.",assoc:{bridge:"more + over (uno MÁS por ENCIMA)",scene:"El orador apila argumentos sobre la mesa. Cuando todos creen que ha terminado, saca uno MÁS y lo coloca ENCIMA del montón. Y otro. La torre llega al techo del hemiciclo.",funny:"El último argumento pesa tanto que la mesa se hunde y el montón sale por el suelo rodando.",recall:"Uno más encima del montón: moreover = además, es más.",why:"more + over, literal: añadir por encima de lo ya dicho."}},
{id:"whereas",en:"whereas",es:"mientras que",sense:"contraste entre dos ideas",ipa:"/weərˈæz/",fen:"Some favour dialogue, whereas others prefer sanctions.",fes:"Unos prefieren el diálogo, mientras que otros prefieren las sanciones.",assoc:{bridge:"where (dónde): aquí y allí",scene:"En el hemiciclo, dos diputados hablan a la vez desde lados opuestos. El presidente los va señalando alternativamente: AQUÍ se prefiere el diálogo, MIENTRAS QUE ALLÍ se prefieren las sanciones.",funny:"La sala se parte en dos por el pasillo central y cada mitad se aleja flotando con sus escaños puestos.",recall:"Señalar un lado y el otro: whereas = mientras que.",why:"Lleva where (dónde) dentro: marca el contraste entre dos posturas, no entre dos momentos."}},
{id:"consequently",en:"consequently",es:"en consecuencia",sense:"conector de resultado",ipa:"/ˈkɒnsɪkwəntli/",fen:"The budget was cut; consequently, the project stopped.",fes:"El presupuesto se recortó; en consecuencia, el proyecto se detuvo."},
{id:"provided-that",en:"provided that",es:"siempre que, a condición de que",sense:"condición formal",ipa:"/prəˈvaɪdɪd ðət/",fen:"You will pass provided that you practise daily.",fes:"Aprobarás siempre que practiques a diario.",assoc:{bridge:"provided = provisto; si se provee la condición",scene:"Te dan permiso para salir a puerto con una condición escrita en un papel: estar de vuelta a las seis. El permiso existe mientras ese papel se cumpla. Si no, se evapora.",funny:"Vuelves a las seis y un minuto y el papel se autodestruye con mucho teatro.",recall:"El permiso que vive mientras se cumpla la condición: provided that = siempre que.",why:"Es un IF más formal y más exigente: marca que la condición es imprescindible. También vale providing that, y en lo más formal, provided solo."}},
{id:"one-hand",en:"on the one hand",es:"por una parte",sense:"abre un contraste; va con on the other hand",ipa:"/ɒn ðə ˈwʌn hænd/",fen:"On the one hand, technology saves time.",fes:"Por una parte, la tecnología ahorra tiempo."},
{id:"other-hand",en:"on the other hand",es:"por otra parte",sense:"cierra el contraste",ipa:"/ɒn ði ˈʌðə hænd/",fen:"On the other hand, it creates dependence.",fes:"Por otra parte, crea dependencia."},
{id:"in-terms-of",en:"in terms of",es:"en cuanto a, en términos de",sense:"acotar el aspecto tratado",ipa:"/ɪn ˈtɜːmz əv/",fen:"In terms of cost, the plan is reasonable.",fes:"En cuanto al coste, el plan es razonable.",assoc:{bridge:"terms = los términos en que se mide algo",scene:"Comparas dos buques. Si los mides en TÉRMINOS de velocidad, gana uno; si los mides en términos de autonomía, gana el otro. Antes de comparar hay que decir en qué unidad.",funny:"Los mides en términos de cafetera y gana un tercero que no estaba en la comparación.",recall:"Decir en qué unidad estás midiendo: in terms of = en cuanto a.",why:"Sirve para acotar el aspecto del que hablas y evitar discusiones cruzadas. En examen oral da tiempo a pensar mientras lo dices."}},
{id:"when-comes-to",en:"when it comes to",es:"en lo que respecta a",sense:"introducir un tema",ipa:"/wen ɪt ˈkʌmz tə/",fen:"When it comes to discipline, the navy sets the standard.",fes:"En lo que respecta a la disciplina, la armada marca la pauta.",assoc:{bridge:"cuando la conversación LLEGA a ese tema",scene:"En la sobremesa se habla de mil cosas y el otro va tranquilo. Pero la conversación LLEGA al tema del presupuesto y se le cambia la cara: ahí ya es otra historia.",funny:"Llega al tema del presupuesto y se levanta a por café con una urgencia sospechosa.",recall:"Cuando la cosa llega a ESE tema: when it comes to = en lo que respecta a.",why:"Introduce el tema concreto en el que las cosas cambian. Ojo: detrás va sustantivo o -ing, nunca infinitivo. When it comes to PLANNING, not to plan."}},
