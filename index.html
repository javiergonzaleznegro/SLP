{id:"take-granted",en:"take for granted",es:"dar por sentado",sense:"no valorar lo que se tiene",ipa:"/ˌteɪk fə ˈɡrɑːntɪd/",fen:"We should not take security for granted.",fes:"No debemos dar por sentada la seguridad.",assoc:{bridge:"grant = conceder",scene:"El rey CONCEDE cada mañana agua, pan y protección sin que nadie se lo pida. Los habitantes salen, tienden el vaso sin levantar la vista y siguen a lo suyo. Un día deja de concederlo y se arma el caos.",funny:"Tres días después siguen tendiendo el vaso al aire, bebiendo nada y comentando el tiempo.",recall:"Tomarlo como ya concedido: take for granted = dar por sentado.",why:"grant = conceder; tomar algo «por concedido» es no valorarlo."}},
{id:"play-role",en:"play a role",es:"desempeñar un papel",sense:"tener influencia en algo",ipa:"/ˌpleɪ ə ˈrəʊl/",fen:"Sport plays a key role in my routine.",fes:"El deporte desempeña un papel clave en mi rutina.",assoc:{bridge:"role = papel, el del actor",scene:"En el teatro te dan un PAPEL con tus frases. No eres el protagonista, pero sin tu parte la obra no se sostiene.",funny:"Tu papel es «marinero nº 4» y te lo tomas tan en serio que te llevas el premio.",recall:"El papel que te toca en la obra: play a role = desempeñar un papel.",why:"En español decimos exactamente lo mismo: jugar o desempeñar un papel. Calco directo."}},
{id:"bridge-gap",en:"bridge the gap",es:"salvar la distancia, reducir la brecha",sense:"unir dos extremos",ipa:"/ˌbrɪdʒ ðə ˈɡæp/",fen:"Training bridges the gap between theory and practice.",fes:"El adiestramiento salva la distancia entre la teoría y la práctica.",assoc:{bridge:"bridge = puente; gap = hueco",scene:"Entre los dos muelles hay un HUECO de tres metros. Colocas una plancha y queda hecho el PUENTE: lo que estaba separado ya se cruza andando.",funny:"El primero en cruzar es el gato del buque, que además se para en medio a mirar el agua.",recall:"Poner el puente sobre el hueco: bridge the gap = salvar la distancia.",why:"Aquí bridge es VERBO: hacer de puente. Vale para huecos de dinero, de edad o de conocimiento."}},
{id:"double-edged",en:"double-edged sword",es:"arma de doble filo",sense:"ventaja con riesgo",ipa:"/ˌdʌbl edʒd ˈsɔːd/",fen:"Artificial intelligence is a double-edged sword.",fes:"La inteligencia artificial es un arma de doble filo.",assoc:{bridge:"una espada con filo por los dos lados",scene:"Te entregan una espada preciosa y afiladísima. Cortas con un filo y, al recoger el brazo, el otro filo te roza a ti. Cada golpe tiene su precio.",funny:"Viene con instrucciones: «sujetar por el mango, no por el entusiasmo».",recall:"Espada con filo a los dos lados: double-edged sword = arma de doble filo.",why:"La imagen es idéntica en español. Lo que hay que fijar es el inglés: double-EDGED, de edge, filo."}},
{id:"in-light-of",en:"in light of",es:"a la luz de, en vista de",sense:"considerando algo reciente",ipa:"/ɪn ˈlaɪt əv/",fen:"In light of recent events, the plan was changed.",fes:"En vista de los últimos acontecimientos, el plan se cambió.",assoc:{bridge:"light = la luz que se acaba de encender",scene:"Tenías una decisión tomada a oscuras. Alguien enciende una LUZ y aparece un dato que no habías visto. Con esa luz encendida, la decisión ya no es la misma.",funny:"Enciende la luz y lo primero que se ve es que la mesa estaba del revés.",recall:"A la luz de lo que acaba de aparecer: in light of = a la luz de, en vista de.",why:"Marca que hay información NUEVA que obliga a replantear. También in the light of, más británico. Muy útil para justificar un cambio de postura."}},
{id:"matter-fact",en:"as a matter of fact",es:"de hecho",sense:"reforzar o corregir",ipa:"/əz ə ˌmætər əv ˈfækt/",fen:"As a matter of fact, I have already finished.",fes:"De hecho, ya he terminado.",assoc:{bridge:"matter of fact = cuestión de HECHO, no de opinión",scene:"Alguien dice algo aproximado y tú abres el cuaderno de bitácora y lees la hora exacta. No estás opinando: estás poniendo un hecho encima de la mesa.",funny:"La hora exacta resulta ser aún peor que la aproximada y todos preferían no saberla.",recall:"Un hecho encima de la mesa: as a matter of fact = de hecho.",why:"Sirve para dos cosas: reforzar lo dicho o corregir suavemente al otro. Ojo con as a matter of FACT, que es de hecho, frente a in fact, más neutro."}},
{id:"state-art",en:"state of the art",es:"lo último, puntero",sense:"como adjetivo: state-of-the-art",ipa:"/ˌsteɪt əv ði ˈɑːt/",fen:"The frigate carries state-of-the-art radar.",fes:"La fragata lleva un radar puntero.",assoc:{bridge:"art = oficio, técnica (no «arte»)",scene:"En un museo, la última sala enseña hasta dónde ha llegado el OFICIO a día de hoy. Lo que hay ahí es lo más avanzado que existe.",funny:"La pieza de la última sala es un sonar tan moderno que detecta lo que vas a pensar.",recall:"Lo más avanzado del oficio hoy: state of the art = lo último, puntero.",why:"«art» aquí es oficio o técnica, como en «artes de pesca». Delante del sustantivo va con guiones: a state-of-the-art sonar."}},
{id:"breakthrough",en:"breakthrough",es:"avance decisivo",sense:"logro que cambia las cosas",ipa:"/ˈbreɪkθruː/",fen:"The team achieved a breakthrough in machine learning.",fes:"El equipo logró un avance decisivo en aprendizaje automático.",assoc:{bridge:"break + through (romper y ATRAVESAR)",scene:"Ya está abierta la brecha en la muralla. Ahora el ejército la ATRAVIESA en tromba y toma el castillo de una sola acometida: lo que durante meses no avanzaba, se resuelve en un minuto.",funny:"El dragón, que la otra vez se quedó encajado en la brecha moviendo las patitas, ahora pasa de largo silbando.",recall:"Romper y atravesar de golpe: breakthrough = avance decisivo.",why:"break + through, y encadena con breach: primero la brecha, después el avance que la aprovecha."}},
{id:"cutting-edge",en:"cutting-edge",es:"puntero, de vanguardia",sense:"tecnología de última generación",ipa:"/ˌkʌtɪŋ ˈedʒ/",fen:"She works with cutting-edge technology.",fes:"Trabaja con tecnología de vanguardia."},
{id:"reliable",en:"reliable",es:"fiable",sense:"digno de confianza",ipa:"/rɪˈlaɪəbl/",fen:"We need reliable data to decide.",fes:"Necesitamos datos fiables para decidir."},
{id:"accurate",en:"accurate",es:"preciso, exacto",sense:"sin errores",ipa:"/ˈækjərət/",fen:"The forecast proved remarkably accurate.",fes:"El pronóstico resultó notablemente preciso."},
{id:"endurance",en:"endurance",es:"resistencia",sense:"capacidad de aguante físico",ipa:"/ɪnˈdjʊərəns/",fen:"Cardio training builds endurance.",fes:"El entrenamiento cardiovascular desarrolla la resistencia."},
{id:"strength",en:"strength",es:"fuerza",sense:"física; también punto fuerte",ipa:"/streŋθ/",fen:"Strength work twice a week is enough.",fes:"Trabajar la fuerza dos veces por semana es suficiente."},
{id:"pace",en:"pace",es:"ritmo",sense:"de juego, de trabajo",ipa:"/peɪs/",fen:"Learn to control the pace of the game.",fes:"Aprende a controlar el ritmo del partido.",assoc:{bridge:"paso (mismo origen: latín passus)",scene:"El base del equipo bota el balón marcando el PASO: cuando acelera, los diez jugadores corren; cuando frena, el partido entero se detiene. Él manda en el ritmo.",funny:"Frena del todo y hasta el reloj del marcador se queda quieto, con el árbitro a media zancada.",recall:"Quien marca el paso marca el ritmo: pace = ritmo.",why:"pace y «paso» vienen del mismo latín passus. El ritmo no es más que la medida del paso."}},
{id:"commitment",en:"commitment",es:"compromiso, dedicación",sense:"entrega constante",ipa:"/kəˈmɪtmənt/",fen:"Success demands daily commitment.",fes:"El éxito exige compromiso diario."},
{id:"perseverance",en:"perseverance",es:"perseverancia",sense:"constancia ante la dificultad",ipa:"/ˌpɜːsɪˈvɪərəns/",fen:"Perseverance matters more than motivation.",fes:"La perseverancia importa más que la motivación."},
{id:"setback",en:"setback",es:"revés, contratiempo",sense:"obstáculo temporal",ipa:"/ˈsetbæk/",fen:"Treat every setback as a lesson.",fes:"Trata cada revés como una lección.",assoc:{bridge:"empujón hacia atrás (set back)",scene:"Un tenista sube eufórico al podio, levanta la copa... y una mano gigante que baja del cielo lo EMPUJA HACIA ATRÁS escaleras abajo. Rueda hasta el aparcamiento entre trompetas de victoria que se desinflan.",funny:"La copa rebota detrás de él, escalón a escalón, haciendo «bong, bong, bong».",recall:"Ese empujón que te echa para atrás justo cuando ganabas es un setback: un revés.",why:"«set back» significa literalmente «echar hacia atrás»; el empujón fija «contratiempo»."}},
{id:"in-charge",en:"in charge of",es:"al mando de, a cargo de",sense:"con responsabilidad sobre algo",ipa:"/ɪn ˈtʃɑːdʒ əv/",fen:"She is in charge of the engineering department.",fes:"Ella está al mando del departamento de máquinas.",assoc:{bridge:"charge = carga que te echan encima",scene:"Una BATERÍA gigante con galones de oficial en el costado manda en toda la sala de máquinas. La responsabilidad se la han cargado encima, y ahí está, al mando.",funny:"Cuando algo sale mal echa chispas por los bornes y se le quedan los galones torcidos.",recall:"La carga que te echan encima es el mando: in charge of = al mando de.",why:"Las tres acepciones de charge son la misma idea: algo que se carga sobre alguien."}},
{id:"charge-money",en:"charge",es:"cobrar",sense:"pedir dinero por algo",ipa:"/tʃɑːdʒ/",fen:"They charged us twice for the same service.",fes:"Nos cobraron dos veces por el mismo servicio.",assoc:{bridge:"charge = carga: lo que te cargan en la cuenta",scene:"Una BATERÍA con galones de oficial te da electricidad y acto seguido, muy digna, te extiende una factura: te COBRA cada vatio. Te lo ha CARGADO en la cuenta.",funny:"Al reclamarle te suelta un calambre y te devuelve la factura con recargo por protestar.",recall:"Lo que te carga en la cuenta: to charge = cobrar.",why:"charge es siempre cargar algo sobre alguien: la responsabilidad, la energía o el importe."}},
{id:"charge-battery",en:"charge",es:"cargar",sense:"una batería o dispositivo",ipa:"/tʃɑːdʒ/",fen:"Charge the radio before the watch.",fes:"Carga la radio antes de la guardia.",assoc:{bridge:"charge = cargar, llenar",scene:"Una BATERÍA con galones de oficial se enchufa y se CARGA de energía hasta que los bornes brillan y zumba de puro llena.",funny:"Se carga tanto que levita un palmo y hay que sujetarla con cabos para que no salga por la escotilla.",recall:"Llenar de energía: to charge = cargar.",why:"Es el sentido más literal de charge: llenar algo. De ahí salen el mando (te cargan la responsabilidad) y el cobro (te cargan el importe)."}},
{id:"sovereignty",en:"sovereignty",es:"soberanía",sense:"poder supremo de un Estado",ipa:"/ˈsɒvrənti/",fen:"The treaty respects the sovereignty of every member state.",fes:"El tratado respeta la soberanía de cada Estado miembro."},
{id:"sanctions",en:"sanctions",es:"sanciones",sense:"medidas punitivas entre Estados",ipa:"/ˈsæŋkʃənz/",fen:"The council imposed economic sanctions on the regime.",fes:"El consejo impuso sanciones económicas al régimen."},
{id:"accountability",en:"accountability",es:"rendición de cuentas",sense:"responsabilidad de dar explicaciones",ipa:"/əˌkaʊntəˈbɪləti/",fen:"Leadership requires accountability at every level.",fes:"El liderazgo exige rendición de cuentas a todos los niveles."},
{id:"muster",en:"muster",es:"pasar lista, reunir",sense:"formar a la tropa o reunir fuerzas",ipa:"/ˈmʌstə/",fen:"The crew was mustered on deck at dawn.",fes:"Se pasó lista a la dotación en cubierta al amanecer.",assoc:{bridge:"mostrar / muestra (mismo origen: latín monstrare)",scene:"El almirante pasa REVISTA a la tropa formada en cubierta: la va MOSTRANDO fila por fila, enseñándola como en un escaparate para inspeccionarla. La palabra nació justo de ahí, de «mostrar».",funny:"Cada marinero, al ser mostrado, gira sobre sí mismo como modelo de pasarela mientras suena música de desfile.",recall:"Reunir y formar a la tropa para mostrarla y pasarle revista es muster: pasar lista, reunir.",why:"muster y «mostrar/muestra» vienen ambos del latín monstrare; pasar revista es literalmente mostrar la tropa, y eso fija el significado."}},
{id:"reinforcement",en:"reinforcement",es:"refuerzo, refuerzos",sense:"tropas o medios de apoyo",ipa:"/ˌriːɪnˈfɔːsmənt/",fen:"Reinforcements arrived just in time to hold the line.",fes:"Los refuerzos llegaron justo a tiempo para mantener la línea."},
{id:"resilience",en:"resilience",es:"resiliencia, capacidad de recuperación",sense:"fortaleza para reponerse de la adversidad",ipa:"/rɪˈzɪliəns/",fen:"Resilience is what keeps you going after a setback.",fes:"La resiliencia es lo que te hace seguir tras un revés.",assoc:{bridge:"resorte (muelle)",scene:"Un muñeco con un RESORTE gigante por cuerpo recibe un puñetazo que lo aplasta contra el suelo... y ¡BOING! rebota de vuelta más alto y más firme que antes.",funny:"Cuanto más fuerte lo golpean, más arriba rebota, hasta salir disparado por encima de los tejados.",recall:"Ese rebote que lo devuelve entero tras el golpe es resilience: capacidad de recuperarse.",why:"«resilience» empieza como «resi-» y el resorte que rebota fija «recuperarse»."}},
{id:"momentum",en:"momentum",es:"impulso, inercia",sense:"fuerza que mantiene algo en marcha",ipa:"/məˈmentəm/",fen:"The team lost momentum in the second half.",fes:"El equipo perdió impulso en la segunda parte."},
{id:"stamina",en:"stamina",es:"aguante, fondo físico",sense:"resistencia sostenida",ipa:"/ˈstæmɪnə/",fen:"Long matches demand real stamina.",fes:"Los partidos largos exigen mucho fondo físico.",assoc:{bridge:"está mina",scene:"Un minero corre una maratón por un túnel interminable gritando «¡ESTÁ MINA no se acaba nunca!», y sigue y sigue, horas, sin quedarse sin aire.",funny:"Va repartiendo picos a otros corredores que caen agotados mientras él ni suda.",recall:"Ese aguante para seguir sin fin es stamina: fondo físico, resistencia.",why:"«stamina» suena a «está mina»; correr sin parar fija «aguante»."}},
{id:"streamline",en:"streamline",es:"agilizar, optimizar",sense:"simplificar un proceso",ipa:"/ˈstriːmlaɪn/",fen:"We streamlined the whole procedure.",fes:"Agilizamos todo el procedimiento.",assoc:{bridge:"stream + line (línea de corriente)",scene:"Un procedimiento lleno de recovecos, sellos y escalones cae al río. La CORRIENTE lo va puliendo hasta dejarlo con forma de torpedo: liso, sin un saliente, sin un trámite de más.",funny:"Sale tan liso que se escapa de las manos, cruza la bahía solo y llega a destino antes que el correo.",recall:"Darle forma de corriente: streamline = agilizar, optimizar.",why:"stream + line es la forma hidrodinámica: lo que no ofrece resistencia al agua."}},
{id:"there-is-no-denying",en:"there is no denying that",es:"no se puede negar que",sense:"introducir un hecho innegable",ipa:"/ðeər ɪz nəʊ dɪˈnaɪɪŋ ðæt/",fen:"There is no denying that discipline pays off.",fes:"No se puede negar que la disciplina da fruto.",assoc:{bridge:"deny = negar; aquí no hay forma de negarlo",scene:"Intentas negar el dato y la palabra se te queda atascada en la boca. Lo miras otra vez, lo vuelves a intentar y nada: no hay por dónde.",funny:"Lo intentas una tercera vez por deporte y el dato te mira con lástima.",recall:"No hay por dónde negarlo: there is no denying that = no se puede negar que.",why:"Fórmula para conceder un punto fuerte del contrario antes de rebatirlo. En examen escrito es oro: demuestra que sabes argumentar, no solo opinar. Detrás va -ing o that."}},
{id:"all-things-considered",en:"all things considered",es:"bien mirado, en conjunto",sense:"valoración final tras sopesar todo",ipa:"/ɔːl θɪŋz kənˈsɪdəd/",fen:"All things considered, it was a success.",fes:"Bien mirado, fue un éxito.",assoc:{bridge:"todo pesado en la balanza, al final",scene:"Pones en la balanza lo bueno y lo malo, pieza a pieza, sin dejarte nada. Cuando ya no queda nada por pesar, miras la aguja y dices lo que sale.",funny:"La última pieza que pones es tan pequeña que da la vuelta al resultado, y nadie se lo explica.",recall:"Pesado todo, esto es lo que sale: all things considered = bien mirado, en conjunto.",why:"Es el cierre de un razonamiento, no la apertura. Se dice DESPUÉS de haber sopesado, y por eso da sensación de conclusión meditada."}},
{id:"for-the-sake-of",en:"for the sake of",es:"en aras de, por el bien de",sense:"con un fin concreto",ipa:"/fə ðə ˈseɪk əv/",fen:"For the sake of clarity, I will keep it short.",fes:"En aras de la claridad, seré breve.",assoc:{bridge:"sake = el bien de alguien o algo",scene:"Tragas una bronca que no te corresponde y te callas. No lo haces por ti: lo haces POR EL BIEN de que el equipo no se rompa esa noche.",funny:"Al día siguiente el equipo ni se acuerda, y tú sí.",recall:"Por el bien de algo, aunque te cueste: for the sake of = en aras de, por el bien de.",why:"Detrás va sustantivo o -ing: for the sake of clarity, for the sake of ARGUING. Y ojo a la fórmula hecha: for God's sake, por el amor de Dios."}},
{id:"needless-to-say",en:"needless to say",es:"huelga decir, no hace falta decir",sense:"introducir algo obvio",ipa:"/ˈniːdləs tə seɪ/",fen:"Needless to say, preparation is everything.",fes:"Huelga decir que la preparación lo es todo.",assoc:{bridge:"needless = sin necesidad; no hace falta decirlo",scene:"Antes de empezar, dices en voz alta lo que todo el mundo ya sabe: que el buque sale el lunes. Nadie necesitaba oírlo, pero queda dicho y ya no hay excusa.",funny:"Uno pregunta cuándo sale el buque y recibe una mirada colectiva.",recall:"Decir lo que no hacía falta decir: needless to say = huelga decir.",why:"Marca que lo siguiente es obvio. Suele ir al principio y con coma. En español tenemos el calco exacto: huelga decir, no hace falta decir."}},
{id:"to-my-mind",en:"to my mind",es:"a mi parecer",sense:"marcar una opinión personal",ipa:"/tə maɪ ˈmaɪnd/",fen:"To my mind, the plan is too risky.",fes:"A mi parecer, el plan es demasiado arriesgado.",assoc:{bridge:"mind = mi cabeza; dentro de ella",scene:"La discusión está en la mesa. Te señalas la sien con el dedo y dices: lo que hay AQUÍ DENTRO es esto. Ni más autoridad ni menos: lo tuyo.",funny:"Te señalas la sien con tanta convicción que todos se señalan la suya y aquello parece un saludo.",recall:"Lo que hay en mi cabeza: to my mind = a mi parecer.",why:"Es opinión personal clara pero sin pedantería. Alternativa a in my opinion, que está muy gastada; variar entre las dos sube la nota."}},
{id:"push-through",en:"push through",es:"sacar adelante, perseverar",sense:"seguir pese a la dificultad",ipa:"/pʊʃ ˈθruː/",fen:"You have to push through the hardest days.",fes:"Hay que sacar adelante los días más duros.",assoc:{bridge:"push = empujar; through = a través, atravesando",scene:"La escotilla está atrancada y detrás está el informe que hay que entregar. EMPUJAS, no cede, empujas otra vez, y pasas AL OTRO LADO.",funny:"Pasas al otro lado con la escotilla puesta al cuello, como un collarín.",recall:"Empujar hasta atravesar: push through = sacar adelante, perseverar.",why:"THROUGH es atravesar algo que se resiste. No es hacerlo: es hacerlo A PESAR DE."}},
{id:"uphold",en:"uphold",es:"defender, mantener, hacer cumplir",sense:"una ley, un valor o una decisión",ipa:"/ʌpˈhəʊld/",fen:"Every officer swears to uphold the law.",fes:"Todo oficial jura defender la ley.",assoc:{bridge:"up + hold (sostener en alto)",scene:"En lo alto de la muralla, el caballero SOSTIENE EN ALTO el estandarte con la ley grabada, aguantando el vendaval con los dos brazos para que no caiga ni se doble. Pase lo que pase, lo mantiene arriba.",funny:"Se le duermen los brazos, pero antes que bajar el estandarte deja que se lo lleve por los aires a él con banderín y todo.",recall:"Sostener en alto y hacer cumplir una ley o un valor es uphold: defender, mantener.",why:"up + hold = «sostener en alto»; el caballero que no deja caer el estandarte fija «mantener/defender»."}},
{id:"surrender",en:"surrender",es:"rendirse, entregarse",sense:"deponer las armas",ipa:"/səˈrendə/",fen:"The garrison refused to surrender.",fes:"La guarnición se negó a rendirse.",assoc:{bridge:"-render ≈ rendir(se)",scene:"Sobre la muralla del castillo, el comandante enemigo ondea una bandera blanca enorme y arroja su espada al foso: se RINDE y entrega la plaza.",funny:"Lanza también el casco, la capa y hasta al dragón, que cae al foso con un chapoteo enorme.",recall:"Bajar las armas y entregarse es surrender: rendirse.",why:"surrender lleva dentro «render» ≈ «rendir(se)»; la bandera blanca fija el significado."}},
{id:"besiege",en:"besiege",es:"asediar, sitiar",sense:"cercar una plaza",ipa:"/bɪˈsiːdʒ/",fen:"Enemy forces besieged the fortress for weeks.",fes:"Las fuerzas enemigas asediaron la fortaleza durante semanas.",assoc:{bridge:"be + siege (asedio)",scene:"El ejército rodea el castillo por completo y monta el ASEDIO: nadie entra ni sale, las provisiones se acaban dentro. Es el paso previo a abrir la brecha en la muralla.",funny:"Los sitiadores se aburren tanto esperando que montan un puestecillo de perritos calientes frente a la puerta.",recall:"Rodear y cercar una plaza para rendirla es besiege: asediar, sitiar.",why:"be + siege = «poner asedio»; el cerco al castillo, antes de la brecha, fija «asediar»."}},
{id:"morale",en:"morale",es:"moral, ánimo (de la tropa)",sense:"OJO falso amigo: ánimo/entusiasmo, NO «moral/ética» (eso es moral)",ipa:"/məˈrɑːl/",fen:"A good leader keeps morale high in hard times.",fes:"Un buen líder mantiene alta la moral en los momentos difíciles.",assoc:{bridge:"moral + E (de Energía/Entusiasmo)",scene:"La tropa está agotada y hundida; el líder les grita un discurso y, de golpe, se les dispara el ÁNIMO: estandartes en alto, tambores, todos rugiendo con los puños al cielo.",funny:"El subidón es tal que hasta las tiendas de campaña se ponen firmes y sacan pecho.",recall:"El ánimo, la confianza y las ganas de un grupo es morale.",why:"lleva una -e final y se acentúa «mo-RÁL»; esa E extra es la Energía de la tropa. No confundir con «moral/ética», que en inglés es moral (MO-ral)."}},
{id:"hindsight",en:"hindsight",es:"retrospectiva, visión a posteriori",sense:"ver claro algo una vez ha pasado",ipa:"/ˈhaɪndsaɪt/",fen:"In hindsight, we should have left earlier.",fes:"En retrospectiva, deberíamos habernos ido antes.",assoc:{bridge:"hind (parte de atrás) + sight (vista)",scene:"Un búho sabio vuela mirando HACIA ATRÁS por encima del ala, contemplando el camino ya recorrido; ahora ve clarísimos los baches que no supo ver cuando pasaba por ellos.",funny:"De tanto mirar atrás se choca de frente con una rama, y piensa «esto también lo veré claro… luego».",recall:"Ver claro un asunto cuando ya ha ocurrido es hindsight: retrospectiva.",why:"hind = trasero/posterior + sight = vista; mirar atrás y verlo todo claro fija «en retrospectiva»."}},
{id:"shortcoming",en:"shortcoming",es:"deficiencia, carencia, punto débil",sense:"defecto o falta de algo",ipa:"/ˈʃɔːtkʌmɪŋ/",fen:"The plan has one serious shortcoming.",fes:"El plan tiene una deficiencia grave.",assoc:{bridge:"come short (quedarse corto)",scene:"Un atleta de salto de longitud coge carrerilla, salta con todas sus fuerzas... y cae CORTO, justo antes de la línea. El graderío suelta un «ohhh» de decepción.",funny:"Estira tanto los brazos buscando la línea que se le alargan como goma, y aun así no llega.",recall:"Quedarse corto, que le falte algo, es un shortcoming: una deficiencia.",why:"come + short = «quedarse corto»; el salto que no llega a la línea fija «carencia, punto débil»."}},
{id:"thorough",en:"thorough",es:"minucioso, exhaustivo, concienzudo",sense:"pron. /ˈθʌrə/, NO confundir con through",ipa:"/ˈθʌrə/",fen:"The inspection was slow but thorough.",fes:"La inspección fue lenta pero minuciosa.",assoc:{bridge:"ZORRO (con la z castellana: /ˈθʌrə/)",scene:"Un ZORRO con lupa y mono de trabajo inspecciona el buque entero, rincón por rincón, olisqueando cada tornillo y cada junta. Lento, pesadísimo, pero no se le escapa nada.",funny:"Encuentra hasta el bocadillo que el cocinero escondió detrás de un mamparo en 1998, intacto.",recall:"El zorro que no se deja un rincón: thorough = minucioso, exhaustivo.",why:"Con la z castellana suena «ZÓro». Y ojo con la pareja: through (a través) suena «zrú», con R y sin vocal en medio."}},
{id:"in-the-wake-of",en:"in the wake of",es:"a raíz de, tras",sense:"justo después de un suceso, casi siempre grave",ipa:"/ɪn ðə ˈweɪk əv/",fen:"In the wake of the crisis, new safety rules were introduced across the fleet.",fes:"A raíz de la crisis, se implantaron nuevas normas de seguridad en toda la flota.",assoc:{bridge:"wake = estela del barco",scene:"Un buque avanza y deja tras de sí una ESTELA de espuma enorme. Todo lo que ocurre «in the wake of» un suceso es lo que viene arrastrado justo detrás, en esa estela.",funny:"En la estela van surfeando las gaviotas, unos delfines y hasta el dragón con flotador.",recall:"Lo que sucede a raíz de algo, justo en su estela, es in the wake of: a raíz de, tras.",why:"«wake» es la estela que deja el barco; lo que viene en la estela = «a raíz de»."}},
{id:"come-to-terms-with",en:"come to terms with",es:"aceptar, hacerse a la idea de, asumir",sense:"reconciliarse con algo difícil",ipa:"/kʌm tə ˈtɜːmz wɪð/",fen:"It took him a long time to come to terms with the defeat.",fes:"Le costó mucho tiempo hacerse a la idea de la derrota.",assoc:{bridge:"terms = los términos de un acuerdo",scene:"Llevas meses peleado con una mala noticia. Te sientas con ella a una mesa y firmáis los TÉRMINOS: ni ganas ni pierdes, pero dejáis de pelear.",funny:"La mala noticia pide una cláusula de revisión anual y se la concedes por no discutir.",recall:"Firmar los términos y dejar de pelear: come to terms with = aceptar, asumir.",why:"No es que te guste: es que dejas de luchar contra ello. Por eso se usa con pérdidas, derrotas y malas noticias."}},
{id:"in-the-face-of",en:"in the face of",es:"ante, frente a",sense:"enfrentado a un peligro o dificultad",ipa:"/ɪn ðə ˈfeɪs əv/",fen:"She stayed calm in the face of real danger.",fes:"Se mantuvo serena ante un peligro real.",assoc:{bridge:"face = cara; cara a cara con lo que viene",scene:"El temporal viene de frente y tú no te das la vuelta: te quedas mirándolo DE CARA y sigues haciendo tu trabajo con el agua en la cara.",funny:"El temporal, incómodo con tanta mirada fija, se desvía ligeramente.",recall:"De cara a lo que viene, sin apartarse: in the face of = ante, frente a.",why:"Siempre con algo adverso: peligro, críticas, dificultades. Y lleva implícito que se aguanta: in the face of adversity."}},
{id:"on-the-grounds-that",en:"on the grounds that",es:"alegando que, con el argumento de que",sense:"dar el motivo de una decisión",ipa:"/ɒn ðə ˈɡraʊndz ðæt/",fen:"The appeal was rejected on the grounds that it lacked evidence.",fes:"El recurso se rechazó alegando que carecía de pruebas.",assoc:{bridge:"grounds = el terreno sobre el que se apoya la decisión",scene:"Un tribunal rechaza el recurso y, antes de levantar la sesión, señala al suelo: ESTE es el terreno en el que me apoyo para decirlo. Sin ese suelo, la decisión no se sostiene.",funny:"Señala el suelo con tal énfasis que se abre una grieta y el recurso se cae dentro.",recall:"El terreno en que se apoya la decisión: on the grounds that = alegando que.",why:"GROUNDS en plural son los motivos, el fundamento. Con THAT va una frase entera; con OF va un sustantivo: on the grounds OF cost."}}
,
{id:"advocate",en:"advocate",es:"defender, abogar por",sense:"apoyar públicamente una postura",ipa:"/ˈædvəkeɪt/",fen:"Several officers advocate a complete overhaul of the training system.",fes:"Varios oficiales defienden una revisión completa del sistema de instrucción.",assoc:{bridge:"advocate es ABOGADO",scene:"Un ABOGADO con toga se levanta en la sala y defiende en voz alta una postura que no es suya: le han encargado sostenerla y la sostiene con todo.",funny:"Defiende con tanto ímpetu que convence al juez, al fiscal y al acusado, que retira su propia declaración.",recall:"El abogado que defiende una postura en público: to advocate = defender, abogar por.",why:"Es literalmente la misma palabra: un advocate es un abogado. Como verbo, defender una idea. Ojo a la pronunciación: el verbo acaba en /eɪt/, el sustantivo en /ət/."}},
{id:"curtail",en:"curtail",es:"recortar, restringir",sense:"reducir algo antes de su final natural",ipa:"/kɜːˈteɪl/",fen:"Budget cuts curtailed the exercise to just three days.",fes:"Los recortes presupuestarios redujeron el ejercicio a solo tres días.",assoc:{bridge:"curt + TAIL: cortar la cola",scene:"Un perro entra en el pañol moviendo una cola larguísima. Tijeretazo: la COLA (tail) queda CORTA. Lo mismo ocurre con el ejercicio, que iba a durar diez días y acaba en tres.",funny:"El perro sigue moviendo la cola que ya no tiene, y el aire que mueve es menos pero más digno.",recall:"Cortarle la cola a algo que iba a ser más largo: to curtail = recortar, restringir.",why:"TAIL es cola, y curtail es dejarla corta. Se usa para libertades, plazos, gastos y derechos: algo que se corta antes de tiempo."}},
{id:"mitigate",en:"mitigate",es:"mitigar, atenuar",sense:"reducir la gravedad de algo malo",ipa:"/ˈmɪtɪɡeɪt/",fen:"Better planning would have mitigated the impact of the storm.",fes:"Una mejor planificación habría mitigado el impacto del temporal.",assoc:{bridge:"mitigate = MITIGAR, la misma palabra",scene:"El temporal llega igual, no se puede evitar. Lo que haces es amarrar, cerrar escotillas y rizar velas: el golpe entra, pero entra amortiguado.",funny:"El contramaestre amortigua tanto el golpe que el temporal se disculpa y se va a molestar a otro buque.",recall:"No evitas el golpe, lo amortiguas: to mitigate = mitigar, atenuar.",why:"Igual que en español. La clave es que NO evita el daño, solo lo reduce: por eso se habla de «mitigating circumstances», circunstancias atenuantes."}},
{id:"exacerbate",en:"exacerbate",es:"agravar, empeorar",sense:"hacer peor algo que ya era malo",ipa:"/ɪɡˈzæsəbeɪt/",fen:"The delay only exacerbated an already tense situation.",fes:"El retraso no hizo más que agravar una situación ya tensa.",assoc:{bridge:"exacerbate = EXACERBAR, la misma palabra",scene:"Una discusión en la cámara ya va caliente. Entra uno y suelta el comentario justo que faltaba: lo que estaba mal pasa a estar mucho peor.",funny:"El que lo suelta se da cuenta a mitad de frase y aun así la termina, por coherencia.",recall:"Echar gasolina a lo que ya ardía: to exacerbate = agravar.",why:"Existe en español, exacerbar, aunque se use poco. Es el contrario exacto de mitigate, y los dos caen juntos en los textos de examen."}},
{id:"undermine",en:"undermine",es:"socavar, minar",sense:"debilitar poco a poco y por debajo",ipa:"/ˌʌndəˈmaɪn/",fen:"Constant criticism undermined the new commander's authority.",fes:"Las críticas constantes socavaron la autoridad del nuevo comandante.",assoc:{bridge:"under + MINE: cavar una mina por debajo",scene:"La muralla sigue en pie, intacta por fuera. Pero debajo alguien lleva semanas cavando una MINA, quitando tierra palada a palada. Un día la muralla se cae sola.",funny:"El que cava sale por el otro lado y se encuentra cavando hacia arriba en el comedor de oficiales.",recall:"Cavar por debajo hasta que se cae solo: to undermine = socavar, minar.",why:"En español decimos igual: SOCAVAR es cavar por debajo. Nunca es un golpe frontal: es el desgaste lento y poco visible."}},
{id:"entail",en:"entail",es:"conllevar, implicar",sense:"traer consigo necesariamente",ipa:"/ɪnˈteɪl/",fen:"The new post entails a great deal of paperwork.",fes:"El nuevo destino conlleva muchísimo papeleo.",assoc:{bridge:"en + TAIL: lo que lleva pegado a la cola",scene:"Aceptas el destino nuevo y te dan un sobre. Al cogerlo notas peso: detrás del sobre viene enganchada, como una COLA, una fila de carpetas que llega hasta el final del pasillo.",funny:"Intentas soltar el sobre y la cola de carpetas te sigue por el buque como un patito a su madre.",recall:"Lo que viene enganchado detrás, quieras o no: to entail = conllevar, implicar.",why:"TAIL es cola: lo que algo arrastra consigo. En español decimos CONllevar, llevar junto con. No es una consecuencia posible: es inevitable."}},
{id:"warrant",en:"warrant",es:"justificar, merecer",sense:"ser motivo suficiente para algo",ipa:"/ˈwɒrənt/",fen:"The incident is serious enough to warrant a formal inquiry.",fes:"El incidente es lo bastante grave como para justificar una investigación formal.",assoc:{bridge:"warrant es también la ORDEN judicial, el papel que autoriza",scene:"Un juez mira el expediente, decide que la cosa tiene entidad suficiente y firma la ORDEN. Ese papel es la prueba de que el asunto lo merecía.",funny:"El expediente, orgulloso de haber merecido una orden, se deja encuadernar en piel.",recall:"Tener entidad suficiente para merecer el papel: to warrant = justificar, merecer.",why:"Un warrant es la orden escrita que autoriza algo. Como verbo: tener peso suficiente para que algo esté justificado. Mismo origen que «garantía»."}},
{id:"scrutinise",en:"scrutinise",es:"examinar a fondo, escudriñar",sense:"mirar con mucho detalle buscando fallos",ipa:"/ˈskruːtɪnaɪz/",fen:"Every line of the report was scrutinised by the staff.",fes:"El Estado Mayor examinó a fondo cada línea del informe.",assoc:{bridge:"scrutinise = ESCRUTINIO, recuento voto a voto",scene:"Noche electoral. Alguien saca las papeletas una a una, las levanta a contraluz y las mira por delante y por detrás antes de cantarlas. Ni una pasa sin ser mirada.",funny:"Mira con tanto detalle que detecta en una papeleta la huella del dedo del que la dobló.",recall:"El escrutinio papeleta a papeleta: to scrutinise = examinar a fondo.",why:"Es el verbo del ESCRUTINIO. No es echar un vistazo: es revisar buscando lo que falla. En inglés americano se escribe scrutinize."}},
{id:"alleviate",en:"alleviate",es:"aliviar, paliar",sense:"hacer más llevadero un mal",ipa:"/əˈliːvieɪt/",fen:"The new rota did little to alleviate the crew's fatigue.",fes:"El nuevo turno poco hizo por aliviar el cansancio de la dotación.",assoc:{bridge:"alleviate = ALIVIAR; dentro lleva «leve»",scene:"Llevas una mochila que pesa un quintal. No te la quitan, pero sacan tres ladrillos y te la devuelven. Sigue pesando, pero ya es LEVE comparada con antes.",funny:"Los tres ladrillos se los cargan al de al lado, que no se ha enterado y va silbando.",recall:"Quitarle peso a la carga, aunque siga ahí: to alleviate = aliviar, paliar.",why:"Dentro está «leve»: hacer más ligero. Casi igual que mitigate, pero alleviate se usa sobre todo con sufrimiento, dolor, pobreza o cansancio."}},
{id:"concede",en:"concede",es:"admitir, reconocer",sense:"dar la razón a regañadientes",ipa:"/kənˈsiːd/",fen:"He finally conceded that the original plan had been flawed.",fes:"Acabó admitiendo que el plan original tenía defectos.",assoc:{bridge:"concede = CONCEDER, pero lo que concedes es la razón",scene:"Discusión larga en la cámara. El que la sostenía levanta la mano, aprieta los labios y dice: de acuerdo, tenías razón. No lo dice contento: lo CONCEDE.",funny:"Lo concede con tal esfuerzo que se oye un crujido, y resulta ser la silla.",recall:"Dar la razón aunque duela: to concede = admitir, reconocer.",why:"En español conceder es dar algo; aquí lo que das es la razón, y siempre a tu pesar. Por eso vale para derrotas electorales: to concede defeat."}},
{id:"refute",en:"refute",es:"rebatir, refutar",sense:"demostrar que algo es falso",ipa:"/rɪˈfjuːt/",fen:"The report refutes the claim that the system is obsolete.",fes:"El informe rebate la afirmación de que el sistema está obsoleto.",assoc:{bridge:"refute = REFUTAR, la misma palabra",scene:"Alguien afirma algo en voz alta. Tú abres una carpeta, sacas tres documentos y los pones encima de la mesa uno a uno. La afirmación se deshincha sola.",funny:"Al tercer documento la afirmación pide tiempo muerto y se marcha a replantearse la vida.",recall:"Tumbar una afirmación con pruebas: to refute = rebatir, refutar.",why:"No basta con negar: refutar es demostrar que es falso. Negar sin pruebas es deny, y en el examen esa diferencia se nota."}},
{id:"preclude",en:"preclude",es:"impedir, excluir de antemano",sense:"hacer imposible algo antes de que ocurra",ipa:"/prɪˈkluːd/",fen:"Lack of funding precludes any further expansion.",fes:"La falta de financiación impide de antemano cualquier ampliación.",assoc:{bridge:"pre + CLUDE: cerrar antes (como CLAUSURAR)",scene:"Antes de que nadie llegue a intentarlo, alguien pasa y CIERRA la puerta con llave. Cuando los demás aparecen con sus propuestas, no hay ni por dónde entrar.",funny:"El que cierra se deja las llaves dentro y queda precluido él también.",recall:"Cerrar la puerta antes de que lleguen: to preclude = impedir, excluir de antemano.",why:"CLUDE es cerrar, como en clausurar, excluir o recluir. El PRE es lo que lo distingue de prevent: no lo paras, lo imposibilitas desde el principio."}},
{id:"circumvent",en:"circumvent",es:"eludir, sortear",sense:"esquivar un obstáculo rodeándolo",ipa:"/ˌsɜːkəmˈvent/",fen:"They found a way to circumvent the new restrictions.",fes:"Encontraron la forma de sortear las nuevas restricciones.",assoc:{bridge:"circum = alrededor (como CIRCUNferencia)",scene:"Hay un control cortando la carretera. No lo derribas ni lo cruzas: te metes por un camino lateral y le das toda la vuelta ALREDEDOR. Apareces al otro lado como si nada.",funny:"Das la vuelta tan amplia que llegas al control por detrás y acabas haciéndote tú el control.",recall:"Darle la vuelta al obstáculo en vez de enfrentarlo: to circumvent = eludir, sortear.",why:"CIRCUM es alrededor, como en circunferencia o circunnavegar. Se usa para normas, controles y sanciones, y lleva siempre un matiz de astucia."}},
{id:"underpin",en:"underpin",es:"sustentar, apuntalar",sense:"servir de base a algo",ipa:"/ˌʌndəˈpɪn/",fen:"Mutual trust underpins the whole alliance.",fes:"La confianza mutua sustenta toda la alianza.",assoc:{bridge:"under + PIN: el puntal que va debajo",scene:"Un edificio precioso que todos admiran. Bajas al sótano y lo que ves son unos PUNTALES de acero clavados debajo. Nadie los mira, y sin ellos no hay edificio.",funny:"Un puntal se queja de que nunca sale en las fotos y le ponen una placa conmemorativa en el sótano.",recall:"Los puntales del sótano que sostienen lo de arriba: to underpin = sustentar, apuntalar.",why:"PIN es el pasador o puntal. Es lo contrario exacto de undermine: uno pone apoyo debajo y el otro lo quita."}},
{id:"leverage",en:"leverage",es:"influencia, capacidad de presión",sense:"poder para conseguir algo de otro",ipa:"/ˈliːvərɪdʒ/",fen:"Sanctions gave the alliance considerable leverage in the talks.",fes:"Las sanciones dieron a la alianza una gran capacidad de presión en las conversaciones.",assoc:{bridge:"lever = PALANCA",scene:"Una piedra enorme que no mueves ni a empujones. Metes una PALANCA por debajo, apoyas y, con dos dedos, la piedra se levanta. La fuerza no ha cambiado: has encontrado dónde apoyar.",funny:"La palanca resulta tan eficaz que levantas la piedra, el muelle y parte del puerto.",recall:"La palanca que mueve lo que a pulso no se mueve: leverage = influencia, capacidad de presión.",why:"Un LEVER es una palanca. En negociación es lo que te da fuerza para conseguir del otro lo que no conseguirías pidiéndolo."}},
{id:"constraint",en:"constraint",es:"limitación, condicionante",sense:"lo que te ata las manos",ipa:"/kənˈstreɪnt/",fen:"We planned the operation within very tight constraints.",fes:"Planeamos la operación con unos condicionantes muy estrechos.",assoc:{bridge:"constraint = CONSTREÑIR, apretar por los lados",scene:"Quieres abrir los brazos y no puedes: el pasillo del submarino te APRIETA por los dos lados. Puedes avanzar, pero solo como el pasillo te deja.",funny:"Mides el pasillo convencido de que ha encogido, y resulta que el que ha crecido eres tú.",recall:"Lo que te aprieta por los lados y te deja poco margen: constraint = limitación, condicionante.",why:"De CONSTREÑIR, apretar. No es una prohibición: es el margen real con el que cuentas. Suele ir en plural: time constraints, budget constraints."}},
{id:"discrepancy",en:"discrepancy",es:"discrepancia, desajuste",sense:"diferencia entre dos datos que deberían coincidir",ipa:"/dɪsˈkrepənsi/",fen:"There is a discrepancy between the log and the fuel records.",fes:"Hay un desajuste entre el cuaderno de bitácora y los registros de combustible.",assoc:{bridge:"discrepancy = DISCREPANCIA, la misma palabra",scene:"Dos libros abiertos uno al lado del otro. Deberían decir lo mismo y no lo dicen: donde uno pone 400 litros, el otro pone 380. Alguien va a tener que explicarlo.",funny:"Los dos libros se señalan mutuamente y ninguno da su brazo a torcer.",recall:"Dos cifras que deberían coincidir y no coinciden: discrepancy = discrepancia, desajuste.",why:"Ojo al matiz: en inglés es sobre todo el desajuste entre DATOS o cuentas, no entre opiniones. Para opiniones se usa disagreement."}},
{id:"contingency",en:"contingency",es:"contingencia, imprevisto",sense:"lo que puede pasar y hay que tener previsto",ipa:"/kənˈtɪndʒənsi/",fen:"Every plan must include a contingency for bad weather.",fes:"Todo plan debe incluir una previsión para el mal tiempo.",assoc:{bridge:"contingency = CONTINGENCIA, lo que puede ocurrir o no",scene:"Sobre la mesa de derrota, el plan principal. Al lado, un sobre cerrado con el rótulo POR SI ACASO. Dentro está lo que se hace si el tiempo empeora. Casi nunca se abre, y el día que se abre lo salva todo.",funny:"Dentro del sobre hay otro sobre que pone POR SI ACASO LO DEL POR SI ACASO.",recall:"El sobre de por si acaso: contingency = contingencia, imprevisto.",why:"Es lo que PUEDE pasar, no lo que va a pasar. De ahí contingency plan: el plan alternativo que se prepara antes de necesitarlo."}},
{id:"premise",en:"premise",es:"premisa",sense:"punto de partida de un razonamiento",ipa:"/ˈpremɪs/",fen:"The argument rests on a false premise.",fes:"El argumento se apoya en una premisa falsa.",assoc:{bridge:"premise = PREMISA, lo que se pone antes",scene:"Una torre de cajas altísima y muy bien hecha. Te agachas y ves que la caja de ABAJO está abollada y torcida. Da igual lo bien apiladas que estén las demás: la torre se va a caer.",funny:"Le pones un libro debajo para enderezarla y el libro resulta ser también una premisa falsa.",recall:"La caja de abajo del todo: premise = premisa.",why:"PRE-misa es lo que se pone ANTES. Si la premisa es falsa, el razonamiento se cae entero por muy bien construido que esté. Ojo: premises en plural y con otro sentido son las instalaciones."}},
{id:"caveat",en:"caveat",es:"salvedad, advertencia",sense:"la pega que hay que decir antes",ipa:"/ˈkæviæt/",fen:"He accepted the proposal with one important caveat.",fes:"Aceptó la propuesta con una salvedad importante.",assoc:{bridge:"caveat es «cuidado» en latín, como en CAVE CANEM",scene:"Te entregan un paquete estupendo y, justo antes de soltarlo, el que te lo da levanta un dedo y dice: una cosa. Lo que viene después de ese dedo es la condición que lo cambia todo.",funny:"El dedo levantado se queda ahí, flotando, y hay que rodearlo para salir del despacho.",recall:"El dedo levantado y el «una cosa»: caveat = salvedad, advertencia.",why:"Es latín puro: caveat, «que tenga cuidado», como el CAVE CANEM de los mosaicos romanos. Por eso suena rara: no ha pasado por el inglés, ha entrado directa."}},
{id:"consensus",en:"consensus",es:"consenso",sense:"acuerdo general sin votación formal",ipa:"/kənˈsensəs/",fen:"There is broad consensus on the need for reform.",fes:"Hay un amplio consenso sobre la necesidad de reformar.",assoc:{bridge:"con + SENSUS: sentir todos lo mismo",scene:"Una mesa de doce personas. Nadie ha votado y nadie ha levantado la mano, pero en un momento dado todos asienten a la vez, como si hubieran SENTIDO lo mismo. No hace falta contar.",funny:"Asienten todos menos uno, que asiente dos veces para compensar.",recall:"Todos sienten lo mismo sin necesidad de votar: consensus = consenso.",why:"SENSUS es sentir, el mismo de sensación. Ojo: en inglés no lleva doble C y se escribe consensus, no concensus. Es el error de escritura más repetido."}},
{id:"precedent",en:"precedent",es:"precedente",sense:"caso anterior que sirve de referencia",ipa:"/ˈpresɪdənt/",fen:"The decision sets a dangerous precedent.",fes:"La decisión sienta un precedente peligroso.",assoc:{bridge:"pre + CEDENT: el que fue antes",scene:"Nieve virgen. El primero que cruza deja unas huellas. Todos los que vienen detrás pisan esas huellas sin pensarlo, aunque lleven a un sitio malo, porque ya estaban ahí.",funny:"El primero iba dando un rodeo porque se había dejado las llaves, y ahora todo el mundo da ese rodeo.",recall:"Las primeras huellas en la nieve: precedent = precedente.",why:"Lo que viene ANTES y marca el camino. Ojo a la pronunciación: PRE-si-dent, igual que president, pero no tiene nada que ver con un presidente."}},
{id:"scope",en:"scope",es:"alcance, ámbito",sense:"hasta dónde llega algo",ipa:"/skəʊp/",fen:"The scope of the investigation was deliberately narrow.",fes:"El alcance de la investigación fue deliberadamente estrecho.",assoc:{bridge:"scope es lo que ves por el periSCOPIO",scene:"Subes el PERISCOPIO y das la vuelta completa. Lo que entra en ese círculo es tuyo: lo que queda fuera, no existe para ti. Ese círculo es el alcance del asunto.",funny:"Das la vuelta completa y en una de las vueltas te saludas a ti mismo.",recall:"El círculo que abarcas por el periscopio: scope = alcance, ámbito.",why:"Es el -scopio de periscopio, telescopio y microscopio: lo que se abarca mirando. Útil en examen: within the scope of, beyond the scope of."}},
{id:"backlash",en:"backlash",es:"reacción airada, contragolpe",sense:"rechazo fuerte a una decisión",ipa:"/ˈbæklæʃ/",fen:"The announcement provoked an immediate public backlash.",fes:"El anuncio provocó un rechazo público inmediato.",assoc:{bridge:"back + LASH: el latigazo de vuelta",scene:"Das un golpe de látigo hacia delante, muy seguro de ti. La punta llega al final, se tensa y vuelve HACIA ATRÁS con la misma fuerza, directa a tu propia cara.",funny:"Te tapas con el reglamento y el látigo rebota y le da al que lo había propuesto.",recall:"El latigazo que vuelve: backlash = reacción airada, contragolpe.",why:"LASH es latigazo y BACK es de vuelta. No es una crítica cualquiera: es una reacción fuerte, colectiva y contra quien tomó la decisión."}},
{id:"turmoil",en:"turmoil",es:"agitación, convulsión",sense:"desorden violento y prolongado",ipa:"/ˈtɜːmɔɪl/",fen:"The region has been in political turmoil for months.",fes:"La región lleva meses en convulsión política.",assoc:{bridge:"turmoil suena a TORMENTA y a REMOLINO",scene:"Mar del norte, fuerza nueve. Todo da vueltas: el agua, las olas, lo que no estaba trincado. Nada está en su sitio y lleva así tres días.",funny:"El café de la cámara lleva dos días flotando en el aire y nadie se atreve a cogerlo.",recall:"Todo dando vueltas y sin asentarse: turmoil = agitación, convulsión.",why:"Suena a tormenta y a remolino, y es justo eso. Se usa sobre todo en política y economía: political turmoil, financial turmoil."}},
{id:"plight",en:"plight",es:"situación penosa, trance",sense:"mala situación de la que no se sale",ipa:"/plaɪt/",fen:"The report draws attention to the plight of the refugees.",fes:"El informe llama la atención sobre la penosa situación de los refugiados.",assoc:{bridge:"plight es de PLIEGUE: quedarse enredado en un mal doblez",scene:"Una red mal plegada en cubierta. Metes el pie en un PLIEGUE y cuanto más tiras más se cierra. No es que estés incómodo: es que no puedes salir solo.",funny:"Llega otro a ayudarte, mete el pie en otro pliegue y ya sois dos.",recall:"Atrapado en un mal pliegue del que no se sale solo: plight = situación penosa.",why:"Viene de doblar, plegar: quedar enredado. No vale para un mal día: se reserva para situaciones graves y prolongadas, casi siempre de otros."}},
{id:"stalemate",en:"stalemate",es:"punto muerto",sense:"bloqueo en el que nadie puede avanzar",ipa:"/ˈsteɪlmeɪt/",fen:"The negotiations have reached a complete stalemate.",fes:"Las negociaciones han llegado a un punto muerto total.",assoc:{bridge:"es el AHOGADO del ajedrez",scene:"Tablero de ajedrez. Te toca mover y no tienes ni una jugada legal. No has perdido ni has ganado: la partida se queda parada ahí, con las piezas puestas.",funny:"Los dos jugadores siguen sentados tres días después, por si a alguno se le ocurre algo.",recall:"El ahogado del ajedrez, nadie puede mover: stalemate = punto muerto.",why:"Es el término exacto del ajedrez, donde significa tablas por ahogado. Lo importante es que nadie gana: no es una derrota, es un bloqueo."}},
{id:"loophole",en:"loophole",es:"vacío legal, resquicio",sense:"agujero en una norma por el que se escapa",ipa:"/ˈluːphəʊl/",fen:"They exploited a loophole in the regulations.",fes:"Aprovecharon un vacío legal en el reglamento.",assoc:{bridge:"loop + HOLE: el agujero de la muralla",scene:"Una muralla de piedra, maciza, sin una grieta. Pero a media altura hay una tronera estrecha, hecha para disparar. Alguien delgado se cuela por ahí y entra sin tocar la puerta.",funny:"Se cuela, mira alrededor y se da cuenta de que podía haber entrado por la puerta, que estaba abierta.",recall:"La tronera estrecha de la muralla: loophole = vacío legal, resquicio.",why:"Era el hueco de la muralla para disparar protegido. Ahora es el hueco de una norma: no la incumples, te escapas por él."}},
{id:"compelling",en:"compelling",es:"convincente, de peso",sense:"que obliga a admitirlo",ipa:"/kəmˈpelɪŋ/",fen:"She presented a compelling case for changing the schedule.",fes:"Presentó argumentos de peso para cambiar la programación.",assoc:{bridge:"compel = COMPELER, obligar",scene:"El argumento no te pide que estés de acuerdo: te empuja físicamente, con la mano en el pecho, hasta que das un paso atrás y dices que vale, que tiene razón.",funny:"Empuja tanto que acabas en el pasillo convencido y sin saber muy bien de qué.",recall:"El argumento que te empuja hasta convencerte: compelling = convincente, de peso.",why:"De COMPELER, obligar. Es más fuerte que convincing: no es que te convenza, es que no te deja alternativa razonable."}},
{id:"feasible",en:"feasible",es:"viable, factible",sense:"que se puede hacer de verdad",ipa:"/ˈfiːzəbl/",fen:"The plan looks good on paper but it is not feasible.",fes:"El plan pinta bien sobre el papel, pero no es viable.",assoc:{bridge:"feasible y FACTIBLE salen del mismo verbo: hacer",scene:"Dos planes sobre la mesa. Uno es precioso y necesita cuarenta hombres que no tienes. El otro es feo y se puede HACER mañana con lo que hay a bordo. El bueno es el feo.",funny:"El plan bonito, al verse descartado, promete adelgazar.",recall:"Lo que de verdad se puede hacer con lo que hay: feasible = viable, factible.",why:"Del mismo origen que FACTIBLE, de hacer. Ojo: no significa buena idea, significa realizable. Un plan puede ser feasible y malísimo."}},
{id:"inherent",en:"inherent",es:"inherente, intrínseco",sense:"que va dentro y no se puede separar",ipa:"/ɪnˈhɪərənt/",fen:"There are risks inherent in any submarine operation.",fes:"Hay riesgos inherentes a cualquier operación de submarinos.",assoc:{bridge:"inherent = INHERENTE, pegado por dentro",scene:"Intentas quitarle a un cuchillo lo de cortar. Le quitas el mango, la funda, el filo brillante, y cuando no queda nada ya no hay cuchillo. Cortar no era un accesorio: era él.",funny:"Le quitas lo de cortar y lo que queda es una cuchara, muy digna pero otra cosa.",recall:"Lo que no se puede quitar sin destruir la cosa: inherent = inherente.",why:"HERE- es adherirse, pegarse, el mismo de adherente. Va DENTRO. Ojo a la preposición: inherent IN algo, o inherent TO algo."}},
{id:"detrimental",en:"detrimental",es:"perjudicial",sense:"que hace daño",ipa:"/ˌdetrɪˈmentl/",fen:"Long deployments can be detrimental to family life.",fes:"Las comisiones largas pueden ser perjudiciales para la vida familiar.",assoc:{bridge:"detrimental = en DETRIMENTO de",scene:"Una balanza. Cada semana fuera que añades a un platillo, algo se cae del otro. No es que no sume: es que resta en el otro lado.",funny:"El platillo que pierde pone un cartel de SE TRASPASA.",recall:"Lo que va en detrimento del otro lado: detrimental = perjudicial.",why:"En español existe «en detrimento de», que es la pista. Ojo: siempre va con TO. Detrimental TO health, TO morale."}},
{id:"unprecedented",en:"unprecedented",es:"sin precedentes",sense:"que no había pasado nunca",ipa:"/ʌnˈpresɪdentɪd/",fen:"The storm caused unprecedented damage to the port.",fes:"El temporal causó daños sin precedentes en el puerto.",assoc:{bridge:"un + PRECEDENT: nieve sin una sola huella",scene:"Sales por la mañana y la nieve está intacta hasta el horizonte. Ni una huella, de nadie, nunca. El primer paso que des lo das sin saber si aguanta.",funny:"Das el primer paso y te hundes hasta la cintura, inaugurando también el primer precedente.",recall:"Nieve sin una sola huella anterior: unprecedented = sin precedentes.",why:"Es precedent con UN delante. Palabra larga pero muy rentable en examen, y queda mucho mejor que decir «never seen before»."}},

/* ================= NIVELES ================= */
/* st: pending → learning → d1 → w1 → w2 → m1 → m2 → done
   Dirección: la 1ª comprobación de cada nivel es EN→ES; la 2ª, ES→EN */
/* Ciclo: pending → learning → d1 → d2 → w1 → w2 → m1 → m2 → done
   Dos comprobaciones por nivel: 1ª EN→ES (reconocer), 2ª ES→EN (producir).
   gap = días hasta la SIGUIENTE comprobación tras acertar.
   En el nivel "1 día" se deja un día entero de margen (2 días). */
const LV = {
  d1:{label:"1 día · 1ª",   chev:2, dir:"en", next:"d2",  gap:2,  keep:2},
  d2:{label:"1 día · 2ª",   chev:2, dir:"es", next:"w1",  gap:7,  keep:2},
  w1:{label:"1 semana · 1ª",chev:3, dir:"en", next:"w2",  gap:7,  keep:7},
  w2:{label:"1 semana · 2ª",chev:3, dir:"es", next:"m1",  gap:30, keep:7},
  m1:{label:"1 mes · 1ª",   chev:4, dir:"en", next:"m2",  gap:30, keep:30},
  m2:{label:"1 mes · 2ª",   chev:4, dir:"es", next:"done",gap:0,  keep:30}
};
/* Puntos ACUMULADOS que corresponden a cada estado (palabra suelta).
   Se cobran al completar cada nivel: 1 día = 1, 1 semana = +3, 1 mes = +10.
   Las expresiones largas (4+ palabras) valen el doble. */
const CREDIT = {pending:0, learning:0, d1:0, d2:0, w1:1, w2:1, m1:4, m2:4, done:14};
const creditFor=(c,st)=>(CREDIT[st]||0);
/* Puntos por superar un repaso de retención (los mismos que por el nivel de mes) */
const REV_PTS=10;
/* Tope recomendado de fichas en estudio a la vez: más de esto satura la memoria */
const CUPO_APRENDIENDO=8;
/* Los puntos de una palabra que YA completó el ciclo quedan blindados (c.locked):
   reiniciar su estudio no los revierte. Antes de completarlo, sí se revierten. */
function setCredit(c,st){
  const target=Math.max(creditFor(c,st),c.locked||0);
  const delta=target-(c.earned||0);
  c.earned=target;
  S.pts=Math.max(0,S.pts+delta);
  return delta;
}
/* Programa el siguiente repaso de retención entre 6 y 12 meses */
function scheduleRevision(c){
  const n=180+Math.floor(Math.random()*186);
  c.due=addDays(n);
  return n;
}
const DEMOTES = {
  d1:[["learning","Aprendiendo"]],
  d2:[["d1","1 día"],["learning","Aprendiendo"]],
  w1:[["d1","1 día"],["learning","Aprendiendo"]],
  w2:[["d1","1 día"],["learning","Aprendiendo"]],
  m1:[["w1","1 semana"],["d1","1 día"],["learning","Aprendiendo"]],
  m2:[["w1","1 semana"],["d1","1 día"],["learning","Aprendiendo"]]
};
/* Días hasta la primera comprobación al entrar (o volver) a un nivel */
const ENTRY_GAP={d1:2, d2:2, w1:7, w2:7, m1:30, m2:30};

/* ================= ESTADO ================= */
const KEY="bitacora-slp-v1";
/* VERSIONADO vX.Y.Z — se sigue a rajatabla:
     X  lo decide Javi, avisando expresamente. No se toca por iniciativa propia.
     Y  SOLO cambios sustanciales: herramienta nueva, vista nueva, rediseño
        completo. Es raro. Ampliar, completar o corregir algo que ya existe NO es Y.
     Z  todo lo demás, que es casi siempre. No tiene techo: tras 3.9.9 va 3.9.10.
   En la duda, Z. Si parece que toca Y, se dice y se espera confirmación.
   Cada entrega sube exactamente uno de los tres, y el nombre de caché del
   service worker sube en la misma entrega.
   Nota: hasta la 3.9 la app llevó solo dos números, saltándose esta norma. El
   tercero arranca aquí; los números ya publicados no se reescriben. */
const VERSION="3.9.4";
let S;
/* Todas las fichas puntúan igual. Hasta la v3.9.2 las expresiones de 4+ palabras
   valían el doble; se quitó porque casi todas se forman con palabras simples
   («on the one hand», «in the long run») y no cuestan más que una palabra sola.
   isMulti ya no puntúa: solo separa palabras de expresiones en la estadística. */
const isMulti=c=>c.en.trim().split(/\s+/).filter(Boolean).length>=2;
function migrate(){
  S.cards.forEach(c=>{
    if(c.seen==null)c.seen=0;
    // Crédito de puntos por ficha (para poder devolverlos al retroceder)
    if(c.earned==null)c.earned=creditFor(c,c.st);
    if(c.locked==null)c.locked=(c.st==="done")?c.earned:0;
    if(c.st==="done"&&!c.due)scheduleRevision(c);
  });
  // Las fichas del deck toman siempre la asociación más reciente del archivo.
  SEED.forEach(s=>{
    if(s.assoc){const c=S.cards.find(x=>x.id===s.id);if(c)c.assoc=s.assoc;}
  });
  if(!S.hist)S.hist={};
  /* v3.9.3 — las expresiones dejan de valer el doble. El crédito de cada ficha
     se recalcula UNA sola vez con la escala nueva, en vez de ir descontándose
     suelto en el próximo repaso de cada una, que dejaría el marcador
     descuadrado sin explicación. Lo ya blindado (locked) hace de suelo: una
     ficha dominada conserva sus puntos. Si la cuenta baja, se avisa con la
     cifra exacta en lugar de cambiar el marcador por la espalda. */
  if(!S.sinDoble){
    let d=0;
    S.cards.forEach(c=>{
      const t=Math.max(creditFor(c,c.st),c.locked||0);
      d+=t-(c.earned||0); c.earned=t;
    });
    S.pts=Math.max(0,S.pts+d);
    S.sinDoble=true;
    if(d)S.avisoDoble=d;
  }
  S.streak=streakCount();
}
function logDay(p,d){
  if(!S.hist)S.hist={};
  const t=today();
  const h=S.hist[t]||(S.hist[t]={p:0,d:0});
  h.p+=p;h.d+=d;
}
function syncSeed(){
  let added=0;
  SEED.forEach(c=>{
    if(!S.cards.find(x=>x.id===c.id)){S.cards.push({...c,st:"pending",due:null,seen:0,earned:0,locked:0});added++;}
  });
  if(!S.hist)S.hist={};
  migrate();
  save();
  return added;
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){S=JSON.parse(raw);syncSeed();return;}
  }catch(e){}
  S={cards:SEED.map(c=>({...c,st:"pending",due:null,seen:0,earned:0,locked:0})),pts:0,streak:0,last:null,hist:{}};
  save();
}
function save(){
  S.ts=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){toast("No se pudo guardar (¿modo privado?)");}
}
/* Si la app está abierta a la vez en Safari y como app instalada, al volver a
   primer plano se sincroniza con lo último guardado en vez de machacarlo. */
function refreshFromStorage(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return;
    const d=JSON.parse(raw);
    if(d&&d.ts&&(!S.ts||d.ts>S.ts)){S=d;home();}
  }catch(e){}
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshFromStorage();});
window.addEventListener("pageshow",function(e){if(e.persisted)refreshFromStorage();});
function today(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function addDays(n){
  const d=new Date();d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
/* La racha se DEDUCE de los días con actividad registrados en el historial,
   así sobrevive a restaurar una copia de seguridad. */
function dayKey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function streakCount(){
  if(!S.hist)return 0;
  const d=new Date();
  if(!S.hist[dayKey(d)])d.setDate(d.getDate()-1); // si hoy aún no hay actividad, cuenta desde ayer
  let n=0;
  while(S.hist[dayKey(d)]){n++;d.setDate(d.getDate()-1);}
  return n;
}
function touchStreak(){
  if(!S.hist)S.hist={};
  const t=today();
  if(!S.hist[t])S.hist[t]={p:0,d:0};
  S.last=t;
  S.streak=streakCount();
}
const dueCards=()=>S.cards.filter(c=>(LV[c.st]||c.st==="done")&&c.due&&c.due<=today());
const byId=id=>S.cards.find(c=>c.id===id);

/* ================= AUDIO ================= */
let VOICE=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  VOICE=vs.find(v=>v.lang==="en-GB")||vs.find(v=>v.lang.startsWith("en-"))||vs.find(v=>v.lang.startsWith("en"))||null;
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}
function speak(txt){
  if(!("speechSynthesis" in window)){toast("Audio no disponible");return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang=VOICE?VOICE.lang:"en-GB";
  if(VOICE)u.voice=VOICE;
  u.rate=0.92;
  speechSynthesis.speak(u);
}

function levelRow(c,pill,extra){

  return '<div class="levelrow">'+chevrons(n,star)+'<span class="lvltxt">'+txt+'</span>'+p+(extra||"")+'</div>';
