<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C1B2A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Bitácora SLP</title>
<style>
:root{
  --ink:#0C1B2A;        /* azul carta náutica, fondo */
  --panel:#13283C;      /* paneles */
  --line:#24405A;       /* líneas y bordes */
  --ivory:#EFE7D6;      /* texto principal */
  --faded:#7FA3C0;      /* texto secundario */
  --brass:#C9A063;      /* latón: acento e instrumento */
  --ok:#4CAF7D;         /* verde señal */
  --bad:#C75B4E;        /* rojo señal */
  --disp:Futura,'Avenir Next Condensed','Trebuchet MS',sans-serif;
  --body:'Avenir Next',Avenir,-apple-system,'Segoe UI',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{
  font-family:var(--body);color:var(--ivory);background:var(--ink);
  background-image:radial-gradient(1200px 600px at 50% -200px,#16304a 0%,var(--ink) 70%);
  min-height:100vh;padding:env(safe-area-inset-top) 0 40px;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header{padding:18px 0 10px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-family:var(--disp);letter-spacing:.32em;font-size:13px;color:var(--brass);text-transform:uppercase}
.brand small{display:block;letter-spacing:.18em;color:var(--faded);font-size:10px;margin-top:4px}
h2{font-family:var(--disp);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--brass);margin:22px 0 12px}
.sub{color:var(--faded);font-size:14px;line-height:1.5}

/* ---------- instrumento de puntos ---------- */
.gauge{display:flex;justify-content:center;margin:24px 0 8px}
.dial{position:relative;width:190px;height:190px}
.dial svg{position:absolute;inset:0}
.dial .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .num b{font-family:var(--disp);font-weight:600;font-size:52px;letter-spacing:.02em;color:var(--ivory)}
.dial .num span{font-family:var(--disp);font-size:10px;letter-spacing:.3em;color:var(--brass);text-transform:uppercase;margin-top:2px}
.stats{display:flex;gap:10px;margin:14px 0 20px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:22px;font-weight:600}
.stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faded)}
.pipeline{display:flex;align-items:center;justify-content:space-between;gap:6px;border:1px dashed var(--line);border-radius:12px;padding:10px 14px;margin:-6px 0 16px;font-size:13px;color:var(--faded);flex-wrap:wrap}
.pipeline b{color:var(--ivory);font-family:var(--disp);font-size:16px;margin-left:3px}
.version{text-align:center;font-family:var(--disp);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--line);margin-top:22px}

/* ---------- botones ---------- */
.menu{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
button{font-family:var(--body);cursor:pointer;border:none;border-radius:14px;font-size:16px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.big{display:flex;justify-content:space-between;align-items:center;width:100%;
  background:var(--panel);border:1px solid var(--line);color:var(--ivory);
  padding:16px 18px;min-height:56px;text-align:left}
.big .n{font-family:var(--disp);color:var(--brass);font-size:18px;font-weight:600}
.big:active{background:#1a3350}
.primary{background:var(--brass);color:#20180b;font-weight:600;padding:15px;width:100%;min-height:52px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--faded);padding:13px;width:100%;min-height:48px}
.okbtn{background:var(--ok);color:#0b2416;font-weight:600;padding:15px;flex:1;min-height:52px}
.badbtn{background:var(--bad);color:#2b0f0b;font-weight:600;padding:15px;flex:1;min-height:52px}
.row{display:flex;gap:10px}
.back{background:none;color:var(--faded);font-size:14px;padding:14px 0;letter-spacing:.1em;text-transform:uppercase;font-family:var(--disp)}

/* ---------- fichas ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.levelrow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.chev{display:flex;gap:3px}
.chev i{width:14px;height:8px;background:var(--line);display:block;transform:skewX(-18deg);border-radius:2px}
.chev i.on{background:var(--brass)}
.chev i.star{width:10px;height:10px;transform:none;border-radius:50%}
.lvltxt{font-family:var(--disp);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faded)}
.dirpill{margin-left:auto;font-family:var(--disp);font-size:10px;letter-spacing:.14em;color:var(--ink);
  background:var(--faded);border-radius:20px;padding:3px 9px}
.word{font-size:27px;font-weight:600;line-height:1.2}
.ipa{font-family:var(--serif);color:var(--brass);font-size:17px;margin-top:2px}
.sense{display:inline-block;font-size:12px;color:var(--faded);border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin-top:8px}
.phrase{font-family:var(--serif);font-size:17px;line-height:1.5;margin-top:12px}
.phrase.es{color:var(--faded)}
.speak{background:transparent;border:1px solid var(--brass);color:var(--brass);border-radius:24px;
  padding:7px 16px;font-size:14px;margin-top:12px}
.divider{border-top:1px dashed var(--line);margin:16px 0}
.progress{font-family:var(--disp);font-size:11px;letter-spacing:.2em;color:var(--faded);text-transform:uppercase;text-align:center;margin:14px 0}
.hint{font-size:13px;color:var(--faded);margin-top:8px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--brass);color:#20180b;
  font-weight:600;border-radius:24px;padding:10px 22px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
textarea{width:100%;min-height:110px;background:var(--ink);border:1px solid var(--line);border-radius:12px;
  color:var(--ivory);font-family:Menlo,monospace;font-size:12px;padding:10px;margin:8px 0}
.hidden{display:none}
.assocbtn{background:transparent;border:1px dashed var(--brass);color:var(--brass);border-radius:24px;
  padding:8px 16px;font-size:14px;margin-top:12px;width:100%}
.assoc{margin-top:12px;background:#0e2033;border:1px solid var(--line);border-left:3px solid var(--brass);
  border-radius:0 12px 12px 0;padding:14px 16px}
.amn{margin:0 0 12px;font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--ivory)}
.amn:last-child{margin-bottom:0}
.amn span{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:3px}
.seen{font-family:var(--disp);font-size:10px;letter-spacing:.1em;color:var(--faded);margin-left:auto;text-transform:uppercase}
.tcount{text-align:center;font-family:var(--disp);font-size:11px;letter-spacing:.14em;color:var(--faded);text-transform:uppercase;margin-top:14px}
.empty{text-align:center;color:var(--faded);padding:40px 10px;font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

{id:"underway-gen",en:"underway",es:"en curso, en desarrollo",sense:"general: algo que ya ha empezado",ipa:"/ˌʌndəˈweɪ/",fen:"A new training programme is underway.",fes:"Un nuevo programa de instrucción está en curso."},
{id:"watch-guard",en:"watch",es:"guardia",sense:"turno de servicio a bordo",ipa:"/wɒtʃ/",fen:"I am on watch from midnight to four.",fes:"Estoy de guardia de doce a cuatro."},
{id:"drill-sim",en:"drill",es:"simulacro, ejercicio",sense:"práctica de adiestramiento",ipa:"/drɪl/",fen:"We ran a fire drill before getting underway.",fes:"Hicimos un simulacro de incendio antes de zarpar."},
{id:"drill-tool",en:"drill",es:"taladro",sense:"herramienta",ipa:"/drɪl/",fen:"You will need a drill to fix that bracket.",fes:"Necesitarás un taladro para fijar ese soporte."},
{id:"vessel",en:"vessel",es:"buque, embarcación",sense:"término formal",ipa:"/ˈvesl/",fen:"All vessels must report their position.",fes:"Todos los buques deben comunicar su posición."},
{id:"readiness",en:"readiness",es:"alistamiento, disponibilidad",sense:"estado de preparación",ipa:"/ˈredinəs/",fen:"The crew maintained a high state of readiness.",fes:"La dotación mantuvo un alto grado de alistamiento."},
{id:"deploy",en:"deploy",es:"desplegar",sense:"enviar fuerzas o medios",ipa:"/dɪˈplɔɪ/",fen:"The unit was deployed overseas for six months.",fes:"La unidad fue desplegada en el extranjero seis meses."},
{id:"deterrence",en:"deterrence",es:"disuasión",sense:"estrategia de defensa",ipa:"/dɪˈterəns/",fen:"Nuclear deterrence remains a pillar of NATO strategy.",fes:"La disuasión nuclear sigue siendo un pilar de la estrategia de la OTAN.",assoc:{bridge:"de terror",scene:"Ante la puerta del castillo, un dragón colosal escupe fuego solo para enseñar lo que puede hacer. Los ejércitos enemigos, muertos DE TERROR, dan media vuelta sin llegar a atacar: nadie se atreve.",funny:"El dragón ni pelea; basta con que bostece llamas y una tostada gigante cae del cielo para que huyan todos.",recall:"Meter tanto miedo que el enemigo no se atreva a atacar es deterrence: disuasión.",why:"«deter» suena a «de terror»; el enemigo que se retira aterrado sin combatir fija «disuadir»."}},
{id:"chain-command",en:"chain of command",es:"cadena de mando",sense:"jerarquía militar",ipa:"/tʃeɪn əv kəˈmɑːnd/",fen:"Report the issue through the chain of command.",fes:"Comunica el problema por la cadena de mando."},
{id:"roe",en:"rules of engagement",es:"reglas de enfrentamiento",sense:"normas de uso de la fuerza",ipa:"/ruːlz əv ɪnˈɡeɪdʒmənt/",fen:"The rules of engagement were briefed before the mission.",fes:"Las reglas de enfrentamiento se expusieron antes de la misión."},
{id:"briefing",en:"briefing",es:"reunión informativa, exposición",sense:"antes de una actividad",ipa:"/ˈbriːfɪŋ/",fen:"Attendance at the morning briefing is mandatory.",fes:"La asistencia a la reunión informativa matinal es obligatoria."},
{id:"liaison",en:"liaison",es:"enlace",sense:"persona o función de coordinación",ipa:"/liˈeɪzɒn/",fen:"She acts as liaison between both navies.",fes:"Ella actúa de enlace entre ambas armadas.",assoc:{bridge:"Leia (Star Wars)",scene:"La princesa LEIA corre de una base rebelde a otra sin descanso, llevando mensajes secretos en un holograma («ayúdame, Obi-Wan»). Es la que conecta y coordina a los dos bandos para que se entiendan.",funny:"Lleva tantos mensajes a la vez que los moños se le llenan de notas adhesivas y parece un tablón de anuncios andante.",recall:"La persona que enlaza y coordina a dos partes es liaison: enlace.",why:"«liaison» empieza sonando como «Lei-a»; Leia haciendo de puente entre bandos fija «enlace»."}},
{id:"overhaul",en:"overhaul",es:"revisión general, puesta a punto",sense:"mantenimiento a fondo",ipa:"/ˈəʊvəhɔːl/",fen:"The engine needs a complete overhaul.",fes:"El motor necesita una revisión general completa.",assoc:{bridge:"overol (mono de mecánico)",scene:"Un mecánico con su OVEROL azul desmonta el motor entero, pieza a pieza, lo limpia, cambia lo gastado y lo vuelve a montar como nuevo. No es un arreglo rápido: lo revisa TODO de arriba abajo.",funny:"Saca tantas piezas que el suelo del taller parece un puzle de mil piezas, y al final le sobra un tornillo que nadie sabe de dónde salió.",recall:"Desmontar y poner algo a punto por completo es overhaul: revisión general.",why:"overhaul suena a «overol», el mono del mecánico; y un mecánico en overol es justo quien hace una revisión a fondo."}},
{id:"seamanship",en:"seamanship",es:"marinería, arte de navegar",sense:"destreza del marino",ipa:"/ˈsiːmənʃɪp/",fen:"Good seamanship prevented a collision.",fes:"La buena marinería evitó un abordaje."},
{id:"convey",en:"convey",es:"transmitir",sense:"una idea o sensación",ipa:"/kənˈveɪ/",fen:"It is hard to convey how demanding sea duty is.",fes:"Es difícil transmitir lo exigente que es el servicio en la mar.",assoc:{bridge:"conveyor belt (cinta transportadora)",scene:"Una CINTA TRANSPORTADORA gigante sale de la cabeza de una persona y lleva sus ideas, envueltas como paquetes, directas a la cabeza de otra. Cada idea viaja por la cinta y se entrega intacta al otro lado.",funny:"Una idea demasiado grande atasca la cinta y hay que empujarla con una carretilla entre tres operarios.",recall:"Llevar una idea de una mente a otra y entregarla es convey: transmitir.",why:"convey está dentro de «conveyor belt», la cinta que transporta; y es justo lo que hace Leia (liaison), que convey sus mensajes de un bando a otro."}},
{id:"grasp-und",en:"grasp",es:"comprender, captar",sense:"entender una idea",ipa:"/ɡrɑːsp/",fen:"It took me a while to grasp the concept.",fes:"Tardé un poco en captar el concepto."},
{id:"grasp-hold",en:"grasp",es:"agarrar, asir",sense:"sujetar con la mano",ipa:"/ɡrɑːsp/",fen:"He grasped the rail as the ship rolled.",fes:"Se agarró al pasamanos cuando el buque dio un balance.",assoc:{bridge:"grapa",scene:"Hulk, furioso y verde, AGARRA una grapadora del tamaño de un autobús. De un puñetazo clava una GRAPA de acero que une dos rascacielos, y luego se agarra él mismo a un puente con las dos manos para no caer.",funny:"La grapa es tan grande que las palomas la usan de tobogán.",recall:"El agarre bestial de Hulk sujetando la grapa es grasp: agarrar con fuerza.",why:"«grasp» suena a «grap(a)»; el agarre potente fija el significado."}},
{id:"foster",en:"foster",es:"fomentar",sense:"favorecer el desarrollo de algo",ipa:"/ˈfɒstə/",fen:"Sport fosters discipline and teamwork.",fes:"El deporte fomenta la disciplina y el trabajo en equipo.",assoc:{bridge:"fósforo",scene:"Un jardinero enciende un FÓSFORO diminuto y lo acerca a una semilla. Al instante brota un bosque entero a cámara rápida: árboles disparándose al cielo, flores explotando de colores, lianas trepando por todas partes.",funny:"El jardinero sale volando por los aires montado en un girasol de treinta metros que no para de crecer.",recall:"El fósforo que hace crecer todo de golpe es foster: fomentar, hacer crecer.",why:"«foster» suena a «fósfor(o)»; la explosión de crecimiento representa «fomentar»."}},
{id:"hone",en:"hone",es:"perfeccionar, pulir",sense:"una destreza",ipa:"/həʊn/",fen:"I am honing my writing skills for the exam.",fes:"Estoy puliendo mi expresión escrita para el examen.",assoc:{bridge:"jonrón (home run)",scene:"Un bateador obsesivo lija y PULE su bate día y noche, hasta dejar la madera perfecta y reluciente. Cuando por fin lo tiene a punto, sale al campo, batea y clava un JONRÓN que manda la bola hasta la Luna.",funny:"Ha pulido tanto el bate que la pelota rebota como si tocara un espejo y no vuelve a caer nunca.",recall:"Pulir la herramienta con obsesión hasta dominar el golpe es hone: perfeccionar, pulir una destreza.",why:"«hone» suena al «hon-» de «home run/jonrón»; pulir el bate hasta la maestría representa «pulir una destreza», igual que pules tu inglés en la frase."}},
{id:"strive",en:"strive",es:"esforzarse",sense:"por conseguir algo",ipa:"/straɪv/",fen:"We strive to improve a little every day.",fes:"Nos esforzamos por mejorar un poco cada día.",assoc:{bridge:"estribo",scene:"Un jinete diminuto intenta subir a un caballo de diez metros de alto. Se agarra al ESTRIBO gigante y trepa con todas sus fuerzas: suda a chorros, resopla, los músculos a punto de reventar, mientras el caballo relincha impaciente.",funny:"Cada vez que resbala, cae sobre un montón de heno y vuelve a empezar, ya con siete pares de zapatillas rotas.",recall:"Ese esfuerzo sobrehumano por subir al estribo es strive: esforzarse al límite.",why:"«strive» suena a «estribo», y la imagen del esfuerzo brutal ancla el significado."}},
{id:"address-issue",en:"address",es:"abordar, tratar",sense:"un problema o asunto",ipa:"/əˈdres/",fen:"The report fails to address the real issue.",fes:"El informe no aborda el problema de fondo."},
{id:"address-speak",en:"address",es:"dirigirse a",sense:"hablar ante un grupo",ipa:"/əˈdres/",fen:"The admiral addressed the crew before departure.",fes:"El almirante se dirigió a la dotación antes de la salida."},
{id:"issue-problem",en:"issue",es:"asunto, problema",sense:"cuestión a tratar",ipa:"/ˈɪʃuː/",fen:"Fatigue is a serious issue on long deployments.",fes:"La fatiga es un problema serio en despliegues largos."},
{id:"issue-give",en:"issue",es:"entregar, distribuir",sense:"material o equipo oficial",ipa:"/ˈɪʃuː/",fen:"New uniforms were issued to the whole crew.",fes:"Se entregaron uniformes nuevos a toda la dotación."},
{id:"account-explain",en:"account for",es:"explicar, justificar",sense:"dar razón de algo",ipa:"/əˈkaʊnt fɔː/",fen:"How do you account for the delay?",fes:"¿Cómo explicas el retraso?"},
{id:"account-share",en:"account for",es:"representar, suponer",sense:"una parte o proporción",ipa:"/əˈkaʊnt fɔː/",fen:"Fuel accounts for a third of the budget.",fes:"El combustible representa un tercio del presupuesto."},
{id:"carry-out",en:"carry out",es:"llevar a cabo, realizar",sense:"una tarea o plan",ipa:"/ˈkæri aʊt/",fen:"The inspection was carried out last week.",fes:"La inspección se llevó a cabo la semana pasada."},
{id:"comply",en:"comply with",es:"cumplir, acatar",sense:"una norma u orden",ipa:"/kəmˈplaɪ wɪð/",fen:"All personnel must comply with safety regulations.",fes:"Todo el personal debe cumplir las normas de seguridad."},
{id:"assess",en:"assess",es:"evaluar, valorar",sense:"analizar una situación",ipa:"/əˈses/",fen:"We need to assess the damage before sailing.",fes:"Tenemos que evaluar los daños antes de navegar."},
{id:"nevertheless",en:"nevertheless",es:"no obstante, sin embargo",sense:"conector formal de contraste",ipa:"/ˌnevəðəˈles/",fen:"The sea was rough; nevertheless, we completed the exercise.",fes:"La mar estaba dura; no obstante, completamos el ejercicio."},
{id:"furthermore",en:"furthermore",es:"además, es más",sense:"conector formal de adición",ipa:"/ˌfɜːðəˈmɔː/",fen:"Furthermore, the new system reduces fuel consumption.",fes:"Además, el nuevo sistema reduce el consumo de combustible."},
{id:"albeit",en:"albeit",es:"aunque, si bien",sense:"concesivo culto",ipa:"/ɔːlˈbiːɪt/",fen:"It was a useful course, albeit a demanding one.",fes:"Fue un curso útil, aunque exigente.",assoc:{bridge:"all be it → «aunque (así) sea»",scene:"Un caballero medieval negocia la rendición de un castillo. El enemigo le ofrece un trato durísimo y él, cruzándose de brazos, acaba cediendo a regañadientes: «Está bien... ALL BE IT (sea como sea, aunque me cueste sangre), acepto el trato».",funny:"Firma con cara de asco mientras el dragón, detrás, le seca una lágrima con la punta del ala.",recall:"Ese «sí, pero...», ese «sea como sea, aunque no me guste», es albeit: aunque, si bien.",why:"albeit viene de «all be it» (aunque ello sea) y suena «ol-BI-it», con la «be» dentro; el caballero que cede «sea como sea» fija «aunque»."}},
{id:"notwithstanding",en:"notwithstanding",es:"a pesar de, pese a",sense:"concesivo formal",ipa:"/ˌnɒtwɪθˈstændɪŋ/",fen:"Notwithstanding the weather, the drill went ahead.",fes:"A pesar del tiempo, el simulacro siguió adelante.",assoc:{bridge:"not withstanding (nada lo resiste/detiene)",scene:"El mismo caballero del castillo marcha hacia la batalla en mitad de una tormenta brutal: granizo del tamaño de melones, rayos, viento huracanado. Nada lo detiene; avanza A PESAR DE todo, con la armadura humeante.",funny:"El granizo rebota en su yelmo tocando una melodía, pero él sigue caminando como si tal cosa.",recall:"Seguir adelante y que nada te frene, pese a todo, es notwithstanding: a pesar de.",why:"se parte en not + withstanding: nada «resiste/detiene» su avance; el caballero cruzando la tormenta fija «a pesar de»."}},
{id:"hence",en:"hence",es:"por lo tanto, de ahí",sense:"consecuencia formal",ipa:"/hens/",fen:"The radar failed; hence the delay.",fes:"El radar falló; de ahí el retraso."},
{id:"even-though",en:"even though",es:"aun cuando, a pesar de que",sense:"concesivo con hechos reales",ipa:"/ˈiːvn ðəʊ/",fen:"Even though I was exhausted, I kept studying.",fes:"Aun estando agotado, seguí estudiando."},
{id:"some-extent",en:"to some extent",es:"hasta cierto punto",sense:"matizar una afirmación",ipa:"/tə sʌm ɪkˈstent/",fen:"To some extent, I agree with that view.",fes:"Hasta cierto punto, coincido con esa opinión."},

/* ================= NIVELES ================= */
/* st: pending → learning → d1 → w1 → w2 → m1 → m2 → done
   Dirección: la 1ª comprobación de cada nivel es EN→ES; la 2ª, ES→EN */
const LV = {
  d1:{label:"1 día",       chev:2, dir:"en", next:"w1",  gap:7,  pts:1,  keep:1},
  w1:{label:"1 semana · 1ª",chev:3, dir:"en", next:"w2",  gap:7,  pts:0,  keep:7},
  w2:{label:"1 semana · 2ª",chev:3, dir:"es", next:"m1",  gap:30, pts:3,  keep:7},
  m1:{label:"1 mes · 1ª",   chev:4, dir:"en", next:"m2",  gap:30, pts:0,  keep:30},
  m2:{label:"1 mes · 2ª",   chev:4, dir:"es", next:"done",gap:0,  pts:10, keep:30}
};
const DEMOTES = {
  d1:[["learning","Aprendiendo"]],
  w1:[["d1","1 día"],["learning","Aprendiendo"]],
  w2:[["d1","1 día"],["learning","Aprendiendo"]],
  m1:[["w1","1 semana"],["d1","1 día"],["learning","Aprendiendo"]],
  m2:[["w1","1 semana"],["d1","1 día"],["learning","Aprendiendo"]]
};

/* ================= ESTADO ================= */
const KEY="bitacora-slp-v1";
const VERSION="1.8";
let S;
/* Doble puntuación SOLO para expresiones largas (4+ palabras), cuya frase de
   ejemplo también es larga. Dos o tres palabras puntúan como una palabra. */
const isExpr=c=>c.en.trim().split(/\s+/).filter(Boolean).length>=4;
function migrate(){
  S.cards.forEach(c=>{if(c.seen==null)c.seen=0;});
  // Las fichas del deck toman siempre la asociación más reciente del archivo.
  SEED.forEach(s=>{
    if(s.assoc){const c=S.cards.find(x=>x.id===s.id);if(c)c.assoc=s.assoc;}
  });
}
function logDay(p,d){
  if(!S.hist)S.hist={};
  const t=today();
  const h=S.hist[t]||(S.hist[t]={p:0,d:0});
  h.p+=p;h.d+=d;
}
function syncSeed(){
  let added=0;
  SEED.forEach(c=>{
    if(!S.cards.find(x=>x.id===c.id)){S.cards.push({...c,st:"pending",due:null,seen:0});added++;}
  });
  if(!S.hist)S.hist={};
  migrate();
  save();
  return added;
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){S=JSON.parse(raw);syncSeed();return;}
  }catch(e){}
  S={cards:SEED.map(c=>({...c,st:"pending",due:null,seen:0})),pts:0,streak:0,last:null,hist:{}};
  save();
}
function save(){
  S.ts=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){toast("No se pudo guardar (¿modo privado?)");}
}
/* Si la app está abierta a la vez en Safari y como app instalada, al volver a
   primer plano se sincroniza con lo último guardado en vez de machacarlo. */
function refreshFromStorage(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw)return;
    const d=JSON.parse(raw);
    if(d&&d.ts&&(!S.ts||d.ts>S.ts)){S=d;home();}
  }catch(e){}
}
document.addEventListener("visibilitychange",function(){if(!document.hidden)refreshFromStorage();});
window.addEventListener("pageshow",function(e){if(e.persisted)refreshFromStorage();});
function today(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function addDays(n){
  const d=new Date();d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function touchStreak(){
  const t=today();
  if(S.last===t)return;
  const y=new Date();y.setDate(y.getDate()-1);
  const yd=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  S.streak=(S.last===yd)?S.streak+1:1;
  S.last=t;
}
const dueCards=()=>S.cards.filter(c=>LV[c.st]&&c.due&&c.due<=today());
const byId=id=>S.cards.find(c=>c.id===id);

/* ================= AUDIO ================= */
let VOICE=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  VOICE=vs.find(v=>v.lang==="en-GB")||vs.find(v=>v.lang.startsWith("en-"))||vs.find(v=>v.lang.startsWith("en"))||null;
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}
function speak(txt){
  if(!("speechSynthesis" in window)){toast("Audio no disponible");return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang=VOICE?VOICE.lang:"en-GB";
  if(VOICE)u.voice=VOICE;
  u.rate=0.92;
  speechSynthesis.speak(u);
}

/* ================= UI ================= */
const app=document.getElementById("app");
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const XB='<span class="sense" style="color:var(--brass);border-color:var(--brass);margin-left:4px">expresión larga ×2</span>';
function assocBlock(c){
  if(!c.assoc)return "";
  const a=c.assoc;
  let inner="";
  if(a.bridge)inner+='<p class="amn"><span>🎭 Palabra puente</span>'+esc(a.bridge)+'</p>';
  if(a.scene)inner+='<p class="amn"><span>🎬 La escena</span>'+esc(a.scene)+'</p>';
  if(a.funny)inner+='<p class="amn"><span>😂 El toque absurdo</span>'+esc(a.funny)+'</p>';
  if(a.recall)inner+='<p class="amn"><span>🧠 Qué recordar</span>'+esc(a.recall)+'</p>';
  if(a.why)inner+='<p class="amn"><span>💡 Por qué funciona</span>'+esc(a.why)+'</p>';
  const id="as-"+c.id;
  return '<button class="assocbtn" onclick="toggleAssoc(\''+id+'\',this)">🧠 Asociación</button>'+
         '<div id="'+id+'" class="assoc hidden">'+inner+'</div>';
}
function toggleAssoc(id,btn){
  const e=document.getElementById(id);
  e.classList.toggle("hidden");
  btn.textContent=e.classList.contains("hidden")?"🧠 Asociación":"🧠 Ocultar asociación";
}
function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1700);
}
function chevrons(n,star){
  let h='<div class="chev">';
  for(let i=1;i<=4;i++)h+='<i class="'+(i<=n?"on":"")+'"></i>';
  h+='<i class="star '+(star?"on":"")+'"></i></div>';
  return h;
}
function levelRow(c,pill){
  const st=c.st;
  let n=0,star=false,txt="";
  if(st==="learning"){n=1;txt="Aprendiendo";}
  else if(LV[st]){n=LV[st].chev;txt=LV[st].label;}
  else if(st==="done"){n=4;star=true;txt="Dominada";}
  const p=pill?'<span class="dirpill">'+pill+'</span>':'';
  return '<div class="levelrow">'+chevrons(n,star)+'<span class="lvltxt">'+txt+'</span>'+p+'</div>';
}

    <button class="big" onclick="newCards()"><span>Añadir palabras nuevas</span><span class="n">${pending}</span></button>
    <button class="big" onclick="progressView('d')"><span>Progreso</span><span class="n">▤</span></button>
    <button class="big" onclick="dataView()"><span>Datos y copia de seguridad</span><span class="n">›</span></button>
  </div>
  <p class="version">Bitácora SLP · v${VERSION}</p>`;
}

/* ---------- REPASO ---------- */
let queue=[],qTotal=0,sesOk=0,sesKo=0;
function review(){
  const due=dueCards();
  for(let i=due.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[due[i],due[j]]=[due[j],due[i]];}
  queue=due.map(c=>c.id);
  qTotal=queue.length;sesOk=0;sesKo=0;
  if(!qTotal){
    app.innerHTML='<div class="empty">Sin repasos pendientes.<br>El cuaderno está al día: vuelve mañana.</div>'+backBtn();
    return;
  }
  question();
}
function question(){
  if(!queue.length){
    app.innerHTML='<div class="empty">Repaso de hoy completado.<br>'+sesOk+' aciertos · '+sesKo+' fallos.<br>Buen rumbo.</div>'+backBtn();
    return;
  }
  const c=byId(queue[0]);
  const dir=LV[c.st].dir;
  const pill=dir==="en"?"EN → ES":"ES → EN";
  let front;
  if(dir==="en"){
    front=`<div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div>
      <div class="phrase">${esc(c.fen)}</div>
      <button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>`;
  }else{
    front=`<div class="word">${esc(c.es)}</div><div><span class="sense">${esc(c.sense)}</span>${isExpr(c)?XB:""}</div>
      <div class="phrase es">${esc(c.fes)}</div>`;
  }
  app.innerHTML=`
  <div class="progress">${qTotal-queue.length+1} de ${qTotal}</div>
  <div class="card">
    ${levelRow(c,pill)}
    ${front}
    <div id="answer" class="hidden"></div>
  </div>
  <div id="controls">
    <button class="primary" onclick="reveal()">Mostrar respuesta</button>
  </div>`;
}
function reveal(){
  const c=byId(queue[0]);
  const dir=LV[c.st].dir;
  const ans=document.getElementById("answer");
  if(dir==="en"){
    ans.innerHTML=`<div class="divider"></div>
      <div class="word">${esc(c.es)}</div><div><span class="sense">${esc(c.sense)}</span>${isExpr(c)?XB:""}</div>
      <div class="phrase es">${esc(c.fes)}</div>${assocBlock(c)}`;
  }else{
    ans.innerHTML=`<div class="divider"></div>
      <div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div>
      <div class="phrase">${esc(c.fen)}</div>
      <button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>${assocBlock(c)}`;
  }
  ans.classList.remove("hidden");
  document.getElementById("controls").innerHTML=`
    <div class="row">
      <button class="badbtn" onclick="fail()">✗ No la sabía</button>
      <button class="okbtn" onclick="pass()">✓ La sabía</button>
    </div>`;
}
function pass(){
  const c=byId(queue.shift());
  const lv=LV[c.st];
  const gained=lv.pts*(isExpr(c)?2:1);
  touchStreak();sesOk++;
  if(lv.next==="done"){
    c.st="done";c.due=null;
  }else{
    c.st=lv.next;c.due=addDays(lv.gap);
  }
  if(gained>0)S.pts+=gained;
  logDay(gained,c.st==="done"?1:0);
  save();
  if(c.st==="done")toast("★ Dominada · +"+gained+" puntos");
  else if(gained>0)toast("+"+gained+(gained===1?" punto":" puntos")+" · siguiente en "+lv.gap+" días");
  else toast("✓ Siguiente comprobación en "+lv.gap+" días");
  question();
}
function fail(){
  const c=byId(queue[0]);
  const lv=LV[c.st];
  let opts=`<button class="ghost" onclick="keepLevel()">Mantener en ${lv.label.split(" ·")[0]} · repito en ${lv.keep===1?"1 día":lv.keep+" días"}</button>`;
  DEMOTES[c.st].forEach(([st,name])=>{
    opts+=`<button class="ghost" onclick="demote('${st}')">Bajar a ${name}</button>`;
  });
  document.getElementById("controls").innerHTML=
    '<p class="hint" style="text-align:center;margin-bottom:10px">Sin puntos. ¿Qué hacemos con ella?</p>'+
    '<div class="menu">'+opts+'</div>';
}
function keepLevel(){
  const c=byId(queue.shift());
  c.due=addDays(LV[c.st].keep);
  touchStreak();sesKo++;save();question();
}
function demote(st){
  const c=byId(queue.shift());
  c.st=st;
  c.due=st==="learning"?null:addDays(st==="d1"?1:7);
  touchStreak();sesKo++;save();question();
}

/* ---------- PROGRESO ---------- */
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function bars(data,labels,stars){
  const W=480,H=140;
  const max=Math.max(1,...data);
  const bw=W/data.length;
  const w=Math.min(bw-6,40);
  let s='<svg viewBox="0 0 '+W+' '+(H+26)+'" style="width:100%;display:block">';
  data.forEach((v,i)=>{
    const h=v?Math.max(3,Math.round(v/max*(H-34))):3;
    const x=i*bw+(bw-w)/2, y=H-h;
    s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3" fill="#C9A063" opacity="'+(v?0.95:0.15)+'"/>';
    if(v)s+='<text x="'+(i*bw+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="11" fill="#EFE7D6">'+v+'</text>';
    if(stars[i])s+='<text x="'+(i*bw+bw/2)+'" y="'+(y-19)+'" text-anchor="middle" font-size="10" fill="#C9A063">'+"★".repeat(Math.min(stars[i],3))+(stars[i]>3?"+":"")+'</text>';
    s+='<text x="'+(i*bw+bw/2)+'" y="'+(H+18)+'" text-anchor="middle" font-size="10" fill="#7FA3C0">'+labels[i]+'</text>';
  });
  return s+'</svg>';
}
function progressView(tab){
  if(!S.hist)S.hist={};
  const done=S.cards.filter(c=>c.st==="done").length;
  const th=S.hist[today()]||{p:0,d:0};
  let chart,caption;
  if(tab==="d"){
    const data=[],labels=[],stars=[];
    for(let i=13;i>=0;i--){
      const k=addDays(-i);
      const h=S.hist[k]||{p:0,d:0};
      data.push(h.p);stars.push(h.d);
      labels.push(parseInt(k.slice(8),10));
    }
    chart=bars(data,labels,stars);
    caption="Puntos por día · últimos 14 días";
  }else if(tab==="w"){
    const data=[],labels=[],stars=[];
    const base=new Date();
    base.setDate(base.getDate()-((base.getDay()+6)%7)); // lunes de esta semana
    for(let j=7;j>=0;j--){
      const start=new Date(base);start.setDate(base.getDate()-j*7);
      let p=0,dn=0;
      for(let d=0;d<7;d++){
        const dd=new Date(start);dd.setDate(start.getDate()+d);
        const key=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
        const h=S.hist[key];if(h){p+=h.p;dn+=h.d;}
      }
      data.push(p);stars.push(dn);
      labels.push(start.getDate()+"/"+(start.getMonth()+1));
    }
    chart=bars(data,labels,stars);
    caption="Puntos por semana · últimas 8 semanas (lun–dom)";
  }else{
    const data=[],labels=[],stars=[];
    for(let j=5;j>=0;j--){
      const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-j);
      const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      let p=0,dn=0;
      Object.keys(S.hist).forEach(k=>{if(k.slice(0,7)===key){p+=S.hist[k].p;dn+=S.hist[k].d;}});
      data.push(p);stars.push(dn);
      labels.push(MESES[d.getMonth()]);
    }
    chart=bars(data,labels,stars);
    caption="Puntos por mes · últimos 6 meses";
  }
  const per=tab==="d"?"día":tab==="w"?"semana":"mes";
  app.innerHTML=`
  <h2>Progreso</h2>
  <div class="stats">
    <div class="stat"><b style="color:var(--brass)">${th.p}</b><span>Puntos hoy</span></div>
    <div class="stat"><b style="color:var(--brass)">${done}</b><span>Dominadas</span></div>
    <div class="stat"><b>${S.streak}</b><span>Racha días</span></div>
  </div>
  <div class="row" style="margin-bottom:12px">
    <button class="${tab==="d"?"primary":"ghost"}" style="flex:1" onclick="progressView('d')">Diario</button>
    <button class="${tab==="w"?"primary":"ghost"}" style="flex:1" onclick="progressView('w')">Semanal</button>
    <button class="${tab==="m"?"primary":"ghost"}" style="flex:1" onclick="progressView('m')">Mensual</button>
  </div>
  <div class="card">
    <p class="lvltxt" style="margin-bottom:12px">${caption}</p>
    ${chart}
    <p class="hint">★ = dominadas ese ${per} · Puntos: palabra 1 / 3 / 10 · expresión larga (4+ palabras) 2 / 6 / 20</p>
  </div>
  <h2>En travesía</h2>
  <p class="sub">Fichas esperando su comprobación. No se pueden repasar antes de tiempo.</p>
  <div class="pipeline" style="margin-top:12px"><span>1 día <b>${S.cards.filter(c=>c.st==="d1").length}</b></span><span>1 semana <b>${S.cards.filter(c=>c.st==="w1"||c.st==="w2").length}</b></span><span>1 mes <b>${S.cards.filter(c=>c.st==="m1"||c.st==="m2").length}</b></span></div>`+backBtn();
}

/* ---------- APRENDIENDO ---------- */
function learningList(){
  const list=S.cards.filter(c=>c.st==="learning");
  let h='<h2>Aprendiendo</h2><p class="sub">Estudia estas fichas. Cuando tengas una memorizada, márcala y mañana te la preguntaré de inglés a español.</p>';
  if(list.length>1)h+='<div class="menu" style="margin-top:14px"><button class="primary" onclick="trainStart()">🎯 Entrenar estas '+list.length+' fichas</button></div>';
  else h+='<br>';
  if(!list.length)h+='<div class="empty">No hay fichas en estudio.<br>Añade palabras nuevas al cuaderno.</div>';
  list.forEach(c=>{
    const seen=c.seen?'<span class="seen">'+c.seen+' 🏋️</span>':'';
    h+=`<div class="card">${levelRow(c).replace('</div>',seen+'</div>')}
      <div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div>
      <div><span class="sense">${esc(c.sense)}</span>${isExpr(c)?XB:""}</div>
      <div class="phrase">${esc(c.fen)}</div>
      <div class="divider"></div>
      <div class="word" style="font-size:20px">${esc(c.es)}</div>
      <div class="phrase es">${esc(c.fes)}</div>
      ${assocBlock(c)}
      <div class="row" style="margin-top:14px">
        <button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>
        <button class="ghost" style="flex:1" id="k-${c.id}" onclick="known('${c.id}')">Ya me la sé</button>
      </div>
    </div>`;
  });
  app.innerHTML=h+backBtn();
}
function known(id){
  const b=document.getElementById("k-"+id);
  if(b.dataset.c){
    const c=byId(id);
    c.st="d1";c.due=addDays(1);
    touchStreak();save();
    toast("Te la pregunto mañana");
    learningList();
  }else{
    b.dataset.c="1";b.textContent="¿Seguro? Te la pregunto mañana";
    b.style.borderColor="var(--brass)";b.style.color="var(--brass)";
  }
}

/* ---------- ENTRENAMIENTO (práctica libre, sin puntos) ---------- */
let tPool=[],tDir="en";
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function trainStart(){
  tPool=shuffle(S.cards.filter(c=>c.st==="learning").map(c=>c.id));
  if(!tPool.length){app.innerHTML='<div class="empty">No hay fichas en estudio.</div>'+backBtn();return;}
  trainCard();
}
function trainCard(){
  if(!tPool.length){
    app.innerHTML='<div class="empty">Vuelta completada.<br>Sigue con las que aún se resisten o vuelve al cuaderno.</div>'+
      '<div class="menu"><button class="primary" onclick="trainStart()">Otra vuelta</button></div>'+
      '<button class="back" onclick="learningList()">‹ Volver a Aprendiendo</button>';
    return;
  }
  const c=byId(tPool[0]);
  tDir=Math.random()<0.5?"en":"es";
  const front=tDir==="en"
    ?`<div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div><div class="phrase">${esc(c.fen)}</div>`
    :`<div class="word">${esc(c.es)}</div><div><span class="sense">${esc(c.sense)}</span>${isExpr(c)?XB:""}</div><div class="phrase es">${esc(c.fes)}</div>`;
  app.innerHTML=`
  <div class="progress">Entrenamiento · ${tPool.length} en cola</div>
  <div class="card">
    <div class="levelrow"><span class="lvltxt">${tDir==="en"?"EN → ES":"ES → EN"}</span>${c.seen?'<span class="seen">'+c.seen+' 🏋️</span>':''}</div>
    ${front}
    <div id="tans" class="hidden"></div>
  </div>
  <div id="tctrl"><button class="primary" onclick="trainReveal()">Mostrar traducción</button></div>
  <button class="back" onclick="learningList()">✕ Terminar entrenamiento</button>`;
}
function trainReveal(){
  const c=byId(tPool[0]);
  const back=tDir==="en"
    ?`<div class="divider"></div><div class="word">${esc(c.es)}</div><div><span class="sense">${esc(c.sense)}</span>${isExpr(c)?XB:""}</div><div class="phrase es">${esc(c.fes)}</div>${assocBlock(c)}`
    :`<div class="divider"></div><div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div><div class="phrase">${esc(c.fen)}</div><button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>${assocBlock(c)}`;
  const t=document.getElementById("tans");t.innerHTML=back;t.classList.remove("hidden");
  document.getElementById("tctrl").innerHTML=`
    <div class="row">
      <button class="ghost" style="flex:1" onclick="trainNext()">↻ Repasar más</button>
      <button class="okbtn" onclick="trainGot()">✓ Aprendida</button>
    </div>
    <p class="tcount">«Repasar más» suma al contador de dificultad</p>`;
}
function trainNext(){
  const c=byId(tPool.shift());
  c.seen=(c.seen||0)+1;save();
  tPool.push(c.id); // vuelve al final de la cola
  trainCard();
}
function trainGot(){
  const c=byId(tPool.shift());
  c.st="d1";c.due=addDays(1);
  touchStreak();save();
  toast("Aprendida · te la pregunto mañana");
  trainCard();
}

/* ---------- NUEVAS ---------- */
function newCards(){
  const p=S.cards.filter(c=>c.st==="pending");
  if(!p.length){
    app.innerHTML='<div class="empty">No quedan palabras pendientes.<br>Pídeme una tanda nueva y la importas en Datos.</div>'+backBtn();
    return;
  }
  const c=p[0];
  app.innerHTML=`
  <h2>Palabra nueva</h2><p class="sub">${p.length} pendientes en la base</p><br>
  <div class="card">
    <div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div>
    <div><span class="sense">${esc(c.sense)}</span>${isExpr(c)?XB:""}</div>
    <div class="phrase">${esc(c.fen)}</div>
    <div class="divider"></div>
    <div class="word" style="font-size:20px">${esc(c.es)}</div>
    <div class="phrase es">${esc(c.fes)}</div>
    <button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>${assocBlock(c)}
  </div>
  <div class="menu">
    <button class="primary" onclick="startLearn('${c.id}')">Empezar a estudiarla</button>
    <button class="ghost" onclick="skipCard('${c.id}')">Más tarde</button>
  </div>`+backBtn();
}
function startLearn(id){
  const c=byId(id);c.st="learning";
  touchStreak();save();toast("Al cuaderno de Aprendiendo");newCards();
}
function skipCard(id){
  const i=S.cards.findIndex(c=>c.id===id);
  const [c]=S.cards.splice(i,1);S.cards.push(c);
  save();newCards();
}

/* ---------- DATOS ---------- */
function dataView(){
  const done=S.cards.filter(c=>c.st==="done").length;
  const inplay=S.cards.filter(c=>["learning","d1","w1","w2","m1","m2"].includes(c.st)).length;
  const nexpr=S.cards.filter(isExpr).length;
  app.innerHTML=`
  <h2>Datos</h2>
  <div class="card">
    <p class="sub">Fichas totales: <b style="color:var(--ivory)">${S.cards.length}</b> · En juego: <b style="color:var(--ivory)">${inplay}</b> · Dominadas: <b style="color:var(--brass)">${done}</b> · Puntos: <b style="color:var(--brass)">${S.pts}</b></p>
    <p class="sub" style="margin-top:6px">Palabras y expresiones cortas: <b style="color:var(--ivory)">${S.cards.length-nexpr}</b> · Expresiones largas: <b style="color:var(--ivory)">${nexpr}</b> (4+ palabras, puntúan el doble)</p>
  </div>
  <div class="menu"><button class="big" onclick="masteredList()"><span>Ver dominadas</span><span class="n">${done}</span></button></div>
  <h2>Copia de seguridad</h2>
  <p class="sub">Descarga o copia el archivo completo (fichas + progreso). Guárdalo y compártemelo en el chat para seguimiento.</p>
  <div class="menu" style="margin-top:10px">
    <button class="primary" onclick="exportData()">Descargar copia</button>
    <button class="ghost" onclick="copyData()">Copiar al portapapeles</button>
  </div>
  <h2>Importar</h2>
  <p class="sub">Pega aquí una tanda nueva de fichas (te las genero yo) o una copia de seguridad completa.</p>
  <textarea id="imp" placeholder='[{"id":"...","en":"...","es":"...","sense":"...","ipa":"...","fen":"...","fes":"..."}]'></textarea>
  <div class="menu">
    <button class="primary" onclick="importBatch()">Añadir tanda nueva</button>
    <button class="ghost" onclick="restoreBackup()">Restaurar copia completa</button>
  </div>`+backBtn();
}
function masteredList(){
  const list=S.cards.filter(c=>c.st==="done");
  let h='<h2>Dominadas</h2><p class="sub">Tu botín. Estas ya son tuyas.</p><br>';
  if(!list.length)h+='<div class="empty">Aún ninguna.<br>La primera cae en unos 75 días de trabajo constante.</div>';
  list.forEach(c=>{
    h+=`<div class="card">${levelRow(c)}
      <div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div>
      <div><span class="sense">${esc(c.sense)}</span>${isExpr(c)?XB:""}</div>
      <div class="phrase">${esc(c.fen)}</div>
      <div class="divider"></div>
      <div class="word" style="font-size:20px">${esc(c.es)}</div>
      <div class="phrase es">${esc(c.fes)}</div>
      <button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>${assocBlock(c)}
    </div>`;
  });
  app.innerHTML=h+backBtn();
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="bitacora-slp-"+today()+".json";
  a.click();
}
function copyData(){
  navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast("Copiado")).catch(()=>toast("No se pudo copiar"));
}
function importBatch(){
  try{
    let data=JSON.parse(document.getElementById("imp").value.trim());
    if(!Array.isArray(data))data=data.cards;
    if(!Array.isArray(data))throw 0;
    let added=0,upd=0;
    data.forEach(c=>{
      if(!c.id)return;
      const ex=byId(c.id);
      if(!ex&&c.en&&c.es){
        S.cards.push({id:c.id,en:c.en,es:c.es,sense:c.sense||"",ipa:c.ipa||"",fen:c.fen||"",fes:c.fes||"",assoc:c.assoc||null,st:"pending",due:null,seen:0});
        added++;
      }else if(ex&&c.assoc){
        ex.assoc=c.assoc;upd++;
      }
    });
    save();
    toast(added+" añadidas · "+upd+" asociaciones");dataView();
  }catch(e){toast("Formato no válido");}
}
function restoreBackup(){
  try{
    const data=JSON.parse(document.getElementById("imp").value.trim());
    if(!data.cards||!Array.isArray(data.cards))throw 0;
    if(!confirm("Esto sustituye TODO el progreso actual por el de la copia. ¿Continuar?"))return;
    S=data;save();syncSeed();toast("Copia restaurada");home();
  }catch(e){toast("Formato no válido");}
}

const backBtn=()=>'<button class="back" onclick="home()">‹ Volver al panel</button>';

/* ================= ARRANQUE ================= */
load();
home();

/* Service worker: guarda la app en el móvil para uso sin conexión.
   Si se abre el archivo suelto (sin servidor) falla en silencio y no pasa nada. */
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.update();
      setInterval(function(){reg.update();},60*60*1000);
    }).catch(function(){});
  });
  var swReloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(swReloaded)return;
    swReloaded=true;
    location.reload();
  });
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden&&navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(function(reg){if(reg)reg.update();}).catch(function(){});
    }
  });
}
</script>
</body>
