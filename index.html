/* ---------- REPASO ---------- */
let queue=[],qTotal=0,sesOk=0,sesKo=0;
/* Deshacer: guarda la ficha y el marcador tal y como estaban antes de responder,
   para poder revertir un toque equivocado. Solo la última respuesta. */
let lastAct=null;
function snapshot(c){
  const h=S.hist&&S.hist[today()];
  lastAct={id:c.id,st:c.st,due:c.due,earned:c.earned,locked:c.locked,rdir:c.rdir,seen:c.seen,
           pts:S.pts,hist:h?{p:h.p,d:h.d}:null,ok:sesOk,ko:sesKo};
}
function undoLast(){
  if(!lastAct)return;
  const c=byId(lastAct.id);
  if(!c){lastAct=null;return;}
  c.st=lastAct.st;c.due=lastAct.due;c.earned=lastAct.earned;
  c.locked=lastAct.locked;c.rdir=lastAct.rdir;c.seen=lastAct.seen;
  S.pts=lastAct.pts;
  if(!S.hist)S.hist={};
  if(lastAct.hist)S.hist[today()]=lastAct.hist; else delete S.hist[today()];
  S.streak=streakCount();
  sesOk=lastAct.ok;sesKo=lastAct.ko;
  if(queue[0]!==lastAct.id)queue.unshift(lastAct.id);
  lastAct=null;
  save();toast("Respuesta deshecha");
  question();
}
function review(){
  const due=dueCards();
  for(let i=due.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[due[i],due[j]]=[due[j],due[i]];}
  queue=due.map(c=>c.id);
  qTotal=queue.length;sesOk=0;sesKo=0;lastAct=null;
  if(!qTotal){
    app.innerHTML='<div class="empty">Sin repasos pendientes.<br>El cuaderno está al día: vuelve mañana.</div>'+backBtn();
    return;
  }
  question();
}
function question(){
  if(!queue.length){
    app.innerHTML='<div class="empty">Repaso de hoy completado.<br>'+sesOk+' aciertos · '+sesKo+' fallos.<br>Buen rumbo.</div>'+
      (lastAct?'<button class="back" onclick="undoLast()">↩ Deshacer la última respuesta</button>':'')+backBtn();
    return;
  }
  const c=byId(queue[0]);
  const rev=c.st==="done";
  const dir=rev?(c.rdir||"en"):LV[c.st].dir;
  const pill=(rev?"★ ":"")+(dir==="en"?"EN → ES":"ES → EN");
  let front;
  if(dir==="en"){
    front=`<div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div>
      <div class="phrase">${esc(c.fen)}</div>
      <button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>`;
  }else{
    front=`<div class="word">${esc(c.es)}</div><div><span class="sense">${esc(c.sense)}</span></div>
      <div class="phrase es">${esc(c.fes)}</div>`;
  }
  app.innerHTML=`
  <div class="progress">${qTotal-queue.length+1} de ${qTotal}</div>
  <div class="card">
    ${levelRow(c,pill)}
    ${front}
    <div id="answer" class="hidden"></div>
  </div>
  <div id="controls">
    <button class="primary" onclick="reveal()">Mostrar respuesta</button>
  </div>
  ${lastAct?'<button class="back" onclick="undoLast()">↩ Deshacer la respuesta anterior</button>':''}`;
}
function reveal(){
  const c=byId(queue[0]);
  const dir=c.st==="done"?(c.rdir||"en"):LV[c.st].dir;
  const ans=document.getElementById("answer");
  if(dir==="en"){
    ans.innerHTML=`<div class="divider"></div>
      <div class="word">${esc(c.es)}</div><div><span class="sense">${esc(c.sense)}</span></div>
      <div class="phrase es">${esc(c.fes)}</div>${assocBlock(c)}`;
  }else{
    ans.innerHTML=`<div class="divider"></div>
      <div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div>
      <div class="phrase">${esc(c.fen)}</div>
      <button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>${assocBlock(c)}`;
  }
  ans.classList.remove("hidden");
  document.getElementById("controls").innerHTML=`
    <div class="row">
      <button class="badbtn" onclick="fail()">✗ No la sabía</button>
      <button class="okbtn" onclick="pass()">✓ La sabía</button>
    </div>`;
}
function pass(){
  snapshot(byId(queue[0]));
  const c=byId(queue.shift());
  touchStreak();sesOk++;
  if(c.st==="done"){                       // repaso de retención superado
    const gain=REV_PTS;
    S.pts+=gain; c.earned=(c.earned||0)+gain; c.locked=c.earned;
    c.rdir=(c.rdir==="en")?"es":"en";       // alterna la dirección la próxima vez
    const n=scheduleRevision(c);
    logDay(gain,0); save();
    toast("+"+gain+" · retención confirmada · vuelve en "+Math.round(n/30)+" meses");
    question(); return;
  }
  const lv=LV[c.st];
  if(lv.next==="done"){c.st="done";}
  else{c.st=lv.next;c.due=addDays(lv.gap);}
  const delta=setCredit(c,c.st);
  if(c.st==="done"){c.locked=c.earned;scheduleRevision(c);}
  logDay(delta,c.st==="done"?1:0);
  save();
  if(c.st==="done")toast("★ Dominada · +"+delta+" puntos");
  else if(delta>0)toast("+"+delta+(delta===1?" punto":" puntos")+" · siguiente en "+lv.gap+" días");
  else toast("✓ Siguiente comprobación en "+lv.gap+" días");
  question();
}
function fail(){
  const c=byId(queue[0]);
  if(c.st==="done"){                       // falla un repaso de retención
    document.getElementById("controls").innerHTML=
      '<p class="hint" style="text-align:center;margin-bottom:10px">Sigue siendo tuya: los puntos ya conseguidos no se pierden.</p>'+
      '<div class="menu">'+
      '<button class="ghost" onclick="keepLevel()">↻ Volver a comprobarla en 30 días</button>'+
      '<button class="ghost" onclick="demote(\'learning\')">‹ Volver a estudiarla desde el principio</button>'+
      '</div>';
    return;
  }
  const lv=LV[c.st];
  const cost=st=>{
    const d=Math.max(creditFor(c,st),c.locked||0)-(c.earned||0);
    return d<0?' <span style="opacity:.8">('+d+" pts)</span>":"";
  };
  let opts=`<button class="ghost" onclick="keepLevel()">↻ Repetir · te la pregunto en ${lv.keep} días</button>`;
  DEMOTES[c.st].forEach(([st,name])=>{
    opts+=`<button class="ghost" onclick="demote('${st}')">‹ Retroceder a ${name}${cost(st)}</button>`;
  });
  document.getElementById("controls").innerHTML=
    '<p class="hint" style="text-align:center;margin-bottom:10px">Retroceder descuenta los puntos de esa palabra; los recuperas cuando vuelvas a superarla.</p>'+
    '<div class="menu">'+opts+'</div>';
}
function keepLevel(){
  snapshot(byId(queue[0]));
  const c=byId(queue.shift());
  c.due=addDays(c.st==="done"?30:LV[c.st].keep);
  touchStreak();sesKo++;save();question();
}
function demote(st){
  snapshot(byId(queue[0]));
  const c=byId(queue.shift());
  c.st=st;
  c.due=st==="learning"?null:addDays(ENTRY_GAP[st]||7);
  const delta=setCredit(c,st);
  if(delta)logDay(delta,0);
  touchStreak();sesKo++;save();
  if(delta<0)toast(delta+" puntos · recuperables");
  question();
}

/* ---------- BUSCADOR ---------- */
const ST_LABEL={pending:"Sin empezar",learning:"Aprendiendo",d1:"1 día",d2:"1 día",w1:"1 semana",w2:"1 semana",m1:"1 mes",m2:"1 mes",done:"Dominada"};
const FILTROS=[["all","Todas"],["pending","Sin empezar"],["learning","Aprendiendo"],["travesia","En travesía"],["done","Dominadas"]];
let sFiltro="all";
const enTravesia=c=>!!LV[c.st];
function setFiltro(f){
  sFiltro=f;
  FILTROS.forEach(([k])=>{const b=document.getElementById("f-"+k);
    if(b){b.className=(k===f)?"chip on":"chip";}});
  searchRun();
}
function searchView(){
  app.innerHTML=topBack()+'<h2 style="margin-top:6px">Buscar</h2>'+
    '<p class="sub">Busca por palabra, significado o frase, en los dos idiomas. O filtra por estado para ver el tarjetero entero.</p>'+
    '<input type="search" id="q" placeholder="Escribe aquí…" autocapitalize="off" autocorrect="off" oninput="searchRun()">'+
    '<div class="chips">'+FILTROS.map(([k,t])=>'<button class="chip'+(k===sFiltro?" on":"")+'" id="f-'+k+'" onclick="setFiltro(\''+k+'\')">'+t+'</button>').join("")+'</div>'+
    '<div id="hits"></div>';
  searchRun();
}
function searchRun(){
  const box=document.getElementById("hits"); if(!box)return;
  const el=document.getElementById("q");
  const q=(el?el.value:"").trim().toLowerCase();
  const pasaFiltro=c=>sFiltro==="all"||(sFiltro==="travesia"?enTravesia(c):c.st===sFiltro);
  if(q.length<2&&sFiltro==="all"){
    box.innerHTML='<p class="hint" style="text-align:center;margin-top:18px">'+S.cards.length+' fichas en el tarjetero</p>';
    return;
  }
  const hits=S.cards.filter(c=>pasaFiltro(c)&&(q.length<2||(c.en+" "+c.es+" "+c.sense+" "+c.fen+" "+c.fes).toLowerCase().includes(q)));
  if(!hits.length){
    box.innerHTML='<div class="empty">Sin resultados.<br>Esa palabra todavía no está en el tarjetero.</div>';
    return;
  }
  let h='<p class="hint" style="margin:14px 0 4px">'+hits.length+(hits.length===1?' ficha':' fichas')+'</p>';
  hits.slice(0,40).forEach(c=>{
    h+='<div class="hitrow" onclick="showCard(\''+c.id+'\')"><b>'+esc(c.en)+'</b><span>'+esc(c.es)+'</span><i>'+(ST_LABEL[c.st]||"")+(c.assoc?" · 🧠":"")+'</i></div>';
  });
  if(hits.length>40)h+='<p class="hint" style="text-align:center">y '+(hits.length-40)+' más. Afina la búsqueda.</p>';
  box.innerHTML=h;
}
function showCard(id){
  const c=byId(id); if(!c)return;
  const seen=c.seen?'<span class="seen">'+c.seen+' 🏋️</span>':'';
  app.innerHTML='<button class="back" style="padding:10px 0 4px" onclick="searchView()">‹ Volver a buscar</button>'+
    '<div class="card">'+levelRow(c,null,seen)+
    '<div class="word">'+esc(c.en)+'</div><div class="ipa">'+esc(c.ipa)+'</div>'+
    '<div><span class="sense">'+esc(c.sense)+'</span>'+'</div>'+
    '<div class="phrase">'+esc(c.fen)+'</div>'+
    '<div class="divider"></div>'+
    '<div class="word" style="font-size:20px">'+esc(c.es)+'</div>'+
    '<div class="phrase es">'+esc(c.fes)+'</div>'+
    assocBlock(c)+
    '<button class="speak" style="margin-top:14px" onclick="speak(\''+esc(c.en).replace(/'/g,"\\'")+'. '+esc(c.fen).replace(/'/g,"\\'")+'\')">▶ Escuchar</button>'+
    '</div>'+backBtn();
}

/* ---------- PROGRESO ---------- */
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function bars(data,labels,stars){
  const W=480,H=140;
  const max=Math.max(1,...data.map(v=>Math.max(0,v)));
  const bw=W/data.length;
  const w=Math.min(bw-6,40);
  let s='<svg viewBox="0 0 '+W+' '+(H+26)+'" style="width:100%;display:block">';
  data.forEach((v,i)=>{
    const h=v>0?Math.max(3,Math.round(v/max*(H-34))):3;
    const x=i*bw+(bw-w)/2, y=H-h;
    s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3" fill="'+(v<0?"#C75B4E":"#C9A063")+'" opacity="'+(v?0.95:0.15)+'"/>';
    if(v)s+='<text x="'+(i*bw+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="11" fill="#EFE7D6">'+v+'</text>';
    if(stars[i])s+='<text x="'+(i*bw+bw/2)+'" y="'+(y-19)+'" text-anchor="middle" font-size="10" fill="#C9A063">'+"★".repeat(Math.min(stars[i],3))+(stars[i]>3?"+":"")+'</text>';
    s+='<text x="'+(i*bw+bw/2)+'" y="'+(H+18)+'" text-anchor="middle" font-size="10" fill="#7FA3C0">'+labels[i]+'</text>';
  });
  return s+'</svg>';
}
/* Actividad total: días usados frente a días transcurridos desde el primer uso */
function activity(){
  const keys=Object.keys(S.hist||{});
  if(!keys.length)return null;
  const first=keys.slice().sort()[0];
  const ini=new Date(first+"T12:00:00");
  const hoy=new Date(); hoy.setHours(12,0,0,0);
  const total=Math.max(1,Math.round((hoy-ini)/86400000)+1);
  const activos=keys.length;
  const [y,m,d]=first.split("-");
  return {activos,total,pct:Math.round(activos/total*100),
          desde:parseInt(d,10)+" "+MESES[parseInt(m,10)-1]+" "+y};
}
function progressView(tab){
  if(!S.hist)S.hist={};
  const done=S.cards.filter(c=>c.st==="done").length;
  const th=S.hist[today()]||{p:0,d:0};
  let chart,caption;
  if(tab==="d"){
    const data=[],labels=[],stars=[];
    for(let i=13;i>=0;i--){
      const k=addDays(-i);
      const h=S.hist[k]||{p:0,d:0};
      data.push(h.p);stars.push(h.d);
      labels.push(parseInt(k.slice(8),10));
    }
    chart=bars(data,labels,stars);
    caption="Puntos por día · últimos 14 días";
  }else if(tab==="w"){
    const data=[],labels=[],stars=[];
    const base=new Date();
    base.setDate(base.getDate()-((base.getDay()+6)%7)); // lunes de esta semana
    for(let j=7;j>=0;j--){
      const start=new Date(base);start.setDate(base.getDate()-j*7);
      let p=0,dn=0;
      for(let d=0;d<7;d++){
        const dd=new Date(start);dd.setDate(start.getDate()+d);
        const key=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
        const h=S.hist[key];if(h){p+=h.p;dn+=h.d;}
      }
      data.push(p);stars.push(dn);
      labels.push(start.getDate()+"/"+(start.getMonth()+1));
    }
    chart=bars(data,labels,stars);
    caption="Puntos por semana · últimas 8 semanas (lun–dom)";
  }else{
    const data=[],labels=[],stars=[];
    for(let j=5;j>=0;j--){
      const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-j);
      const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      let p=0,dn=0;
      Object.keys(S.hist).forEach(k=>{if(k.slice(0,7)===key){p+=S.hist[k].p;dn+=S.hist[k].d;}});
      data.push(p);stars.push(dn);
      labels.push(MESES[d.getMonth()]);
    }
    chart=bars(data,labels,stars);
    caption="Puntos por mes · últimos 6 meses";
  }
  const per=tab==="d"?"día":tab==="w"?"semana":"mes";
  app.innerHTML=`
  <h2>Progreso</h2>
  <div class="stats">
    <div class="stat"><b style="color:var(--brass)">${th.p}</b><span>Puntos hoy</span></div>
    <div class="stat"><b style="color:var(--brass)">${done}</b><span>Dominadas</span></div>
    <div class="stat"><b>${S.streak}</b><span>Racha días</span></div>
  </div>
  <div class="row" style="margin-bottom:12px">
    <button class="${tab==="d"?"primary":"ghost"}" style="flex:1" onclick="progressView('d')">Diario</button>
    <button class="${tab==="w"?"primary":"ghost"}" style="flex:1" onclick="progressView('w')">Semanal</button>
    <button class="${tab==="m"?"primary":"ghost"}" style="flex:1" onclick="progressView('m')">Mensual</button>
  </div>
  <div class="card">
    <p class="lvltxt" style="margin-bottom:12px">${caption}</p>
    ${chart}
    <p class="hint">★ = dominadas ese ${per} · Puntos: palabra 1 / 3 / 10 · expresión larga (4+ palabras) 2 / 6 / 20</p>
  </div>
  <h2>Actividad</h2>
  ${(()=>{const a=activity();
    if(!a)return '<p class="sub">Aún sin datos. Empieza a estudiar y aquí verás tu constancia.</p>';
    return `<div class="card">
      <div class="actrow"><b>${a.pct}%</b><span class="lvltxt">${a.activos} de ${a.total} días</span></div>
      <div class="barwrap"><i style="width:${a.pct}%"></i></div>
      <p class="hint">Días con estudio desde que empezaste, el ${a.desde}.</p>
    </div>`;})()}
  ${(()=>{const d=S.cards.filter(c=>c.seen>0).sort((a,b)=>b.seen-a.seen).slice(0,8);
    if(!d.length)return "";
    return '<h2>Las que más cuestan</h2><p class="sub">Repeticiones acumuladas en entrenamiento.</p>'+
      d.map(c=>'<div class="hitrow" onclick="showCard(\''+c.id+'\')"><b>'+esc(c.en)+'</b><span>'+esc(c.es)+'</span><i>'+c.seen+' 🏋️</i></div>').join("");})()}
  <h2>En travesía</h2>
  <p class="sub">Fichas esperando su comprobación. No se pueden repasar antes de tiempo.</p>
  <div class="pipeline" style="margin-top:12px"><span>1 día <b>${S.cards.filter(c=>c.st==="d1"||c.st==="d2").length}</b></span><span>1 semana <b>${S.cards.filter(c=>c.st==="w1"||c.st==="w2").length}</b></span><span>1 mes <b>${S.cards.filter(c=>c.st==="m1"||c.st==="m2").length}</b></span><span>retención <b>${S.cards.filter(c=>c.st==="done"&&c.due).length}</b></span></div>`+backBtn();
}

/* ---------- PALABRAS DEL DÍA (favoritas) ----------
   Las tres que se eligen cada mañana en la lista HOARI para repasarlas durante
   el día. Se marcan con ★, se quedan arriba del todo y salen resaltadas, para
   poder recordar cuáles eran sin tener que apuntarlas aparte.
   No se borran solas al cambiar el día: eso machacaría la selección a mitad de
   una sesión de madrugada. Se quitan a mano, con el botón de la barra. */
const FAV_OBJETIVO=3;
const favCount=()=>S.cards.filter(c=>c.st==="learning"&&c.fav).length;
const favBtn=c=>'<button class="favbtn'+(c.fav?' on':'')+'" onclick="toggleFav(\''+c.id+
  '\',event)" aria-pressed="'+(c.fav?'true':'false')+'" aria-label="'+
  (c.fav?'Quitar de las palabras del día':'Marcar como palabra del día')+'">'+
  (c.fav?'★':'☆')+'</button>';
function toggleFav(id,ev){
  if(ev){ev.stopPropagation();ev.preventDefault();}
  const c=byId(id);if(!c)return;
  c.fav=!c.fav;
  if(c.fav)c.favDay=today();else delete c.favDay;
  save();
  const n=favCount();
  if(c.fav)toast(n<=FAV_OBJETIVO?"★ Palabra del día ("+n+" de "+FAV_OBJETIVO+")":"★ Ya llevas "+n+", más de las "+FAV_OBJETIVO+" de costumbre");
  else toast("Fuera de las del día");
  learningList();
  if(c.fav)window.scrollTo(0,0);
}
function clearFav(){
  S.cards.forEach(c=>{if(c.fav){c.fav=false;delete c.favDay;}});
  save();toast("Lista del día vacía");learningList();
}
/* Si las marcadas son de otro día, se avisa en vez de borrarlas por sorpresa. */
function favStaleLabel(){
  const d=S.cards.filter(c=>c.st==="learning"&&c.fav).map(c=>c.favDay).filter(Boolean);
  if(!d.length)return"";
  const hoy=today(),viejo=d.filter(x=>x!==hoy).sort()[0];
  if(!viejo)return"";
  const p=viejo.split("-");
  return'elegidas el '+p[2]+'/'+p[1];
}

/* ---------- APRENDIENDO ---------- */
function learningList(){
  /* Las del día primero. sort() es estable, así que el resto no se descoloca. */
  const list=S.cards.filter(c=>c.st==="learning").sort((a,b)=>(b.fav?1:0)-(a.fav?1:0));
  let h=topBack()+'<h2 style="margin-top:6px">Aprendiendo</h2><p class="sub">Estudia estas fichas. Cuando tengas una memorizada, márcala y dentro de dos días te la preguntaré de inglés a español.<br>Marca con ★ las '+FAV_OBJETIVO+' palabras del día: se quedan arriba y resaltadas.</p>';
  const nf=favCount();
  if(nf){
    const st=favStaleLabel();
    h+='<div class="favbar"><b>★ '+nf+' '+(nf===1?"palabra":"palabras")+' del día</b>'+
       (st?'<i>'+st+'</i>':'')+'<button onclick="clearFav()">Quitar todas</button></div>';
  }
  if(list.length>1)h+='<div class="menu" style="margin-top:14px"><button class="primary" onclick="trainStart()">🎯 Entrenar estas '+list.length+' fichas</button></div>';
  else h+='<br>';
  if(!list.length)h+='<div class="empty">No hay fichas en estudio.<br>Añade palabras nuevas al cuaderno.</div>';
  list.forEach(c=>{
    const seen=c.seen?'<span class="seen">'+c.seen+' 🏋️</span>':'';
    h+=`<div class="card${c.fav?" fav":""}">${levelRow(c,null,'<span class="rgt">'+seen+favBtn(c)+'</span>')}
      <div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div>
      <div><span class="sense">${esc(c.sense)}</span></div>
      <div class="phrase">${esc(c.fen)}</div>
      <div class="divider"></div>
      <div class="word" style="font-size:20px">${esc(c.es)}</div>
      <div class="phrase es">${esc(c.fes)}</div>
      ${assocBlock(c)}
      <div class="row" style="margin-top:14px">
        <button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>
        <button class="ghost" style="flex:1" id="k-${c.id}" onclick="known('${c.id}')">Ya me la sé</button>
      </div>
    </div>`;
  });
  app.innerHTML=h+backBtn();
}
function known(id){
  const b=document.getElementById("k-"+id);
  if(b.dataset.c){
    const c=byId(id);
    c.st="d1";c.due=addDays(2);
    /* Al salir de Aprendiendo deja de ser palabra del día: la ★ no pinta nada
       fuera de esta lista y, si la ficha volviera, arrastraría una marca vieja. */
    if(c.fav){c.fav=false;delete c.favDay;}
    touchStreak();save();
    toast("Te la pregunto en dos días");
    learningList();
  }else{
    b.dataset.c="1";b.textContent="¿Seguro? Te la pregunto en dos días";
    b.style.borderColor="var(--brass)";b.style.color="var(--brass)";
  }
}

/* ---------- ENTRENAMIENTO (práctica libre, sin puntos) ---------- */
let tPool=[],tDir="en";
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function trainStart(){
  /* El orden sigue siendo aleatorio, pero las palabras del día van delante. */
  const L=S.cards.filter(c=>c.st==="learning");
  tPool=shuffle(L.filter(c=>c.fav).map(c=>c.id))
    .concat(shuffle(L.filter(c=>!c.fav).map(c=>c.id)));
  if(!tPool.length){app.innerHTML='<div class="empty">No hay fichas en estudio.</div>'+backBtn();return;}
  trainCard();
}
function trainCard(){
  if(!tPool.length){
    app.innerHTML='<div class="empty">Vuelta completada.<br>Sigue con las que aún se resisten o vuelve al cuaderno.</div>'+
      '<div class="menu"><button class="primary" onclick="trainStart()">Otra vuelta</button></div>'+
      '<button class="back" onclick="learningList()">‹ Volver a Aprendiendo</button>';
    return;
  }
  const c=byId(tPool[0]);
  tDir=Math.random()<0.5?"en":"es";
  const front=tDir==="en"
    ?`<div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div><div class="phrase">${esc(c.fen)}</div>`
    :`<div class="word">${esc(c.es)}</div><div><span class="sense">${esc(c.sense)}</span></div><div class="phrase es">${esc(c.fes)}</div>`;
  app.innerHTML=`
  <div class="progress">Entrenamiento · ${tPool.length} en cola</div>
  <div class="card${c.fav?" fav":""}">
    <div class="levelrow"><span class="lvltxt">${c.fav?"★ ":""}${tDir==="en"?"EN → ES":"ES → EN"}</span>${c.seen?'<span class="seen">'+c.seen+' 🏋️</span>':''}</div>
    ${front}
    <div id="tans" class="hidden"></div>
  </div>
  <div id="tctrl"><button class="primary" onclick="trainReveal()">Mostrar traducción</button></div>
  <button class="back" onclick="learningList()">✕ Terminar entrenamiento</button>`;
}
function trainReveal(){
  const c=byId(tPool[0]);
  c.seen=(c.seen||0)+1;          // la repetición se cuenta aquí, al mostrar
  touchStreak();save();
  const back=tDir==="en"
    ?`<div class="divider"></div><div class="word">${esc(c.es)}</div><div><span class="sense">${esc(c.sense)}</span></div><div class="phrase es">${esc(c.fes)}</div>${assocBlock(c)}`
    :`<div class="divider"></div><div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div><div class="phrase">${esc(c.fen)}</div><button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>${assocBlock(c)}`;
  const t=document.getElementById("tans");t.innerHTML=back;t.classList.remove("hidden");
  document.getElementById("tctrl").innerHTML=`
    <div class="row">
      <button class="ghost" style="flex:1" onclick="trainNext()">↻ Repasar más</button>
      <button class="okbtn" onclick="trainGot()">✓ Aprendida</button>
    </div>`;
}
function trainNext(){
  const c=byId(tPool.shift());
  tPool.push(c.id); // vuelve al final de la cola
  trainCard();
}
function trainGot(){
  const c=byId(tPool.shift());
  c.st="d1";c.due=addDays(2);
  touchStreak();save();
  toast("Aprendida · te la pregunto en dos días");
  trainCard();
}

/* ---------- NUEVAS ---------- */
function newCards(){
  const p=S.cards.filter(c=>c.st==="pending");
  if(!p.length){
    app.innerHTML='<div class="empty">No quedan palabras pendientes.<br>Pídeme una tanda nueva y la importas en Datos.</div>'+backBtn();
    return;
  }
  const c=p[0];
  app.innerHTML=`
  <h2>Palabra nueva</h2><p class="sub">${p.length} pendientes en la base</p><br>
  <div class="card">
    <div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div>
    <div><span class="sense">${esc(c.sense)}</span></div>
    <div class="phrase">${esc(c.fen)}</div>
    <div class="divider"></div>
    <div class="word" style="font-size:20px">${esc(c.es)}</div>
    <div class="phrase es">${esc(c.fes)}</div>
    <button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>${assocBlock(c)}
  </div>
  <div class="menu">
    <button class="primary" onclick="startLearn('${c.id}')">Empezar a estudiarla</button>
    <button class="ghost" onclick="skipCard('${c.id}')">Más tarde</button>
  </div>`+backBtn();
}
function startLearn(id){
  const c=byId(id);c.st="learning";
  touchStreak();save();toast("Al cuaderno de Aprendiendo");newCards();
}
function skipCard(id){
  const i=S.cards.findIndex(c=>c.id===id);
  const [c]=S.cards.splice(i,1);S.cards.push(c);
  save();newCards();
}

/* ---------- DATOS ---------- */
function dataView(){
  const done=S.cards.filter(c=>c.st==="done").length;
  const inplay=S.cards.filter(c=>["learning","d1","d2","w1","w2","m1","m2"].includes(c.st)).length;
  const nexpr=S.cards.filter(isMulti).length;
  app.innerHTML=`
  <h2>Datos</h2>
  <div class="card">
    <p class="sub">Fichas totales: <b style="color:var(--ivory)">${S.cards.length}</b> · En juego: <b style="color:var(--ivory)">${inplay}</b> · Dominadas: <b style="color:var(--brass)">${done}</b> · Puntos: <b style="color:var(--brass)">${S.pts}</b></p>
    <p class="sub" style="margin-top:6px">Palabras sueltas: <b style="color:var(--ivory)">${S.cards.length-nexpr}</b> · Expresiones: <b style="color:var(--ivory)">${nexpr}</b></p>
  </div>
  <div class="menu"><button class="big" onclick="masteredList()"><span>Ver dominadas</span><span class="n">${done}</span></button></div>
  <h2>Copia de seguridad</h2>
  <p class="sub">Descarga o copia el archivo completo (fichas + progreso). Guárdalo y compártemelo en el chat para seguimiento.</p>
  <div class="menu" style="margin-top:10px">
    <button class="primary" onclick="exportData()">Descargar copia</button>
    <button class="ghost" onclick="copyData()">Copiar al portapapeles</button>
  </div>
  <h2>Importar</h2>
  <p class="sub">Pega aquí una tanda nueva de fichas (te las genero yo) o una copia de seguridad completa.</p>
  <textarea id="imp" placeholder='[{"id":"...","en":"...","es":"...","sense":"...","ipa":"...","fen":"...","fes":"..."}]'></textarea>
  <div class="menu">
    <button class="primary" onclick="importBatch()">Añadir tanda nueva</button>
    <button class="ghost" onclick="restoreBackup()">Restaurar copia completa</button>
  </div>
  <h2>Historial de estudio</h2>
  <p class="sub">Si estudiaste un día y no quedó registrado (sin conexión, en papel o solo entrenando), márcalo aquí para que cuente en la racha.</p>
  <input type="date" id="fixday" max="${today()}" value="${today()}">
  <div class="menu">
    <button class="primary" onclick="markDay()">Marcar ese día como estudiado</button>
  </div>
  <p class="hint">Racha actual: <b style="color:var(--brass)">${streakCount()}</b> días · Días registrados: ${Object.keys(S.hist||{}).length}</p>`+backBtn();
}
function masteredList(){
  const list=S.cards.filter(c=>c.st==="done");
  let h=topBack()+'<h2 style="margin-top:6px">Dominadas</h2><p class="sub">Tu botín. Estas ya son tuyas.</p><br>';
  if(!list.length)h+='<div class="empty">Aún ninguna.<br>La primera cae en unos 75 días de trabajo constante.</div>';
  list.forEach(c=>{
    h+=`<div class="card">${levelRow(c)}
      <div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div>
      <div><span class="sense">${esc(c.sense)}</span></div>
      <div class="phrase">${esc(c.fen)}</div>
      <div class="divider"></div>
      <div class="word" style="font-size:20px">${esc(c.es)}</div>
      <div class="phrase es">${esc(c.fes)}</div>
      <button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>${assocBlock(c)}
    </div>`;
  });
  app.innerHTML=h+backBtn();
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="tavi-"+today()+".json";
  a.click();
}
function copyData(){
  navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast("Copiado")).catch(()=>toast("No se pudo copiar"));
}
function importBatch(){
  try{
    let data=JSON.parse(document.getElementById("imp").value.trim());
    if(!Array.isArray(data))data=data.cards;
    if(!Array.isArray(data))throw 0;
    let added=0,upd=0;
    data.forEach(c=>{
      if(!c.id)return;
      const ex=byId(c.id);
      if(!ex&&c.en&&c.es){
        S.cards.push({id:c.id,en:c.en,es:c.es,sense:c.sense||"",ipa:c.ipa||"",fen:c.fen||"",fes:c.fes||"",assoc:c.assoc||null,st:"pending",due:null,seen:0,earned:0,locked:0});
        added++;
      }else if(ex&&c.assoc){
        ex.assoc=c.assoc;upd++;
      }
    });
    save();
    toast(added+" añadidas · "+upd+" asociaciones");dataView();
  }catch(e){toast("Formato no válido");}
}
function restoreBackup(){
  try{
    const data=JSON.parse(document.getElementById("imp").value.trim());
    if(!data.cards||!Array.isArray(data.cards))throw 0;
    if(!confirm("Esto sustituye TODO el progreso actual por el de la copia. ¿Continuar?"))return;
    S=data;save();syncSeed();toast("Copia restaurada");home();
  }catch(e){toast("Formato no válido");}
}

function markDay(){
  const v=document.getElementById("fixday").value;
  if(!v){toast("Elige una fecha");return;}
  if(v>today()){toast("No se puede marcar un día futuro");return;}
  if(!S.hist)S.hist={};
  if(S.hist[v]){toast("Ese día ya estaba registrado");return;}
  S.hist[v]={p:0,d:0};
  S.streak=streakCount();
  save();
  toast("Día registrado · racha "+S.streak);
  dataView();
}
const backBtn=()=>'<button class="back" onclick="home()">‹ Volver al panel</button>';
const topBack=(fn)=>'<button class="back" style="padding:10px 0 4px" onclick="'+(fn||"home()")+'">‹ Volver al panel</button>';

/* ================= ARRANQUE ================= */
load();
home();
/* Si la migración ha movido el marcador, se dice con su cifra y no se repite. */
if(S.avisoDoble){
  const n=S.avisoDoble; delete S.avisoDoble; save();
  setTimeout(function(){
    toast((n<0?n:"+"+n)+" puntos: las expresiones ya no valen el doble");
  },700);
}

/* Service worker: guarda la app en el móvil para uso sin conexión.
   Si se abre el archivo suelto (sin servidor) falla en silencio y no pasa nada. */
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      reg.update();
      setInterval(function(){reg.update();},60*60*1000);
    }).catch(function(){});
  });
  var swReloaded=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(swReloaded)return;
    swReloaded=true;
    location.reload();
  });
  document.addEventListener("visibilitychange",function(){
    if(!document.hidden&&navigator.serviceWorker.getRegistration){
      navigator.serviceWorker.getRegistration().then(function(reg){if(reg)reg.update();}).catch(function(){});
    }
  });
}
</script>
</body>
</html>
