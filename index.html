<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0C1B2A">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Bitácora SLP</title>
<style>
:root{
  --ink:#0C1B2A;        /* azul carta náutica, fondo */
  --panel:#13283C;      /* paneles */
  --line:#24405A;       /* líneas y bordes */
  --ivory:#EFE7D6;      /* texto principal */
  --faded:#7FA3C0;      /* texto secundario */
  --brass:#C9A063;      /* latón: acento e instrumento */
  --ok:#4CAF7D;         /* verde señal */
  --bad:#C75B4E;        /* rojo señal */
  --disp:Futura,'Avenir Next Condensed','Trebuchet MS',sans-serif;
  --body:'Avenir Next',Avenir,-apple-system,'Segoe UI',sans-serif;
  --serif:Georgia,'Times New Roman',serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--ink)}
body{
  font-family:var(--body);color:var(--ivory);background:var(--ink);
  background-image:radial-gradient(1200px 600px at 50% -200px,#16304a 0%,var(--ink) 70%);
  min-height:100vh;padding:env(safe-area-inset-top) 0 40px;
}
.wrap{max-width:520px;margin:0 auto;padding:0 16px}
header{padding:18px 0 10px;text-align:center;border-bottom:1px solid var(--line)}
.brand{font-family:var(--disp);letter-spacing:.32em;font-size:13px;color:var(--brass);text-transform:uppercase}
.brand small{display:block;letter-spacing:.18em;color:var(--faded);font-size:10px;margin-top:4px}
h2{font-family:var(--disp);font-weight:500;letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--brass);margin:22px 0 12px}
.sub{color:var(--faded);font-size:14px;line-height:1.5}

/* ---------- instrumento de puntos ---------- */
.gauge{display:flex;justify-content:center;margin:24px 0 8px}
.dial{position:relative;width:190px;height:190px}
.dial svg{position:absolute;inset:0}
.dial .num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .num b{font-family:var(--disp);font-weight:600;font-size:52px;letter-spacing:.02em;color:var(--ivory)}
.dial .num span{font-family:var(--disp);font-size:10px;letter-spacing:.3em;color:var(--brass);text-transform:uppercase;margin-top:2px}
.stats{display:flex;gap:10px;margin:14px 0 20px}
.stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.stat b{display:block;font-family:var(--disp);font-size:22px;font-weight:600}
.stat span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--faded)}

/* ---------- botones ---------- */
.menu{display:flex;flex-direction:column;gap:10px;margin-bottom:24px}
button{font-family:var(--body);cursor:pointer;border:none;border-radius:14px;font-size:16px;touch-action:manipulation;-webkit-user-select:none;user-select:none}
.big{display:flex;justify-content:space-between;align-items:center;width:100%;
  background:var(--panel);border:1px solid var(--line);color:var(--ivory);
  padding:16px 18px;min-height:56px;text-align:left}
.big .n{font-family:var(--disp);color:var(--brass);font-size:18px;font-weight:600}
.big:active{background:#1a3350}
.primary{background:var(--brass);color:#20180b;font-weight:600;padding:15px;width:100%;min-height:52px}
.ghost{background:transparent;border:1px solid var(--line);color:var(--faded);padding:13px;width:100%;min-height:48px}
.okbtn{background:var(--ok);color:#0b2416;font-weight:600;padding:15px;flex:1;min-height:52px}
.badbtn{background:var(--bad);color:#2b0f0b;font-weight:600;padding:15px;flex:1;min-height:52px}
.row{display:flex;gap:10px}
.back{background:none;color:var(--faded);font-size:14px;padding:14px 0;letter-spacing:.1em;text-transform:uppercase;font-family:var(--disp)}

/* ---------- fichas ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;margin-bottom:14px}
.levelrow{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.chev{display:flex;gap:3px}
.chev i{width:14px;height:8px;background:var(--line);display:block;transform:skewX(-18deg);border-radius:2px}
.chev i.on{background:var(--brass)}
.chev i.star{width:10px;height:10px;transform:none;border-radius:50%}
.lvltxt{font-family:var(--disp);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--faded)}
.dirpill{margin-left:auto;font-family:var(--disp);font-size:10px;letter-spacing:.14em;color:var(--ink);
  background:var(--faded);border-radius:20px;padding:3px 9px}
.word{font-size:27px;font-weight:600;line-height:1.2}
.ipa{font-family:var(--serif);color:var(--brass);font-size:17px;margin-top:2px}
.sense{display:inline-block;font-size:12px;color:var(--faded);border:1px solid var(--line);border-radius:20px;padding:2px 10px;margin-top:8px}
.phrase{font-family:var(--serif);font-size:17px;line-height:1.5;margin-top:12px}
.phrase.es{color:var(--faded)}
.speak{background:transparent;border:1px solid var(--brass);color:var(--brass);border-radius:24px;
  padding:7px 16px;font-size:14px;margin-top:12px}
.divider{border-top:1px dashed var(--line);margin:16px 0}
.progress{font-family:var(--disp);font-size:11px;letter-spacing:.2em;color:var(--faded);text-transform:uppercase;text-align:center;margin:14px 0}
.hint{font-size:13px;color:var(--faded);margin-top:8px;line-height:1.5}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--brass);color:#20180b;
  font-weight:600;border-radius:24px;padding:10px 22px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
textarea{width:100%;min-height:110px;background:var(--ink);border:1px solid var(--line);border-radius:12px;
  color:var(--ivory);font-family:Menlo,monospace;font-size:12px;padding:10px;margin:8px 0}
.hidden{display:none}
.assocbtn{background:transparent;border:1px dashed var(--brass);color:var(--brass);border-radius:24px;
  padding:8px 16px;font-size:14px;margin-top:12px;width:100%}
.assoc{margin-top:12px;background:#0e2033;border:1px solid var(--line);border-left:3px solid var(--brass);
  border-radius:0 12px 12px 0;padding:14px 16px}
.amn{margin:0 0 12px;font-family:var(--serif);font-size:15px;line-height:1.55;color:var(--ivory)}
.amn:last-child{margin-bottom:0}
.amn span{display:block;font-family:var(--disp);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--brass);margin-bottom:3px}
.seen{font-family:var(--disp);font-size:10px;letter-spacing:.1em;color:var(--faded);margin-left:auto;text-transform:uppercase}
.tcount{text-align:center;font-family:var(--disp);font-size:11px;letter-spacing:.14em;color:var(--faded);text-transform:uppercase;margin-top:14px}
.empty{text-align:center;color:var(--faded);padding:40px 10px;font-family:var(--serif);font-style:italic;font-size:16px;line-height:1.6}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

/* ================= ESTADO ================= */
const KEY="bitacora-slp-v1";
const VERSION="1.4";
let S;
const isExpr=c=>c.en.trim().includes(" ");
function migrate(){
  S.cards.forEach(c=>{if(c.seen==null)c.seen=0;});
  SEED.forEach(s=>{
    if(s.assoc){const c=S.cards.find(x=>x.id===s.id);if(c&&!c.assoc)c.assoc=s.assoc;}
  });
}
function logDay(p,d){
  if(!S.hist)S.hist={};
  const t=today();
  const h=S.hist[t]||(S.hist[t]={p:0,d:0});
  h.p+=p;h.d+=d;
}
function syncSeed(){
  let added=0;
  SEED.forEach(c=>{
    if(!S.cards.find(x=>x.id===c.id)){S.cards.push({...c,st:"pending",due:null,seen:0});added++;}
  });
  if(!S.hist)S.hist={};
  migrate();
  save();
  return added;
}
function load(){
  try{
    const raw=localStorage.getItem(KEY);
    if(raw){S=JSON.parse(raw);syncSeed();return;}
  }catch(e){}
  S={cards:SEED.map(c=>({...c,st:"pending",due:null,seen:0})),pts:0,streak:0,last:null,hist:{}};
  save();
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){toast("No se pudo guardar (¿modo privado?)");}
}
function today(){
  const d=new Date();
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function addDays(n){
  const d=new Date();d.setDate(d.getDate()+n);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function touchStreak(){
  const t=today();
  if(S.last===t)return;
  const y=new Date();y.setDate(y.getDate()-1);
  const yd=y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0");
  S.streak=(S.last===yd)?S.streak+1:1;
  S.last=t;
}
const dueCards=()=>S.cards.filter(c=>LV[c.st]&&c.due&&c.due<=today());
const byId=id=>S.cards.find(c=>c.id===id);

/* ================= AUDIO ================= */
let VOICE=null;
function pickVoice(){
  const vs=speechSynthesis.getVoices();
  VOICE=vs.find(v=>v.lang==="en-GB")||vs.find(v=>v.lang.startsWith("en-"))||vs.find(v=>v.lang.startsWith("en"))||null;
}
if("speechSynthesis" in window){
  pickVoice();
  speechSynthesis.onvoiceschanged=pickVoice;
}
function speak(txt){
  if(!("speechSynthesis" in window)){toast("Audio no disponible");return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(txt);
  u.lang=VOICE?VOICE.lang:"en-GB";
  if(VOICE)u.voice=VOICE;
  u.rate=0.92;
  speechSynthesis.speak(u);
}

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;");
const XB='<span class="sense" style="color:var(--brass);border-color:var(--brass);margin-left:4px">expresión ×2</span>';
function assocBlock(c){

function toggleAssoc(id,btn){
  const e=document.getElementById(id);

function toast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg;t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"),1700);
}
function chevrons(n,star){
  let h='<div class="chev">';
  for(let i=1;i<=4;i++)h+='<i class="'+(i<=n?"on":"")+'"></i>';
  h+='<i class="star '+(star?"on":"")+'"></i></div>';

}
function levelRow(c,pill){
  const st=c.st;
  let n=0,star=false,txt="";
  if(st==="learning"){n=1;txt="Aprendiendo";}
  else if(LV[st]){n=LV[st].chev;txt=LV[st].label;}
  else if(st==="done"){n=4;star=true;txt="Dominada";}
  const p=pill?'<span class="dirpill">'+pill+'</span>':'';
  return '<div class="levelrow">'+chevrons(n,star)+'<span class="lvltxt">'+txt+'</span>'+p+'</div>';
}

/* ---------- REPASO ---------- */
let queue=[],qTotal=0,sesOk=0,sesKo=0;
function review(){
  const due=dueCards();
  for(let i=due.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[due[i],due[j]]=[due[j],due[i]];}
  queue=due.map(c=>c.id);
  qTotal=queue.length;sesOk=0;sesKo=0;
  if(!qTotal){
    app.innerHTML='<div class="empty">Sin repasos pendientes.<br>El cuaderno está al día: vuelve mañana.</div>'+backBtn();
    return;
  }
  question();
}
function question(){
  if(!queue.length){
    app.innerHTML='<div class="empty">Repaso de hoy completado.<br>'+sesOk+' aciertos · '+sesKo+' fallos.<br>Buen rumbo.</div>'+backBtn();
    return;
  }
  const c=byId(queue[0]);
  const dir=LV[c.st].dir;
  const pill=dir==="en"?"EN → ES":"ES → EN";
  let front;
  if(dir==="en"){
    front=`<div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div>
      <div class="phrase">${esc(c.fen)}</div>
      <button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>`;
  }else{
    front=`<div class="word">${esc(c.es)}</div><div><span class="sense">${esc(c.sense)}</span>${isExpr(c)?XB:""}</div>
      <div class="phrase es">${esc(c.fes)}</div>`;
  }
  app.innerHTML=`
  <div class="progress">${qTotal-queue.length+1} de ${qTotal}</div>
  <div class="card">
    ${levelRow(c,pill)}
    ${front}
    <div id="answer" class="hidden"></div>
  </div>
  <div id="controls">
    <button class="primary" onclick="reveal()">Mostrar respuesta</button>
  </div>`;
}
function reveal(){
  const c=byId(queue[0]);
  const dir=LV[c.st].dir;
  const ans=document.getElementById("answer");
  if(dir==="en"){
    ans.innerHTML=`<div class="divider"></div>
      <div class="word">${esc(c.es)}</div><div><span class="sense">${esc(c.sense)}</span>${isExpr(c)?XB:""}</div>
      <div class="phrase es">${esc(c.fes)}</div>${assocBlock(c)}`;
  }else{
    ans.innerHTML=`<div class="divider"></div>
      <div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div>
      <div class="phrase">${esc(c.fen)}</div>
      <button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>${assocBlock(c)}`;
  }
  ans.classList.remove("hidden");
  document.getElementById("controls").innerHTML=`
    <div class="row">
      <button class="badbtn" onclick="fail()">✗ No la sabía</button>
      <button class="okbtn" onclick="pass()">✓ La sabía</button>
    </div>`;
}
function pass(){
  const c=byId(queue.shift());
  const lv=LV[c.st];
  const gained=lv.pts*(isExpr(c)?2:1);
  touchStreak();sesOk++;
  if(lv.next==="done"){
    c.st="done";c.due=null;
  }else{
    c.st=lv.next;c.due=addDays(lv.gap);
  }
  if(gained>0)S.pts+=gained;
  logDay(gained,c.st==="done"?1:0);
  save();
  if(c.st==="done")toast("★ Dominada · +"+gained+" puntos");
  else if(gained>0)toast("+"+gained+(gained===1?" punto":" puntos")+" · siguiente en "+lv.gap+" días");
  else toast("✓ Siguiente comprobación en "+lv.gap+" días");
  question();
}
function fail(){
  const c=byId(queue[0]);
  const lv=LV[c.st];
  let opts=`<button class="ghost" onclick="keepLevel()">Mantener en ${lv.label.split(" ·")[0]} · repito en ${lv.keep===1?"1 día":lv.keep+" días"}</button>`;
  DEMOTES[c.st].forEach(([st,name])=>{
    opts+=`<button class="ghost" onclick="demote('${st}')">Bajar a ${name}</button>`;
  });
  document.getElementById("controls").innerHTML=
    '<p class="hint" style="text-align:center;margin-bottom:10px">Sin puntos. ¿Qué hacemos con ella?</p>'+
    '<div class="menu">'+opts+'</div>';
}
function keepLevel(){
  const c=byId(queue.shift());
  c.due=addDays(LV[c.st].keep);
  touchStreak();sesKo++;save();question();
}
function demote(st){
  const c=byId(queue.shift());
  c.st=st;
  c.due=st==="learning"?null:addDays(st==="d1"?1:7);
  touchStreak();sesKo++;save();question();
}

/* ---------- PROGRESO ---------- */
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];
function bars(data,labels,stars){
  const W=480,H=140;
  const max=Math.max(1,...data);
  const bw=W/data.length;
  const w=Math.min(bw-6,40);
  let s='<svg viewBox="0 0 '+W+' '+(H+26)+'" style="width:100%;display:block">';
  data.forEach((v,i)=>{
    const h=v?Math.max(3,Math.round(v/max*(H-34))):3;
    const x=i*bw+(bw-w)/2, y=H-h;
    s+='<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+h+'" rx="3" fill="#C9A063" opacity="'+(v?0.95:0.15)+'"/>';
    if(v)s+='<text x="'+(i*bw+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" font-size="11" fill="#EFE7D6">'+v+'</text>';
    if(stars[i])s+='<text x="'+(i*bw+bw/2)+'" y="'+(y-19)+'" text-anchor="middle" font-size="10" fill="#C9A063">'+"★".repeat(Math.min(stars[i],3))+(stars[i]>3?"+":"")+'</text>';
    s+='<text x="'+(i*bw+bw/2)+'" y="'+(H+18)+'" text-anchor="middle" font-size="10" fill="#7FA3C0">'+labels[i]+'</text>';
  });
  return s+'</svg>';
}
function progressView(tab){
  if(!S.hist)S.hist={};
  const done=S.cards.filter(c=>c.st==="done").length;
  const th=S.hist[today()]||{p:0,d:0};
  let chart,caption;
  if(tab==="d"){
    const data=[],labels=[],stars=[];
    for(let i=13;i>=0;i--){
      const k=addDays(-i);
      const h=S.hist[k]||{p:0,d:0};
      data.push(h.p);stars.push(h.d);
      labels.push(parseInt(k.slice(8),10));
    }
    chart=bars(data,labels,stars);
    caption="Puntos por día · últimos 14 días";
  }else if(tab==="w"){
    const data=[],labels=[],stars=[];
    const base=new Date();
    base.setDate(base.getDate()-((base.getDay()+6)%7)); // lunes de esta semana
    for(let j=7;j>=0;j--){
      const start=new Date(base);start.setDate(base.getDate()-j*7);
      let p=0,dn=0;
      for(let d=0;d<7;d++){
        const dd=new Date(start);dd.setDate(start.getDate()+d);
        const key=dd.getFullYear()+"-"+String(dd.getMonth()+1).padStart(2,"0")+"-"+String(dd.getDate()).padStart(2,"0");
        const h=S.hist[key];if(h){p+=h.p;dn+=h.d;}
      }
      data.push(p);stars.push(dn);
      labels.push(start.getDate()+"/"+(start.getMonth()+1));
    }
    chart=bars(data,labels,stars);
    caption="Puntos por semana · últimas 8 semanas (lun–dom)";
  }else{
    const data=[],labels=[],stars=[];
    for(let j=5;j>=0;j--){
      const d=new Date();d.setDate(1);d.setMonth(d.getMonth()-j);
      const key=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
      let p=0,dn=0;
      Object.keys(S.hist).forEach(k=>{if(k.slice(0,7)===key){p+=S.hist[k].p;dn+=S.hist[k].d;}});
      data.push(p);stars.push(dn);
      labels.push(MESES[d.getMonth()]);
    }
    chart=bars(data,labels,stars);
    caption="Puntos por mes · últimos 6 meses";
  }
  const per=tab==="d"?"día":tab==="w"?"semana":"mes";
  app.innerHTML=`
  <h2>Progreso</h2>
  <div class="stats">
    <div class="stat"><b style="color:var(--brass)">${th.p}</b><span>Puntos hoy</span></div>
    <div class="stat"><b style="color:var(--brass)">${done}</b><span>Dominadas</span></div>
    <div class="stat"><b>${S.streak}</b><span>Racha días</span></div>
  </div>
  <div class="row" style="margin-bottom:12px">
    <button class="${tab==="d"?"primary":"ghost"}" style="flex:1" onclick="progressView('d')">Diario</button>
    <button class="${tab==="w"?"primary":"ghost"}" style="flex:1" onclick="progressView('w')">Semanal</button>
    <button class="${tab==="m"?"primary":"ghost"}" style="flex:1" onclick="progressView('m')">Mensual</button>
  </div>
  <div class="card">
    <p class="lvltxt" style="margin-bottom:12px">${caption}</p>
    ${chart}
    <p class="hint">★ = dominadas ese ${per} · Puntos: palabra 1 / 3 / 10 · expresión 2 / 6 / 20</p>
  </div>`+backBtn();
}

/* ---------- ENTRENAMIENTO (práctica libre, sin puntos) ---------- */
let tPool=[],tDir="en";
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function trainStart(){
  tPool=shuffle(S.cards.filter(c=>c.st==="learning").map(c=>c.id));
  if(!tPool.length){app.innerHTML='<div class="empty">No hay fichas en estudio.</div>'+backBtn();return;}
  trainCard();
}
function trainCard(){
  if(!tPool.length){
    app.innerHTML='<div class="empty">Vuelta completada.<br>Sigue con las que aún se resisten o vuelve al cuaderno.</div>'+
      '<div class="menu"><button class="primary" onclick="trainStart()">Otra vuelta</button></div>'+
      '<button class="back" onclick="learningList()">‹ Volver a Aprendiendo</button>';

  const c=byId(tPool[0]);
  tDir=Math.random()<0.5?"en":"es";

    ?`<div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div><div class="phrase">${esc(c.fen)}</div>`
    :`<div class="word">${esc(c.es)}</div><div><span class="sense">${esc(c.sense)}</span>${isExpr(c)?XB:""}</div><div class="phrase es">${esc(c.fes)}</div>`;

  <div id="tctrl"><button class="primary" onclick="trainReveal()">Mostrar traducción</button></div>`;

function trainReveal(){
  const c=byId(tPool[0]);
  const back=tDir==="en"
    ?`<div class="divider"></div><div class="word">${esc(c.es)}</div><div><span class="sense">${esc(c.sense)}</span>${isExpr(c)?XB:""}</div><div class="phrase es">${esc(c.fes)}</div>${assocBlock(c)}`
    :`<div class="divider"></div><div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div><div class="phrase">${esc(c.fen)}</div><button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>${assocBlock(c)}`;

function trainNext(){

function trainGot(){

  <div class="card">
    <p class="sub">Fichas totales: <b style="color:var(--ivory)">${S.cards.length}</b> · En juego: <b style="color:var(--ivory)">${inplay}</b> · Dominadas: <b style="color:var(--brass)">${done}</b> · Puntos: <b style="color:var(--brass)">${S.pts}</b></p>
    <p class="sub" style="margin-top:6px">Palabras: <b style="color:var(--ivory)">${S.cards.length-nexpr}</b> · Expresiones: <b style="color:var(--ivory)">${nexpr}</b> (puntúan el doble)</p>
  </div>
  <div class="menu"><button class="big" onclick="masteredList()"><span>Ver dominadas</span><span class="n">${done}</span></button></div>
  <h2>Copia de seguridad</h2>
  <p class="sub">Descarga o copia el archivo completo (fichas + progreso). Guárdalo y compártemelo en el chat para seguimiento.</p>
  <div class="menu" style="margin-top:10px">
    <button class="primary" onclick="exportData()">Descargar copia</button>
    <button class="ghost" onclick="copyData()">Copiar al portapapeles</button>
  </div>
  <h2>Importar</h2>
  <p class="sub">Pega aquí una tanda nueva de fichas (te las genero yo) o una copia de seguridad completa.</p>
  <textarea id="imp" placeholder='[{"id":"...","en":"...","es":"...","sense":"...","ipa":"...","fen":"...","fes":"..."}]'></textarea>
  <div class="menu">
    <button class="primary" onclick="importBatch()">Añadir tanda nueva</button>
    <button class="ghost" onclick="restoreBackup()">Restaurar copia completa</button>
  </div>
  <p class="sub" style="text-align:center;margin-top:6px">Bitácora SLP · v${VERSION}</p>`+backBtn();
}
function masteredList(){
  const list=S.cards.filter(c=>c.st==="done");
  let h='<h2>Dominadas</h2><p class="sub">Tu botín. Estas ya son tuyas.</p><br>';
  if(!list.length)h+='<div class="empty">Aún ninguna.<br>La primera cae en unos 75 días de trabajo constante.</div>';
  list.forEach(c=>{
    h+=`<div class="card">${levelRow(c)}
      <div class="word">${esc(c.en)}</div><div class="ipa">${esc(c.ipa)}</div>
      <div><span class="sense">${esc(c.sense)}</span>${isExpr(c)?XB:""}</div>
      <div class="phrase">${esc(c.fen)}</div>
      <div class="divider"></div>
      <div class="word" style="font-size:20px">${esc(c.es)}</div>
      <div class="phrase es">${esc(c.fes)}</div>
      <button class="speak" onclick="speak('${esc(c.en).replace(/'/g,"\\'")}. ${esc(c.fen).replace(/'/g,"\\'")}')">▶ Escuchar</button>${assocBlock(c)}
    </div>`;
  });
  app.innerHTML=h+backBtn();
}
function exportData(){
  const blob=new Blob([JSON.stringify(S,null,1)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download="bitacora-slp-"+today()+".json";
  a.click();
}
function copyData(){
  navigator.clipboard.writeText(JSON.stringify(S)).then(()=>toast("Copiado")).catch(()=>toast("No se pudo copiar"));
}
function importBatch(){
  try{
    let data=JSON.parse(document.getElementById("imp").value.trim());
    if(!Array.isArray(data))data=data.cards;
    if(!Array.isArray(data))throw 0;
    let added=0,upd=0;
    data.forEach(c=>{
      if(!c.id)return;
      const ex=byId(c.id);
      if(!ex&&c.en&&c.es){
        S.cards.push({id:c.id,en:c.en,es:c.es,sense:c.sense||"",ipa:c.ipa||"",fen:c.fen||"",fes:c.fes||"",assoc:c.assoc||null,st:"pending",due:null,seen:0});
        added++;
      }else if(ex&&c.assoc){
        ex.assoc=c.assoc;upd++;
      }
    });
    save();
    toast(added+" añadidas · "+upd+" asociaciones");dataView();
  }catch(e){toast("Formato no válido");}
}
function restoreBackup(){
  try{
    const data=JSON.parse(document.getElementById("imp").value.trim());
    if(!data.cards||!Array.isArray(data.cards))throw 0;
    if(!confirm("Esto sustituye TODO el progreso actual por el de la copia. ¿Continuar?"))return;
    S=data;save();syncSeed();toast("Copia restaurada");home();
  }catch(e){toast("Formato no válido");}
}

const backBtn=()=>'<button class="back" onclick="home()">‹ Volver al panel</button>';

/* ================= ARRANQUE ================= */
load();
home();

/* Service worker: guarda la app en el móvil para uso sin conexión.
   Si se abre el archivo suelto (sin servidor) falla en silencio y no pasa nada. */
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
